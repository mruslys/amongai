<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neišsiduok! 🤫</title>
    <!-- Font Awesome 6 ikonos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            /* Naudojame dynamic viewport height geresniam telefonų ekranų centravimui */
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px; /* Šiek tiek mažesnis body padding tinka mobiliesiems */
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px; /* Kompaktiškesnis padding išlaiko viską ekrano centre */
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: #e0e0e0;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #e0e0e0;
        }

        h2 i {
            margin-right: 8px; /* Tarpas tarp nustatymų ikonos ir teksto */
            color: #aaa;
        }

        .setup-screen, .game-screen, .settings-screen {
            display: none;
            width: 100%;
        }

        .active {
            display: block;
        }

        /* Sumažinti tarpai nustatymuose, kad tilptų be scroll */
        .input-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .input-group-center {
            margin-bottom: 25px;
            text-align: center;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 6px;
            font-weight: 500;
        }

        /* Skaičiaus pasirinkimo blokas su - ir + */
        .number-picker {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 6px;
        }

        .qty-btn {
            width: 54px;
            height: 54px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
            margin-bottom: 0;
            padding: 0;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .qty-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
        }

        .qty-btn:active:not(:disabled) {
            transform: scale(0.94);
        }

        input[type="number"], input[type="text"], textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            padding: 10px 12px;
        }

        input[type="number"]:focus, input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #4cd137;
        }

        input[type="number"].inline-input {
            width: 100%;
            background: transparent;
            border: none;
            font-size: 1.6rem;
            font-weight: bold;
            text-align: center;
            padding: 0;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        textarea {
            resize: none;
            height: 50px; /* Sumažinta, kad užimtų mažiau vietos telefonu */
            font-size: 0.85rem;
            line-height: 1.4;
        }

        /* Statistikos juosta */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 25px;
        }

        .stat-pill {
            flex: 1;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 8px;
            font-size: 1.15rem;
            color: #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .stat-pill i {
            font-size: 1.25rem;
            color: #fff;
            opacity: 0.95;
        }

        .stat-pill span {
            color: #fff;
            font-weight: bold;
        }

        .stat-pill.danger {
            border-color: rgba(255, 71, 87, 0.25);
            background: rgba(255, 71, 87, 0.05);
        }

        .stat-pill.danger i {
            color: #ff4757;
            text-shadow: 0 0 8px rgba(255, 71, 87, 0.4);
        }

        .stat-pill.danger span {
            color: #ff4757;
        }

        .card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 30px 20px;
            margin-bottom: 25px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .role-title {
            font-size: 2rem;
            font-weight: bold;
            text-transform: capitalize;
            letter-spacing: 1px;
            display: none;
        }

        .role-title.normal {
            color: #4cd137;
        }

        .role-title.neutral {
            color: #ffa502;
            text-shadow: 0 0 10px rgba(255, 165, 2, 0.4);
        }

        .role-title.alert {
            color: #ff4757;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.4);
        }

        .placeholder-text {
            color: #aaa;
            font-size: 1.1rem;
            line-height: 1.4;
        }

        button {
            background: #4cd137;
            color: #1e1e2f;
            border: none;
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 1.15rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s ease, background 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 5px 15px rgba(76, 209, 55, 0.4);
            margin-bottom: 12px;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:hover:not(:disabled) {
            background: #44bd32;
        }

        button:disabled {
            cursor: not-allowed;
            box-shadow: none;
        }

        button.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            box-shadow: none;
            margin-bottom: 0;
        }

        button.secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
            margin-bottom: 5px;
        }

        .btn-group button {
            flex: 1;
            margin-bottom: 0;
            padding: 14px 10px;
        }

        .settings-btn {
            background: transparent;
            color: #aaa;
            box-shadow: none;
            font-size: 1rem;
            font-weight: normal;
            margin-top: 10px;
            margin-bottom: 0;
            padding: 8px;
            border: 1px solid transparent;
        }

        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 1. Nustatymų ekranas (Be bendro žaidimo h1) -->
        <div id="settingsScreen" class="settings-screen">
            <h2><i class="fa-solid fa-gear"></i> Nustatymai</h2>
            
            <div class="input-group">
                <label>🔴 Blogiečiai (atskirkite kableliais):</label>
                <textarea id="setMandatory"></textarea>
            </div>

            <div class="input-group">
                <label>🟠 Neutralūs (atskirkite kableliais):</label>
                <textarea id="setNeutral"></textarea>
            </div>

            <div class="input-group">
                <label>🟢 Geriečiai (atskirkite kableliais):</label>
                <textarea id="setRegular"></textarea>
            </div>

            <div class="input-group">
                <label>👿 Piktadarių žingsnis (kas kiek žaidėjų):</label>
                <input type="number" id="setBadStep" min="1" max="10" value="6">
            </div>

            <div class="input-group">
                <label>⏳ Apsaugos pauzė atvėrus rolę (sekundėmis):</label>
                <input type="number" id="setCooldown" min="0" max="5" step="0.5" value="1.0">
            </div>

            <div class="btn-group">
                <button class="secondary" onclick="resetToFactoryDefaults()">Atstatyti</button>
                <button onclick="saveSettings()">Išsaugoti</button>
            </div>
        </div>

        <!-- 2. Pradžios ekranas -->
        <div id="setupScreen" class="setup-screen active">
            <h1>Neišsiduok! 🤫</h1>
            <div class="input-group-center">
                <label for="playerCount">Žaidėjų skaičius:</label>
                <div class="number-picker">
                    <button type="button" class="qty-btn" onclick="changeCount(-1)">−</button>
                    <input type="number" id="playerCount" class="inline-input" min="3" max="20" value="5" readonly>
                    <button type="button" class="qty-btn" onclick="changeCount(1)">+</button>
                </div>
            </div>
            <button onclick="startGame()">Pradėti žaidimą</button>
            <button class="settings-btn" onclick="openSettings()"><i class="fa-solid fa-gear"></i> Nustatymai</button>
        </div>

        <!-- 3. Žaidimo ekranas -->
        <div id="gameScreen" class="game-screen">
            <h1>Neišsiduok! 🤫</h1>
            <div class="stats-bar">
                <div class="stat-pill" title="Žaidėjų skaičius">
                    <i class="fa-solid fa-users"></i>
                    <span id="statPlayers">0</span>
                </div>
                <div class="stat-pill" title="Liko neatverstų rolių">
                    <i class="fa-solid fa-id-card"></i>
                    <span id="statLeft">0</span>
                </div>
                <div class="stat-pill danger" title="Blogiečių skaičius">
                    <i class="fa-solid fa-skull"></i>
                    <span id="statBad">0</span>
                </div>
            </div>
            
            <div class="card" id="roleCard">
                <span class="placeholder-text" id="initialText">Duokite telefoną kitam žaidėjui ir paspauskite mygtuką</span>
                <div class="role-title" id="roleText"></div>
            </div>

            <button id="actionBtn" onclick="handleAction()">Gauti rolę</button>
            <button class="secondary" onclick="resetGame()">Naujas žaidimas</button>
        </div>
    </div>

    <script>
        const defaultSettings = {
            mandatory: ["imposteris", "trintukas", "ligonis"],
            neutral: ["džakalas"],
            regular: ["žmogus", "gydytojas", "teisėjas", "policininkas"],
            badGuyStep: 6,
            cooldown: 1.0
        };

        let currentSettings = { ...defaultSettings };
        let availableRoles = [];
        let currentState = "READY_TO_GET"; 
        let cooldownTimer = null;

        function loadSettings() {
            const saved = localStorage.getItem("game_settings");
            if (saved) {
                try {
                    currentSettings = JSON.parse(saved);
                } catch (e) {
                    currentSettings = { ...defaultSettings };
                }
            } else {
                currentSettings = { ...defaultSettings };
            }
        }

        function openSettings() {
            loadSettings();
            document.getElementById("setMandatory").value = currentSettings.mandatory.join(", ");
            document.getElementById("setNeutral").value = currentSettings.neutral.join(", ");
            document.getElementById("setRegular").value = currentSettings.regular.join(", ");
            document.getElementById("setBadStep").value = currentSettings.badGuyStep;
            document.getElementById("setCooldown").value = currentSettings.cooldown;

            document.getElementById("setupScreen").classList.remove("active");
            document.getElementById("settingsScreen").classList.add("active");
        }

        function saveSettings() {
            const mandatoryText = document.getElementById("setMandatory").value;
            const neutralText = document.getElementById("setNeutral").value;
            const regularText = document.getElementById("setRegular").value;
            const badStep = parseInt(document.getElementById("setBadStep").value) || 6;
            const cooldown = parseFloat(document.getElementById("setCooldown").value) || 1.0;

            currentSettings.mandatory = mandatoryText.split(",").map(r => r.trim().toLowerCase()).filter(Boolean);
            currentSettings.neutral = neutralText.split(",").map(r => r.trim().toLowerCase()).filter(Boolean);
            currentSettings.regular = regularText.split(",").map(r => r.trim().toLowerCase()).filter(Boolean);
            currentSettings.badGuyStep = Math.max(1, badStep);
            currentSettings.cooldown = Math.max(0, cooldown);

            localStorage.setItem("game_settings", JSON.stringify(currentSettings));

            document.getElementById("settingsScreen").classList.remove("active");
            document.getElementById("setupScreen").classList.add("active");
        }

        function resetToFactoryDefaults() {
            if (confirm("Ar tikrai norite atstatyti gamyklines žaidimo roles ir taisykles?")) {
                currentSettings = { ...defaultSettings };
                localStorage.setItem("game_settings", JSON.stringify(currentSettings));
                
                // Uždaryti nustatymus ir atverti pradinį langą
                document.getElementById("settingsScreen").classList.remove("active");
                document.getElementById("setupScreen").classList.add("active");
            }
        }

        function changeCount(delta) {
            const countInput = document.getElementById("playerCount");
            let current = parseInt(countInput.value) || 5;
            let next = current + delta;
            if (next >= 3 && next <= 20) {
                countInput.value = next;
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startGame() {
            loadSettings(); 
            const countInput = document.getElementById("playerCount");
            let playerCount = parseInt(countInput.value);

            if (isNaN(playerCount) || playerCount < 3) {
                alert("Žaidimui reikia bent 3 žaidėjų!");
                return;
            }

            let imposterCount = Math.floor((playerCount - 1) / currentSettings.badGuyStep) + 1;

            let shuffledMandatory = shuffleArray([...currentSettings.mandatory]);
            imposterCount = Math.min(imposterCount, shuffledMandatory.length);
            
            let chosenImposters = shuffledMandatory.slice(0, imposterCount);

            let otherAvailable = [...currentSettings.neutral, ...currentSettings.regular];
            let shuffledOthers = shuffleArray(otherAvailable);

            let gameRoles = [...chosenImposters, ...shuffledOthers];

            const fillerRole = currentSettings.regular[0] || "žmogus";
            while (gameRoles.length < playerCount) {
                gameRoles.push(fillerRole);
            }

            if (gameRoles.length > playerCount) {
                gameRoles = gameRoles.slice(0, playerCount);
            }

            availableRoles = shuffleArray(gameRoles);

            document.getElementById("statPlayers").textContent = playerCount;
            document.getElementById("statBad").textContent = imposterCount;

            document.getElementById("setupScreen").classList.remove("active");
            document.getElementById("gameScreen").classList.add("active");
            
            resetToHiddenState();
            updateCounter();
        }

        function updateCounter() {
            document.getElementById("statLeft").textContent = availableRoles.length;
        }

        function resetToHiddenState() {
            clearTimeout(cooldownTimer);
            currentState = "READY_TO_GET";
            
            document.getElementById("initialText").style.display = "block";
            document.getElementById("initialText").textContent = "Duokite telefoną kitam žaidėjui ir paspauskite mygtuką";
            
            const roleText = document.getElementById("roleText");
            roleText.style.display = "none";
            roleText.textContent = "";
            roleText.className = "role-title"; 
            
            const actionBtn = document.getElementById("actionBtn");
            actionBtn.disabled = false;
            actionBtn.style.opacity = "1";
            actionBtn.textContent = "Gauti rolę";
        }

        function handleAction() {
            const roleText = document.getElementById("roleText");
            const initialText = document.getElementById("initialText");
            const actionBtn = document.getElementById("actionBtn");

            if (currentState === "READY_TO_GET") {
                const selectedRole = availableRoles.shift();

                initialText.style.display = "none";
                roleText.textContent = selectedRole;
                
                if (currentSettings.mandatory.includes(selectedRole)) {
                    roleText.className = "role-title alert";
                } else if (currentSettings.neutral.includes(selectedRole)) {
                    roleText.className = "role-title neutral";
                } else {
                    roleText.className = "role-title normal";
                }

                roleText.style.display = "block";
                updateCounter();
                currentState = "ROLE_SHOWN";

                actionBtn.disabled = true;
                actionBtn.style.opacity = "0.5";
                actionBtn.textContent = "Įsiminkite rolę...";

                const cooldownMs = currentSettings.cooldown * 1000;

                cooldownTimer = setTimeout(() => {
                    actionBtn.disabled = false;
                    actionBtn.style.opacity = "1";
                    
                    if (availableRoles.length === 0) {
                        actionBtn.textContent = "Įsiminiau! Pradėti žaidimą ➔";
                    } else {
                        actionBtn.textContent = "Įsiminiau! Kitas žaidėjas ➔";
                    }
                }, cooldownMs);

            } else {
                if (availableRoles.length === 0) {
                    initialText.style.display = "block";
                    initialText.textContent = "Rolės išdalintos! Pradėkite žaidimą!";
                    roleText.style.display = "none";
                    actionBtn.disabled = true;
                    actionBtn.style.opacity = "0.5";
                    actionBtn.textContent = "Žaidimas vyksta";
                    return;
                }
                resetToHiddenState();
            }
        }

        function resetGame() {
            clearTimeout(cooldownTimer);
            document.getElementById("gameScreen").classList.remove("active");
            document.getElementById("setupScreen").classList.add("active");
        }

        loadSettings();
    </script>

</body>
</html>
