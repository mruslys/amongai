<style>
 :root {
 color-scheme: dark;
 --bg: #090a0f;
 --surface: #12151f;
 --surface-2: #1a1f2e;
 --border: #262c40;
 --border-float: #353e59;
 --text: #f3f4f6;
 --muted: #8b95a5;
 --c-none: #4b5563;
 --c-red: #ef4444;
 --c-amber: #f59e0b;
 --c-emerald: #10b981;
 --c-cyan: #06b6d4;
 --c-blue: #3b82f6;
 --c-purple: #a855f7;
 --c-pink: #ec4899;
 --c-gray: #9ca3af;
 --c-white: #ffffff;
 --accent: var(--c-blue);
 }

 * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
 input, textarea, select { user-select: text; -webkit-user-select: text; font-family: inherit; }
 body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

 #app { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 18px; transition: box-shadow 0.25s ease; }
 .screen-scroll { position: absolute; inset: 0; width: 100%; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; align-items: center; padding: 78px 18px 0 18px; z-index: 10; }
 .screen-scroll::after { content: ""; display: block; width: 100%; height: 36px; flex-shrink: 0; }
 .screen-scroll.pregame-scroll::after { height: 118px; }

 .edge-fade-top, .edge-fade-bottom { position: fixed; left: 0; right: 0; pointer-events: none; z-index: 90; }
 .edge-fade-top { top: 0; height: 76px; background: linear-gradient(to bottom, rgba(9, 10, 15, 0.92) 0%, rgba(9, 10, 15, 0.55) 55%, rgba(9, 10, 15, 0) 100%); }
 .edge-fade-bottom { bottom: 0; height: 112px; background: linear-gradient(to top, rgba(9, 10, 15, 0.94) 0%, rgba(9, 10, 15, 0.6) 55%, rgba(9, 10, 15, 0) 100%); }

 .fx-start { animation: flashEdge 0.9s ease-out; }
 .fx-end { animation: pulseEdge 0.8s infinite alternate; }
 .fx-alarm { animation: alarmFlash 0.35s infinite alternate !important; }

 @keyframes flashEdge { 0% { box-shadow: inset 0 0 110px var(--accent), inset 0 0 40px var(--accent); } 100% { box-shadow: inset 0 0 0px transparent; } }
 @keyframes pulseEdge { 0% { box-shadow: inset 0 0 25px var(--accent); } 100% { box-shadow: inset 0 0 95px var(--accent), inset 0 0 35px var(--accent); } }
 @keyframes alarmFlash { 0% { box-shadow: inset 0 0 30px var(--c-red); background: #1f0909; } 100% { box-shadow: inset 0 0 120px var(--c-red); background: #3b0a0a; } }

 .locked { pointer-events: none !important; }
 .lock-bar { position: fixed; top: 0; left: 0; height: 4px; background: var(--accent); width: 0%; z-index: 250; }
 .lock-bar.active { animation: lockProgress 0.6s linear forwards; }
 @keyframes lockProgress { 0% { width: 100%; opacity: 1; } 100% { width: 0%; opacity: 0; } }

 .top-bar { width: 100%; max-width: 540px; display: flex; justify-content: space-between; align-items: center; min-height: 48px; flex-shrink: 0; position: relative; z-index: 130; pointer-events: none; }
 .top-bar.center-bar { justify-content: center; }
 .top-bar > * { pointer-events: auto; }
 .top-actions { display: flex; gap: 10px; align-items: center; }
 .bottom-bar { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 14px; align-items: center; padding-bottom: 6px; flex-shrink: 0; position: relative; z-index: 130; pointer-events: none; }
 .action-row { display: flex; gap: 20px; justify-content: center; align-items: center; width: 100%; pointer-events: none; }
 .action-row > *, .finals-tray, .phase-aux > * { pointer-events: auto; }

 button { background: rgba(18, 21, 31, 0.84); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 2px solid var(--border-float); color: var(--text); border-radius: 50%; width: 62px; height: 62px; font-size: 1.4rem; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 22px -4px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.04); transition: transform 0.1s, border-color 0.2s, background 0.2s, color 0.2s, box-shadow 0.2s; padding: 0; }
 button:active { transform: scale(0.92); }
 button.sm { width: 42px; height: 42px; font-size: 1.05rem; }
 button.xs { width: 36px; height: 36px; font-size: 0.95rem; border-width: 1px; box-shadow: none; }
 button.lg { width: 78px; height: 78px; font-size: 1.85rem; background: rgba(14, 17, 26, 0.9); border-color: var(--accent); box-shadow: 0 12px 30px -4px rgba(0, 0, 0, 0.9), 0 0 26px -4px var(--accent); }
 button.danger { border-color: var(--c-red); color: var(--c-red); }
 button.danger.active-alarm { background: var(--c-red); color: #fff; box-shadow: 0 0 25px var(--c-red); }
 button.pulse-btn { border-color: var(--accent); animation: btnPulse 0.7s infinite alternate; }
 @keyframes btnPulse { from { transform: scale(1); box-shadow: 0 8px 22px -4px rgba(0, 0, 0, 0.85), 0 0 5px var(--accent); } to { transform: scale(1.12); box-shadow: 0 10px 26px -4px rgba(0, 0, 0, 0.9), 0 0 25px var(--accent); } }

 .hold-btn { touch-action: none; }
 .hold-btn.holding { transform: scale(1.14); border-color: var(--hold-color, var(--c-red)); color: var(--hold-color, var(--c-red)); box-shadow: 0 0 22px var(--hold-color, var(--c-red)); }

 /* --- Pregame & Editor & Playing --- */
 .game-header { text-align: center; margin: 2px 0 12px; width: 100%; max-width: 460px; flex-shrink: 0; }
 .game-title { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.02em; border-bottom: 3px solid var(--accent); padding-bottom: 6px; display: inline-block; word-break: break-word; }
 .counter-pill { font-size: 1.25rem; font-weight: 700; color: var(--text); display: inline-flex; align-items: center; gap: 12px; background: rgba(18, 21, 31, 0.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 8px 20px; border-radius: 999px; border: 1px solid var(--border-float); box-shadow: 0 6px 18px -4px rgba(0, 0, 0, 0.6); flex-shrink: 0; }
 .card-list { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 8px; padding: 4px 0; margin-top: 14px; flex-shrink: 0; }
 .card-row { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--border); padding: 9px 14px; border-radius: 12px; border-left: 5px solid var(--row-color, var(--border)); gap: 10px; flex-shrink: 0; }
 .card-row-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
 .card-row-title { font-size: 1.08rem; font-weight: 600; word-break: break-word; }
 .card-row-group { font-size: 0.78rem; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
 .stepper { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
 .stepper button { width: 34px; height: 34px; font-size: 0.95rem; box-shadow: none; background: var(--surface-2); border-color: var(--border); }
 .stepper span { font-size: 1.15rem; font-weight: 700; min-width: 24px; text-align: center; }

 .card-stage { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
 .playing-card { position: fixed; inset: 0; width: 100%; height: 100%; border-radius: 0; border: none; background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--card-color, var(--accent)) 14%, var(--surface)), var(--bg) 85%); box-shadow: inset 0 0 28px -12px var(--card-color, var(--accent)); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 84px 24px; text-align: center; cursor: pointer; z-index: 20; transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1); }
 .playing-card:active { transform: none; }
 .playing-card.face-down { background: repeating-linear-gradient(135deg, #0d1017, #0d1017 16px, #141824 16px, #141824 32px); box-shadow: none; }
 .card-back-emblem { width: 82px; height: 82px; border-radius: 50%; border: 3px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 2.1rem; color: var(--accent); box-shadow: 0 0 22px -4px var(--accent); background: rgba(9, 10, 15, 0.75); }
 .card-face-group { font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px; padding: 4px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); max-width: 100%; word-break: break-word; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
 .card-face-title { font-size: 2.2rem; font-weight: 800; line-height: 1.25; word-break: break-word; color: var(--card-text-color, var(--text)); text-shadow: 0 4px 16px rgba(0,0,0,0.8), 0 1px 3px rgba(0,0,0,0.9); }
 .card-check-btn { margin-top: 28px; pointer-events: none; flex-shrink: 0; }
 .return-btn-wrap { position: fixed; bottom: 32px; left: 0; right: 0; z-index: 25; display: flex; justify-content: center; pointer-events: none; }

 .phase-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; width: 100%; max-width: 540px; min-height: 0; }
 .phase-spacer-top { flex: 1; width: 100%; min-height: 8px; }
 .phase-core { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; width: 100%; }
 .phase-title { font-size: 1.9rem; font-weight: 700; color: var(--accent); max-width: 90%; }
 .timer-display { font-size: clamp(4rem, 17vw, 6.2rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0.03em; line-height: 1.05; white-space: nowrap; }
 .timer-blink { color: var(--c-red); animation: blinkTxt 0.5s infinite alternate; }
 .timer-overdue { color: var(--c-red); }
 @keyframes blinkTxt { from { opacity: 1; } to { opacity: 0.2; } }

 .phase-aux { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 10px 0; min-height: 8px; position: relative; z-index: 130; pointer-events: none; }
 .finals-tray { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; width: 100%; position: relative; z-index: 130; }
 .final-token { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--token-color); color: var(--token-color); font-size: 1.2rem; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 14px -3px var(--token-color); background: #141824; touch-action: none; position: relative; transition: transform 0.15s, box-shadow 0.15s; }
 .final-token.holding { transform: scale(1.16); box-shadow: 0 0 28px var(--token-color); }

 #hold-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 120; display: flex; align-items: center; justify-content: center; padding: 18px; background: rgba(9, 10, 15, 0.92); opacity: 0; visibility: hidden; }
 #hold-overlay.active { visibility: visible; }
 #hold-overlay .hold-target { transform: scale(var(--hold-scale, 0.88)); transition: none; }
 .hold-symbol-badge { width: 132px; height: 132px; border-radius: 50%; background: var(--surface); border: 4px solid var(--badge-color, var(--c-red)); color: var(--badge-color, var(--c-red)); box-shadow: 0 12px 40px -10px rgba(0,0,0,0.8), 0 0 36px -6px var(--badge-color, var(--c-red)); display: flex; align-items: center; justify-content: center; font-size: 4rem; }
 .btn-confirm { border-color: var(--c-emerald) !important; color: var(--c-emerald) !important; box-shadow: 0 8px 22px -4px rgba(0, 0, 0, 0.85), 0 0 16px -3px var(--c-emerald) !important; }

 .editor-wrap { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 16px; flex-shrink: 0; }
 .editor-section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }
 .section-head { display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; min-height: 36px; }
 .section-head-label { display: inline-flex; align-items: center; gap: 7px; }
 .hash-badge { font-family: monospace; font-size: 0.8rem; background: var(--surface-2); padding: 3px 8px; border-radius: 6px; color: var(--c-cyan); border: 1px solid var(--border); }
 .field-row { display: flex; flex-direction: column; gap: 6px; }
 .field-icon { color: var(--muted); font-size: 1rem; }
 .text-input { width: 100%; min-width: 0; flex: 1; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: 1rem; outline: none; }
 .text-input:focus { border-color: var(--accent); }
 .palette-row { display: flex; gap: 8px; flex-wrap: wrap; }
 .color-swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.15s; }
 .color-swatch.selected { border-color: #fff; transform: scale(1.18); box-shadow: 0 0 10px currentColor; }
 .editor-item-list { display: flex; flex-direction: column; gap: 10px; }
 .editor-item { background: var(--surface-2); border: 1px solid var(--border); border-left: 4px solid var(--item-color, var(--border)); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; max-height: 150px; overflow: hidden; flex-shrink: 0; transition: transform 0.16s ease, opacity 0.22s ease, max-height 0.22s ease, padding 0.22s ease, margin 0.22s ease, border-color 0.2s; }
 .editor-item.deleting-item { opacity: 0 !important; transform: scale(0.93) !important; max-height: 0 !important; padding-top: 0 !important; padding-bottom: 0 !important; margin-top: -10px !important; border-width: 0 !important; pointer-events: none !important; }
 .editor-item-main { display: flex; align-items: center; gap: 10px; width: 100%; }
 .editor-item-subrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: nowrap; padding-top: 8px; border-top: 1px dashed var(--border); }
 .color-cycle-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.55); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: rgba(255,255,255,0.92); transition: transform 0.12s ease; }
 .color-cycle-btn:active { transform: scale(0.9); }
 .color-cycle-btn.is-none { border: 2px dashed var(--muted); background: var(--bg) !important; color: var(--muted); }
 .color-cycle-btn.is-white { color: #090a0f; border-color: #fff; }
 .num-input { width: 68px; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 7px 8px; border-radius: 8px; font-size: 1rem; text-align: center; outline: none; }
 .num-input:focus { border-color: var(--accent); }
 .icon-btn { width: 34px; height: 34px; border-radius: 8px; font-size: 0.9rem; background: var(--bg); border: 1px solid var(--border); color: var(--muted); flex-shrink: 0; box-shadow: none; }
 .icon-btn:hover { color: var(--text); }
 .icon-btn.del:hover { color: var(--c-red); border-color: var(--c-red); }
 .icon-btn.active-toggle { color: var(--accent); border-color: var(--accent); background: rgba(59, 130, 246, 0.12); }
 .toggle-group { display: flex; gap: 6px; align-items: center; }
</style>
</head>

<script>

    },

      "color": "amber"
    }
  ]
};

const APP_DEFAULT_TITLE = 'Amongai — C4RDx5';
const CUSTOM_GAME_STORAGE_KEY = 'c4rdx5-amongai-config-v1';
const SESSION_TTL_MS = 6 * 60 * 60 * 1000;
const ZERO_BLINK_SEC = 3;

function getGameTitleWithHash(gameObj) {
 if (!gameObj) return APP_DEFAULT_TITLE;
 const baseTitle = (gameObj.title || 'Amongai').trim();
 return gameObj.hash ? `${baseTitle} [${gameObj.hash}]` : baseTitle;
}

const Haptics = {
 vibrate(pattern) { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (_) {} },
 tap() { this.vibrate(12); },
 cardFlip() { this.vibrate(18); },
 holdPulse() { this.vibrate(22); },
 holdComplete() { this.vibrate([40, 30, 65]); },
 phaseStart() { this.vibrate(35); },
 tick() { this.vibrate(15); },
 phaseEnd() { this.vibrate([120, 60, 120, 60, 180]); },
 alarm() { this.vibrate([160, 80, 160]); },
 finalWin() { this.vibrate([60, 40, 60, 40, 160]); }
};

const HOLD_CONFIG = { FILL_MS: 1300, DECAY_MS: 650, INITIAL_JUMP: 0.32, REPRESS_BOOST: 0.08, MAX_BOOST_CAP: 0.88 };

const HoldEngine = {
 activeKey: null, isHolding: false, progress: 0, lastTime: 0, rafId: null, handler: null,
 start(key, handler, e) {
 if (e) { e.stopPropagation(); e.preventDefault(); }
 if (state.locked) return;
 if (isPlayAudioAllowed()) SoundEngine.unlock();
 if (this.activeKey !== key) {
 this.reset(); this.activeKey = key; this.progress = 0; this.handler = handler;
 if (handler.onSetup) handler.onSetup();
 } else {
 this.handler = handler; if (handler.onSetup) handler.onSetup();
 }
 this.isHolding = true; this.lastTime = performance.now();
 if (this.progress < HOLD_CONFIG.INITIAL_JUMP) this.progress = HOLD_CONFIG.INITIAL_JUMP;
 else this.progress = Math.min(HOLD_CONFIG.MAX_BOOST_CAP, this.progress + HOLD_CONFIG.REPRESS_BOOST);
 Haptics.holdPulse();
 if (isPlayAudioAllowed()) SoundEngine.playHoldPulse(this.progress, Boolean(handler.isDanger));
 if (this.handler.onUpdate) this.handler.onUpdate(this.progress, true);
 if (!this.rafId) this.rafId = requestAnimationFrame(t => this.step(t));
 },
 release() {
 if (!this.activeKey) return;
 this.isHolding = false;
 if (this.handler && this.handler.onRelease) this.handler.onRelease(this.progress);
 },
 reset() {
 if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }
 if (this.handler && this.handler.onCleanup) this.handler.onCleanup();
 this.activeKey = null; this.isHolding = false; this.progress = 0; this.handler = null;
 },
 step(now) {
 if (!this.activeKey || !this.handler) return this.reset();
 const dt = Math.min(80, Math.max(0, now - this.lastTime));
 this.lastTime = now;
 if (this.isHolding) {
 this.progress = Math.min(1, this.progress + dt / HOLD_CONFIG.FILL_MS);
 if (this.handler.onUpdate) this.handler.onUpdate(this.progress, true);
 if (this.progress >= 1) {
 const doneFn = this.handler.onComplete;
 this.reset(); Haptics.holdComplete(); if (doneFn) doneFn(); return;
 }
 } else {
 this.progress = Math.max(0, this.progress - dt / HOLD_CONFIG.DECAY_MS);
 if (this.handler.onUpdate) this.handler.onUpdate(this.progress, false);
 if (this.progress <= 0) return this.reset();
 }
 this.rafId = requestAnimationFrame(t => this.step(t));
 },
 startOverlayHold({ key, btnId, colorCss, innerHtml, isDanger = false, noGlow = false, onComplete }) {
 this.start(key, {
 isDanger,
 onSetup() {
 const overlay = document.getElementById('hold-overlay');
 if (overlay) { 
   overlay.innerHTML = innerHtml; 
   if (!noGlow) { overlay.style.boxShadow = `inset 0 0 90px ${colorCss}, inset 0 0 30px ${colorCss}`; } 
   else { overlay.style.boxShadow = 'none'; }
   overlay.classList.add('active'); 
 }
 const btn = btnId ? document.getElementById(btnId) : null; if (btn) btn.classList.add('holding');
 },
 onUpdate(p) {
 const overlay = document.getElementById('hold-overlay');

}
function startDealing() {
 HoldEngine.reset(); Haptics.tap(); state.screen = 'DEAL'; SoundEngine.unlock(); SoundEngine.startKeepAlive(); requestWakeLock(); clearAppEffects(); setAccent(state.baseGame.color);
 SessionStore.saveForGame(state.baseGame.hash, state.customCounts);
 state.deck = buildSessionDeck(); state.dealIndex = 0; state.cardFaceUp = false; state.currentCard = null;
 if (state.deck.length === 0) state.screen = 'DEAL_DONE';
 render();
}
function handleCardTap() {
 if (state.locked) return;
 if (!state.cardFaceUp) {
 state.cardFaceUp = true; state.currentCard = state.deck[state.dealIndex];
 const resolvedColor = resolveCardColorKey(state.baseGame, state.currentCard); setAccent(resolvedColor);
 Haptics.cardFlip(); SoundEngine.playCardFlip(true); render();
 } else {
 Haptics.cardFlip(); SoundEngine.playCardFlip(false); state.dealIndex++; state.cardFaceUp = false; state.currentCard = null; setAccent(state.baseGame.color);
 if (state.dealIndex >= state.deck.length) state.screen = 'DEAL_DONE';
 render(); triggerBarrier();
 }
}

function startPhases() { HoldEngine.reset(); state.screen = 'PHASE'; SoundEngine.unlock(); SoundEngine.startKeepAlive(); requestWakeLock(); SessionStore.saveForGame(state.baseGame.hash, state.customCounts); state.phaseIndex = 0; state.firstLap = true; state.alarmActive = false; loadCurrentPhase(); }
function triggerPhaseStartEffect() {
 const app = document.getElementById('app'); if (state.fxStartTimer) { clearTimeout(state.fxStartTimer); state.fxStartTimer = null; }
 app.classList.remove('fx-start'); void app.offsetWidth; app.classList.add('fx-start');
 state.fxStartTimer = setTimeout(() => { app.classList.remove('fx-start'); state.fxStartTimer = null; }, 920);
}
function loadCurrentPhase() {
 HoldEngine.reset(); stopPhaseTimer(); SoundEngine.stopSiren(); SoundEngine.startKeepAlive(); clearAppEffects(); state.alarmActive = false;
 const hasPhases = state.baseGame.phases && state.baseGame.phases.length > 0;
 if (!hasPhases) {
 setAccent(state.baseGame.color); state.timeLeft = 0; state.elapsedSec = 0; state.phaseStartTs = performance.now(); state.phaseEndTriggered = false;
 startPhaseTimer(0); render(); return;
 }
 const phase = state.baseGame.phases[state.phaseIndex]; setAccent(phase.color);
 triggerPhaseStartEffect(); Haptics.phaseStart(); SoundEngine.playPhaseStart();
 const durationSec = (phase.duration && phase.duration > 0) ? Number(phase.duration) : 0;
 state.timeLeft = durationSec; state.elapsedSec = 0; state.phaseStartTs = performance.now(); state.phaseEndTriggered = false;
 startPhaseTimer(durationSec); render();
}
function startPhaseTimer(durationSec) {
 stopPhaseTimer();
 const hasLimit = durationSec > 0;
 state.timerInterval = setInterval(() => {
 const elapsedSec = Math.floor(Math.max(0, performance.now() - state.phaseStartTs) / 1000);
 let changed = false;
 if (elapsedSec !== state.elapsedSec) {
 state.elapsedSec = elapsedSec;
 changed = true;
 }
 if (hasLimit) {
 const nextLeft = Math.max(0, durationSec - elapsedSec);
 if (nextLeft !== state.timeLeft) {
 state.timeLeft = nextLeft;
 changed = true;
 if (state.timeLeft > 0 && state.timeLeft <= 5) { Haptics.tick(); SoundEngine.playTick(); }
 if (state.timeLeft === 0 && !state.phaseEndTriggered) {
 state.phaseEndTriggered = true;
 document.getElementById('app').classList.add('fx-end');
 Haptics.phaseEnd(); SoundEngine.playPhaseEnd();
 }
 }
 }
 if (changed) renderTimerOnly();
 }, 200);
}
function stopPhaseTimer() { if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; } }
function triggerAlarm() {
 SoundEngine.unlock(); state.alarmActive = !state.alarmActive; const app = document.getElementById('app'); app.classList.toggle('fx-alarm', state.alarmActive);
 if (state.alarmActive) { Haptics.alarm(); SoundEngine.startSiren(); } else { Haptics.tap(); SoundEngine.stopSiren(); }
 render();
}
function getNextPhaseIndex() {
 const phases = state.baseGame.phases || []; if (phases.length === 0) return -1;
 if (state.firstLap) { if (state.phaseIndex + 1 < phases.length) return state.phaseIndex + 1; return phases.findIndex(p => p.loop); }
 else { for (let i = state.phaseIndex + 1; i < phases.length; i++) { if (phases[i].loop) return i; } for (let i = 0; i <= state.phaseIndex; i++) { if (phases[i].loop) return i; } return -1; }
}
function nextPhase() { SoundEngine.unlock(); const phases = state.baseGame.phases || []; if (state.firstLap && state.phaseIndex + 1 >= phases.length) state.firstLap = false; const nextIdx = getNextPhaseIndex(); if (nextIdx !== -1) { state.phaseIndex = nextIdx; loadCurrentPhase(); } }
function closeFinalCard() { if (state.locked) return; Haptics.tap(); SoundEngine.playCardFlip(false); goToPregame(); }
function clearAppEffects() { if (state.fxStartTimer) { clearTimeout(state.fxStartTimer); state.fxStartTimer = null; } const app = document.getElementById('app'); app.classList.remove('fx-start', 'fx-end', 'fx-alarm'); }
function formatTime(sec) { const m = String(Math.floor(sec / 60)).padStart(2, '0'); const s = String(sec % 60).padStart(2, '0'); return `${m}:${s}`; }
function escapeHtml(str) { return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function getPhaseTimerView() {
 const phase = (state.baseGame.phases || [])[state.phaseIndex];
 const durationSec = (phase && phase.duration > 0) ? Number(phase.duration) : 0;
 const hasLimit = durationSec > 0;
 if (!hasLimit) {
 return {
  text: formatTime(state.elapsedSec),
  isExpired: false,
  isBlinking: false,
  isOverdue: false,
  nextIcon: 'fa-check'
 };
 }
 if (state.elapsedSec < durationSec) {
 return {
  text: formatTime(state.timeLeft),
  isExpired: false,
  isBlinking: false,
  isOverdue: false,
  nextIcon: 'fa-forward'
 };
 }
 const overSec = state.elapsedSec - durationSec;
 if (overSec < ZERO_BLINK_SEC) {
 return {
  text: '00:00',
  isExpired: true,
  isBlinking: true,
  isOverdue: false,
  nextIcon: 'fa-check'
 };
 }
 return {
 text: formatTime(overSec - ZERO_BLINK_SEC + 1),
 isExpired: true,
 isBlinking: false,
 isOverdue: true,
 nextIcon: 'fa-check'
 };
}

function renderTimerOnly() {
 const el = document.getElementById('timer-val');
 const nextBtn = document.getElementById('next-phase-btn');
 if (!el) { render(); return; }
 const tv = getPhaseTimerView();
 el.textContent = tv.text;
 el.classList.toggle('timer-blink', tv.isBlinking);
 el.classList.toggle('timer-overdue', tv.isOverdue);
 if (nextBtn) {
 nextBtn.classList.toggle('pulse-btn', tv.isExpired);
 const iconEl = nextBtn.querySelector('i');
 if (iconEl) iconEl.className = `fa-solid ${tv.nextIcon}`;
 }
}

// === RENDER SUBSYSTEM ===
function renderPregame(app, savedScroll) {
 const game = state.baseGame; let deckCount = 0; let modeControlsHtml = '';
 const hasCards = game.cards && game.cards.length > 0;
 if (hasCards) {
 deckCount = getCustomDeckSize();
 const rows = game.cards.map(c => { const resolvedColor = resolveCardColorKey(game, c); const grp = getGroupById(game, c.groupId); return `<div class="card-row" style="--row-color: ${getColorCss(resolvedColor, 'var(--border)')}"><div class="card-row-info"><span class="card-row-title">${escapeHtml(c.title)}</span>${grp ? `<span class="card-row-group">${escapeHtml(grp.title)}</span>` : ''}</div><div class="stepper"><button class="sm" onclick="adjustCustomCount('${c.id}', -1)"><i class="fa-solid fa-minus"></i></button><span>${state.customCounts[c.id] ?? 0}</span><button class="sm" onclick="adjustCustomCount('${c.id}', 1)"><i class="fa-solid fa-plus"></i></button></div></div>`; }).join('');
 modeControlsHtml = `<div class="counter-pill"><i class="fa-solid fa-users"></i> ${deckCount}</div><div class="card-list">${rows}</div>`;
 }
 const showBottomActions = hasCards && deckCount > 0;
 app.innerHTML = `<div class="edge-fade-top"></div>${showBottomActions ? `<div class="edge-fade-bottom"></div>` : ''}<div class="top-bar center-bar"><div class="top-actions"><button class="sm" onclick="openEditorFromPregame()"><i class="fa-solid fa-pen-to-square"></i></button><button class="sm" onclick="SoundEngine.toggleMute()"><i class="fa-solid ${SoundEngine.muted ? 'fa-volume-xmark' : 'fa-volume-high'}"></i></button></div></div><div class="screen-scroll pregame-scroll"><div class="game-header"><div class="game-title">${escapeHtml(game.title)}</div></div>${modeControlsHtml}</div><div class="bottom-bar"><div class="action-row">${showBottomActions ? `<button class="lg" onclick="startDealing()"><i class="fa-solid fa-masks-theater"></i></button>` : ''}</div></div>`;
 const el = app.querySelector('.pregame-scroll'); if (el && savedScroll > 0) el.scrollTop = savedScroll;
}

function renderEditor(app, savedScroll) {
 const d = state.editorDraft; const dirty = isEditorDirty();
 const paletteHtml = COLOR_KEYS.map(ck => `<div class="color-swatch ${d.color === ck ? 'selected' : ''}" style="background: ${PALETTE[ck]}; color: ${PALETTE[ck]}" onpointerdown="event.preventDefault()" onclick="Haptics.tap(); state.editorDraft.color='${ck}'; setAccent('${ck}'); updateDraftHashBadge(); render();"></div>`).join('');
 const groupsHtml = d.groups.map((grp, i) => { const isNone = !grp.color || grp.color === 'none'; const isWhite = grp.color === 'white'; const itemColorCss = getColorCss(grp.color, 'var(--border)'); return `<div id="ed-item-group-${i}" class="editor-item" style="--item-color: ${itemColorCss}"><div class="editor-item-main"><div class="color-cycle-btn ${isNone ? 'is-none' : ''} ${isWhite ? 'is-white' : ''}" style="background: ${isNone ? 'transparent' : PALETTE[grp.color]}" onpointerdown="event.preventDefault()" onclick="Haptics.tap(); state.editorDraft.groups[${i}].color = cycleItemColor('${grp.color}'); updateDraftHashBadge(); render();">${isNone ? '<i class="fa-solid fa-ban"></i>' : ''}</div><input class="text-input" value="${escapeHtml(grp.title)}" placeholder="Grupės pavadinimas" oninput="state.editorDraft.groups[${i}].title = this.value; updateDraftHashBadge();" /><button id="ed-del-group-${i}" class="icon-btn del hold-btn" oncontextmenu="return false;" onpointerdown="startEditorItemDeleteHold('group', ${i}, event)"><i class="fa-solid fa-trash"></i></button></div></div>`; }).join('');
 const cardsHtml = d.cards.map((c, i) => { 
      const grp = getGroupById(d, c.groupId); 
      const resolvedColorKey = resolveCardColorKey(d, c); 
      const isNone = resolvedColorKey === 'none'; 
      const isWhite = resolvedColorKey === 'white'; 
      const itemColorCss = getColorCss(resolvedColorKey, 'var(--border)'); 
      const groupTextColor = isNone ? 'var(--muted)' : PALETTE[resolvedColorKey];
 
      return `<div id="ed-item-card-${i}" class="editor-item" style="--item-color: ${itemColorCss}">
          <div class="editor-item-main">
              <div class="color-cycle-btn ${isNone ? 'is-none' : ''} ${isWhite ? 'is-white' : ''}" title="${grp ? escapeHtml(grp.title) : 'Be grupės'}" style="background: ${isNone ? 'transparent' : PALETTE[resolvedColorKey]}" onpointerdown="event.preventDefault()" onclick="cycleCardGroupInEditor(${i})"><i class="fa-solid fa-flag"></i></div>
              <div style="display: flex; flex-direction: column; flex: 1; gap: 4px; min-width: 0;">
                  <input class="text-input" value="${escapeHtml(c.title)}" placeholder="Rolės pavadinimas" oninput="state.editorDraft.cards[${i}].title = this.value; updateDraftHashBadge();" />
                  <span style="font-size: 0.78rem; font-weight: 600; color: ${groupTextColor}; padding-left: 12px;">${grp ? escapeHtml(grp.title) : 'Be grupės'}</span>
              </div>
              <button id="ed-del-card-${i}" class="icon-btn del hold-btn" oncontextmenu="return false;" onpointerdown="startEditorItemDeleteHold('card', ${i}, event)"><i class="fa-solid fa-trash"></i></button>
          </div>
      </div>`; 
  }).join('');
 const phasesHtml = d.phases.map((p, i) => { const isNone = !p.color || p.color === 'none'; const isWhite = p.color === 'white'; const itemColorCss = getColorCss(p.color, 'var(--border)'); return `<div id="ed-item-phase-${i}" class="editor-item" style="--item-color: ${itemColorCss}"><div class="editor-item-main"><div class="color-cycle-btn ${isNone ? 'is-none' : ''} ${isWhite ? 'is-white' : ''}" style="background: ${isNone ? 'transparent' : PALETTE[p.color]}" onpointerdown="event.preventDefault()" onclick="Haptics.tap(); state.editorDraft.phases[${i}].color = cycleItemColor('${p.color}'); updateDraftHashBadge(); render();">${isNone ? '<i class="fa-solid fa-ban"></i>' : ''}</div><input class="text-input" value="${escapeHtml(p.title)}" placeholder="Fazės pavadinimas" oninput="state.editorDraft.phases[${i}].title = this.value; updateDraftHashBadge();" /><button id="ed-del-phase-${i}" class="icon-btn del hold-btn" oncontextmenu="return false;" onpointerdown="startEditorItemDeleteHold('phase', ${i}, event)"><i class="fa-solid fa-trash"></i></button></div><div class="editor-item-subrow"><div class="toggle-group"><i class="fa-solid fa-stopwatch field-icon"></i><input type="number" min="0" class="num-input" value="${p.duration || ''}" oninput="state.editorDraft.phases[${i}].duration = Math.max(0, parseInt(this.value)||0); updateDraftHashBadge();" /><button class="icon-btn" onpointerdown="event.preventDefault()" onclick="addPhaseDurationInEditor(${i}, 10, event)"><i class="fa-solid fa-plus"></i></button></div><div class="toggle-group"><button class="icon-btn ${p.loop ? 'active-toggle' : ''}" onpointerdown="event.preventDefault()" onclick="Haptics.tap(); state.editorDraft.phases[${i}].loop = !state.editorDraft.phases[${i}].loop; updateDraftHashBadge(); render();"><i class="fa-solid fa-repeat"></i></button><button class="icon-btn ${p.fxAlarm ? 'active-toggle' : ''}" onpointerdown="event.preventDefault()" onclick="Haptics.tap(); state.editorDraft.phases[${i}].fxAlarm = !state.editorDraft.phases[${i}].fxAlarm; updateDraftHashBadge(); render();"><i class="fa-solid fa-bullhorn"></i></button><button class="icon-btn ${p.winner ? 'active-toggle' : ''}" onpointerdown="event.preventDefault()" onclick="Haptics.tap(); state.editorDraft.phases[${i}].winner = !state.editorDraft.phases[${i}].winner; updateDraftHashBadge(); render();"><i class="fa-solid fa-trophy"></i></button></div></div></div>`; }).join('');
 const finalsHtml = d.finals.map((f, i) => { const isNone = !f.color || f.color === 'none'; const isWhite = f.color === 'white'; const itemColorCss = getColorCss(f.color, 'var(--border)'); return `<div id="ed-item-final-${i}" class="editor-item" style="--item-color: ${itemColorCss}"><div class="editor-item-main"><div class="color-cycle-btn ${isNone ? 'is-none' : ''} ${isWhite ? 'is-white' : ''}" style="background: ${isNone ? 'transparent' : PALETTE[f.color]}" onpointerdown="event.preventDefault()" onclick="Haptics.tap(); state.editorDraft.finals[${i}].color = cycleItemColor('${f.color}'); updateDraftHashBadge(); render();">${isNone ? '<i class="fa-solid fa-ban"></i>' : ''}</div><input class="text-input" value="${escapeHtml(f.title)}" placeholder="Baigties pavadinimas" oninput="state.editorDraft.finals[${i}].title = this.value; updateDraftHashBadge();" /><button id="ed-del-final-${i}" class="icon-btn del hold-btn" oncontextmenu="return false;" onpointerdown="startEditorItemDeleteHold('final', ${i}, event)"><i class="fa-solid fa-trash"></i></button></div></div>`; }).join('');
 app.innerHTML = `<div class="edge-fade-top"></div><div class="top-bar"><div class="top-actions"><button class="sm" onclick="exitEditorToPregame()"><i class="fa-solid fa-arrow-left"></i></button></div><div class="top-actions"><button id="editor-reset-btn" class="sm hold-btn" style="--hold-color: var(--c-red)" oncontextmenu="return false;" onpointerdown="startAppResetHold(event)"><i class="fa-solid fa-skull"></i></button><button id="editor-save-btn" class="sm ${dirty ? 'btn-confirm' : ''}" onclick="saveEditorChanges()"><i class="fa-solid fa-check"></i></button></div></div><div class="screen-scroll editor-scroll"><div class="editor-wrap"><div class="editor-section"><div class="section-head"><span class="section-head-label"><i class="fa-solid fa-palette"></i></span><span class="hash-badge" id="draft-hash-badge">#${d.hash}</span></div><div class="field-row"><input class="text-input" value="${escapeHtml(d.title)}" placeholder="Žaidimo pavadinimas" oninput="state.editorDraft.title = this.value; updateDraftHashBadge();" /></div><div class="field-row"><div class="palette-row">${paletteHtml}</div></div></div><div class="editor-section"><div class="section-head"><span class="section-head-label"><i class="fa-solid fa-flag"></i> (${d.groups.length})</span><button class="xs" onpointerdown="event.preventDefault()" onclick="addGroupInEditor(event)"><i class="fa-solid fa-plus"></i></button></div>${d.groups.length > 0 ? `<div class="editor-item-list">${groupsHtml}</div>` : ''}</div><div class="editor-section"><div class="section-head"><span class="section-head-label"><i class="fa-solid fa-masks-theater"></i> (${d.cards.length})</span><button class="xs" onpointerdown="event.preventDefault()" onclick="addCardInEditor(event)"><i class="fa-solid fa-plus"></i></button></div>${d.cards.length > 0 ? `<div class="editor-item-list">${cardsHtml}</div>` : ''}</div><div class="editor-section"><div class="section-head"><span class="section-head-label"><i class="fa-solid fa-play"></i> (${d.phases.length})</span><button class="xs" onpointerdown="event.preventDefault()" onclick="addPhaseInEditor(event)"><i class="fa-solid fa-plus"></i></button></div>${d.phases.length > 0 ? `<div class="editor-item-list">${phasesHtml}</div>` : ''}</div><div class="editor-section"><div class="section-head"><span class="section-head-label"><i class="fa-solid fa-trophy"></i> (${d.finals.length})</span><button class="xs" onpointerdown="event.preventDefault()" onclick="addFinalInEditor(event)"><i class="fa-solid fa-plus"></i></button></div>${d.finals.length > 0 ? `<div class="editor-item-list">${finalsHtml}</div>` : ''}</div></div></div><div class="bottom-bar"></div>`;
 const el = app.querySelector('.editor-scroll'); if (el && savedScroll > 0) el.scrollTop = savedScroll;
}

function renderDeal(app) {
 const resolvedCardColorKey = (state.cardFaceUp && state.currentCard) ? resolveCardColorKey(state.baseGame, state.currentCard) : state.baseGame.color;
 const cardColorCss = getColorCss(resolvedCardColorKey, 'var(--c-none)'); const cardTextColorCss = (resolvedCardColorKey === 'none') ? 'var(--text)' : PALETTE[resolvedCardColorKey];
 const cardGroup = (state.cardFaceUp && state.currentCard) ? getGroupById(state.baseGame, state.currentCard.groupId) : null;
 app.innerHTML = `<div class="top-bar"><button id="cancel-hold-btn" class="sm hold-btn" style="--hold-color: var(--c-red)" oncontextmenu="return false;" onpointerdown="startCancelHold(event)"><i class="fa-solid fa-xmark"></i></button><div class="counter-pill" style="font-size:1.05rem; padding:6px 16px;">${state.dealIndex + 1}/${state.deck.length}</div><div style="width: 42px;"></div></div><div class="card-stage"><div class="playing-card ${state.cardFaceUp ? '' : 'face-down'}" style="--card-color: ${cardColorCss}; --card-text-color: ${cardTextColorCss}" onclick="handleCardTap()">${state.cardFaceUp ? `${cardGroup ? `<div class="card-face-group">${escapeHtml(cardGroup.title)}</div>` : ''}<div class="card-face-title">${escapeHtml(state.currentCard.title)}</div><button class="lg card-check-btn" style="--accent: ${cardColorCss}; color: ${cardTextColorCss};"><i class="fa-solid fa-check"></i></button>` : `<div class="card-back-emblem"><i class="fa-solid fa-masks-theater"></i></div>`}</div></div><div class="bottom-bar"></div>`;
}

function renderDealDone(app) {
 const hasPhases = state.baseGame.phases && state.baseGame.phases.length > 0;
 app.innerHTML = `<div class="top-bar"><button id="cancel-hold-btn" class="sm hold-btn" style="--hold-color: var(--c-red)" oncontextmenu="return false;" onpointerdown="startCancelHold(event)"><i class="fa-solid fa-xmark"></i></button><div></div></div><div class="card-stage"><div style="display: flex; flex-direction: column; gap: 24px; align-items: center; justify-content: center; width: 100%;">${hasPhases ? `<button class="lg" onclick="startPhases()"><i class="fa-solid fa-play"></i></button>` : `<button class="lg" onclick="startDealing()"><i class="fa-solid fa-arrows-rotate"></i></button>`}</div></div><div class="bottom-bar"></div>`;
}

function renderPhase(app) {
 const phases = state.baseGame.phases || []; const hasPhases = phases.length > 0;
 const currentPhase = hasPhases ? phases[state.phaseIndex] : null; const title = currentPhase ? currentPhase.title : state.baseGame.title;
 const tv = getPhaseTimerView();
 const canAdvance = hasPhases && getNextPhaseIndex() !== -1;
 const showAlarm = Boolean(currentPhase && currentPhase.fxAlarm);
 const showFinals = Boolean(currentPhase && currentPhase.winner && state.baseGame.finals && state.baseGame.finals.length > 0);
 const alarmHtml = showAlarm ? `<button class="danger ${state.alarmActive ? 'active-alarm' : ''}" onclick="triggerAlarm()"><i class="fa-solid fa-bullhorn"></i></button>` : '';
 const finalsHtml = showFinals ? `<div class="finals-tray">${state.baseGame.finals.map((f, idx) => `<button id="final-token-${idx}" class="final-token ${HoldEngine.activeKey === 'final:' + idx && HoldEngine.isHolding ? 'holding' : ''}" style="--token-color: ${getColorCss(f.color, 'var(--text)')}" oncontextmenu="return false;" onpointerdown="startFinalHold(${idx}, event)"><i class="fa-solid fa-trophy"></i></button>`).join('')}</div>` : '';
 app.innerHTML = `<div class="top-bar"><button id="cancel-hold-btn" class="sm hold-btn" style="--hold-color: var(--c-red)" oncontextmenu="return false;" onpointerdown="startCancelHold(event)"><i class="fa-solid fa-xmark"></i></button><button class="sm" onclick="SoundEngine.toggleMute()"><i class="fa-solid ${SoundEngine.muted ? 'fa-volume-xmark' : 'fa-volume-high'}"></i></button></div><div class="phase-stage"><div class="phase-spacer-top"></div><div class="phase-core"><div class="phase-title">${escapeHtml(title)}</div><div id="timer-val" class="timer-display ${tv.isBlinking ? 'timer-blink' : ''} ${tv.isOverdue ? 'timer-overdue' : ''}">${tv.text}</div></div><div class="phase-aux">${alarmHtml}${finalsHtml}</div></div><div class="bottom-bar"><div class="action-row">${canAdvance ? `<button id="next-phase-btn" class="${tv.isExpired ? 'pulse-btn' : ''}" onclick="nextPhase()"><i class="fa-solid ${tv.nextIcon}"></i></button>` : ''}</div></div>`;
}

function renderFinal(app) {
 const f = state.activeFinal; const colorCss = getColorCss(f.color, 'var(--c-none)'); const textColorCss = (!f.color || f.color === 'none') ? 'var(--text)' : PALETTE[f.color];
 app.innerHTML = `<div class="top-bar"></div><div class="card-stage"><div class="playing-card" style="--card-color: ${colorCss}; --card-text-color: ${textColorCss}" onclick="closeFinalCard()"><div style="font-size: 4rem; color: ${textColorCss}; margin-bottom: 14px; text-shadow: 0 4px 16px rgba(0,0,0,0.8);"><i class="fa-solid fa-trophy"></i></div><div class="card-face-title">${escapeHtml(f.title)}</div><div class="return-btn-wrap"><button class="lg" style="--accent: ${colorCss}; color: ${textColorCss}; pointer-events: none;"><i class="fa-solid fa-check"></i></button></div></div></div><div class="bottom-bar"></div>`;
}

function render() {
 const app = document.getElementById('app');
 const savedEditorScroll = (app.querySelector('.editor-scroll') || {}).scrollTop || 0;
 const savedPregameScroll = (app.querySelector('.pregame-scroll') || {}).scrollTop || 0;

 if (state.screen === 'PREGAME') renderPregame(app, savedPregameScroll);
 else if (state.screen === 'EDITOR') renderEditor(app, savedEditorScroll);
 else if (state.screen === 'DEAL') renderDeal(app);
 else if (state.screen === 'DEAL_DONE') renderDealDone(app);
 else if (state.screen === 'PHASE') renderPhase(app);
 else if (state.screen === 'FINAL') renderFinal(app);
}

initApp();
</script>
