<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neišsiduok, kas tu 🎭</title>
    <!-- Font Awesome 6 ikonos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .game-screen, .settings-screen {
            display: none;
            width: 100%;
        }

        .active {
            display: block;
        }

        .hidden {
            display: none !important;
        }

        /* Viršutinė juosta */
        .game-header-bar {
            margin-bottom: 22px;
            text-align: center;
        }

        .game-header-bar h1 {
            font-size: 1.6rem;
            color: #e0e0e0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .game-header-bar h1 i {
            font-size: 1.45rem;
            color: #e0e0e0;
        }

        /* Langų antraštės */
        .settings-header, .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .settings-header h2, .modal-header h3 {
            font-size: 1.5rem;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .settings-header h2 i, .modal-header h3 i {
            color: #aaa;
            font-size: 1.3rem;
        }

        /* Baziniai mygtukai */
        button {
            background: #4cd137;
            color: #1e1e2f;
            border: none;
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 1.15rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s ease, background 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 5px 15px rgba(76, 209, 55, 0.4);
            margin-bottom: 12px;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:hover:not(:disabled) {
            background: #44bd32;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        button.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            box-shadow: none;
            margin-bottom: 0;
        }

        button.secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
        }

        .close-icon-btn {
            background: transparent;
            color: #aaa;
            font-size: 1.5rem;
            width: auto;
            padding: 5px;
            margin: 0;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }

        .close-icon-btn:hover {
            background: transparent;
            color: #ff4757;
        }

        /* Statistikos / indikatorių juosta */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 22px;
        }

        .stat-pill {
            flex: 1;
            background: rgba(0, 0, 0, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 6px;
            font-size: 1.05rem;
            color: #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
        }

        .stat-pill:active {
            transform: scale(0.96);
        }

        .stat-pill i {
            font-size: 1.15rem;
            color: #fff;
            opacity: 0.95;
        }

        .stat-pill span {
            color: #fff;
            font-weight: bold;
        }

        /* Žaidėjų indikatorius */
        .stat-pill.players {
            border-color: rgba(76, 209, 55, 0.25);
            background: rgba(76, 209, 55, 0.05);
        }
        .stat-pill.players i, .stat-pill.players span {
            color: #4cd137;
        }

        /* Piktadarių indikatorius */
        .stat-pill.danger {
            border-color: rgba(255, 71, 87, 0.25);
            background: rgba(255, 71, 87, 0.05);
        }
        .stat-pill.danger i, .stat-pill.danger span {
            color: #ff4757;
            text-shadow: 0 0 8px rgba(255, 71, 87, 0.4);
        }

        /* Specialių rolių indikatorius (Amber spalva) */
        .stat-pill.neutral-stat {
            border-color: rgba(255, 165, 2, 0.25);
            background: rgba(255, 165, 2, 0.05);
        }
        .stat-pill.neutral-stat i, .stat-pill.neutral-stat span {
            color: #ffa502;
            text-shadow: 0 0 8px rgba(255, 165, 2, 0.4);
        }

        /* Kortelė */
        .card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 30px 20px;
            margin-bottom: 22px;
            min-height: 175px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .role-title {
            font-size: 2rem;
            font-weight: bold;
            text-transform: capitalize;
            letter-spacing: 1px;
            display: none;
        }

        .role-title.normal {
            color: #4cd137;
        }

        .role-title.neutral {
            color: #ffa502;
            text-shadow: 0 0 10px rgba(255, 165, 2, 0.4);
        }

        .role-title.alert {
            color: #ff4757;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.4);
        }

        .placeholder-text {
            color: #aaa;
            font-size: 1.08rem;
            line-height: 1.45;
        }

        /* Apatinė navigacija su ikonomis kraštuose */
        .footer-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
        }

        .footer-nav .icon-link {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #bbb;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: none;
            margin: 0;
            padding: 0;
            transition: background 0.2s ease, color 0.2s ease, transform 0.1s ease;
        }

        .footer-nav .icon-link:hover {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
        }

        .footer-nav .icon-link:active {
            transform: scale(0.92);
        }

        /* Nustatymų įvesties laukai */
        .input-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .input-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-group label i.fa-skull {
            color: #ff4757;
        }

        .input-group label i.fa-star {
            color: #ffa502;
        }

        .input-group label i.fa-user {
            color: #3498db;
        }

        textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            padding: 10px 12px;
            resize: none;
            height: 65px;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        textarea:focus {
            outline: none;
            border-color: #4cd137;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        .btn-group button {
            flex: 1;
            margin-bottom: 0;
            padding: 14px 10px;
        }

        /* Modalinis langas (Pagalbai ir Nustatymams bendras stilius) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 15px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #232336;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 22px;
            width: 100%;
            max-width: 380px;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-body {
            font-size: 0.9rem;
            color: #ccc;
            line-height: 1.5;
            max-height: 60vh;
            overflow-y: auto;
        }

        .help-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 0.95rem;
            color: #e0e0e0;
        }

        .help-row i {
            font-size: 1.1rem;
            width: 22px;
            text-align: center;
        }

        .help-row i.fa-users { color: #4cd137; }
        .help-row i.fa-skull { color: #ff4757; }
        .help-row i.fa-star { color: #ffa502; }

        .help-footer-text {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            color: #aaa;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 1. Nustatymų ekranas -->
        <div id="settingsScreen" class="settings-screen">
            <div class="settings-header">
                <h2><i class="fa-solid fa-gear" style="margin-left: 4px;"></i> Nustatymai</h2>
                <button type="button" class="close-icon-btn" onclick="closeSettings()" title="Uždaryti">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="input-group">
                <label for="setRegular"><i class="fa-solid fa-user"></i> Komanda</label>
                <textarea id="setRegular"></textarea>
            </div>

            <div class="input-group">
                <label for="setMandatory"><i class="fa-solid fa-skull"></i> Piktadariai</label>
                <textarea id="setMandatory"></textarea>
            </div>

            <div class="input-group">
                <label for="setNeutral"><i class="fa-solid fa-star"></i> Specialios rolės</label>
                <textarea id="setNeutral"></textarea>
            </div>

            <div class="btn-group">
                <button type="button" class="secondary" onclick="resetToFactoryDefaults()">Atstatyti</button>
                <button type="button" onclick="saveSettings()">Išsaugoti</button>
            </div>
        </div>

        <!-- 2. Pagrindinis žaidimo ekranas -->
        <div id="gameScreen" class="game-screen active">
            <div class="game-header-bar">
                <h1>Neišsiduok, kas tu <i class="fa-solid fa-masks-theater"></i></h1>
            </div>

            <div class="stats-bar">
                <!-- Žaidėjų skaičius -->
                <div class="stat-pill players" id="pillPlayers" title="Viengubas paspaudimas: +1 | Dvigubas: nulinti">
                    <i class="fa-solid fa-users"></i>
                    <span id="statPlayers">0</span>
                </div>
                <!-- Piktadarių skaičius -->
                <div class="stat-pill danger" id="pillBad" title="Viengubas paspaudimas: +1 | Dvigubas: nulinti">
                    <i class="fa-solid fa-skull"></i>
                    <span id="statBad">0</span>
                </div>
                <!-- Specialių rolių skaičius -->
                <div class="stat-pill neutral-stat" id="pillNeutral" title="Viengubas paspaudimas: +1 | Dvigubas: nulinti">
                    <i class="fa-solid fa-star"></i>
                    <span id="statNeutral">0</span>
                </div>
            </div>
            
            <div class="card">
                <span class="placeholder-text" id="initialText"></span>
                <div class="role-title" id="roleText"></div>
            </div>

            <button type="button" id="actionBtn" onclick="handleAction()">Gauti rolę</button>
            <button type="button" id="resetBtn" class="secondary hidden" onclick="resetGame()">Pradėti iš naujo</button>
            
            <div class="footer-nav">
                <button type="button" class="icon-link" onclick="openHelpModal()" title="Pagalba">
                    <i class="fa-solid fa-circle-question"></i>
                </button>
                <button type="button" class="icon-link" onclick="openSettings()" title="Nustatymai">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- Pagalbos modalinis langas -->
    <div id="helpModal" class="modal-overlay" onclick="closeHelpOnOutside(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-circle-question"></i> Pagalba</h3>
                <button type="button" class="close-icon-btn" onclick="closeHelpModal()" title="Uždaryti">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="help-row">
                    <i class="fa-solid fa-users"></i>
                    <span>Bendras žaidėjų skaičius</span>
                </div>
                <div class="help-row">
                    <i class="fa-solid fa-skull"></i>
                    <span>Piktadarių rolių kiekis</span>
                </div>
                <div class="help-row">
                    <i class="fa-solid fa-star"></i>
                    <span>Specialių / neutralių rolių kiekis</span>
                </div>

                <div class="help-footer-text">
                    Spauskite vieną kartą ant indikatorių, kad padidintumėte skaičių vienetu. Bakstelėkite du kartus greitai, kad atitinkamą indikatorių apnulintumėte.
                </div>
            </div>
        </div>
    </div>

    <script>
        const COOLDOWN_SECONDS = 1.0;

        const defaultSettings = {
            mandatory: ["imposteris", "trintukas", "ligonis"],
            neutral: ["džakalas"],
            regular: ["žmogus", "gydytojas", "teisėjas", "policininkas"],
            playerCount: 0,
            badCount: 0,
            neutralCount: 0
        };

        let currentSettings = { ...defaultSettings };
        let availableRoles = [];
        let currentState = "READY_TO_GET"; // "READY_TO_GET" | "ROLE_SHOWN"
        let gameInProgress = false;
        let cooldownTimer = null;

        function initApp() {
            const savedRaw = localStorage.getItem("game_settings");

            if (savedRaw) {
                try {
                    const parsed = JSON.parse(savedRaw);
                    currentSettings = {
                        mandatory: Array.isArray(parsed.mandatory) && parsed.mandatory.length ? parsed.mandatory : [...defaultSettings.mandatory],
                        neutral: Array.isArray(parsed.neutral) ? parsed.neutral : [...defaultSettings.neutral],
                        regular: Array.isArray(parsed.regular) && parsed.regular.length ? parsed.regular : [...defaultSettings.regular],
                        playerCount: typeof parsed.playerCount === "number" ? parsed.playerCount : defaultSettings.playerCount,
                        badCount: typeof parsed.badCount === "number" ? parsed.badCount : defaultSettings.badCount,
                        neutralCount: typeof parsed.neutralCount === "number" ? parsed.neutralCount : defaultSettings.neutralCount
                    };
                } catch (e) {
                    currentSettings = { ...defaultSettings };
                }
            }

            setupIndicatorInteractions();
            prepareNewGame();
        }

        function saveToStorage() {
            localStorage.setItem("game_settings", JSON.stringify(currentSettings));
        }

        function parseRoleList(text) {
            return [...new Set(text.split(",").map(r => r.trim().toLowerCase()).filter(Boolean))];
        }

        /* --- Nustatymų lango valdymas --- */

        function openSettings() {
            if (gameInProgress) return;

            document.getElementById("setRegular").value = currentSettings.regular.join(", ");
            document.getElementById("setMandatory").value = currentSettings.mandatory.join(", ");
            document.getElementById("setNeutral").value = currentSettings.neutral.join(", ");

            document.getElementById("gameScreen").classList.remove("active");
            document.getElementById("settingsScreen").classList.add("active");
        }

        function closeSettings() {
            document.getElementById("settingsScreen").classList.remove("active");
            document.getElementById("gameScreen").classList.add("active");
        }

        function saveSettings() {
            const parsedRegular = parseRoleList(document.getElementById("setRegular").value);
            const parsedMandatory = parseRoleList(document.getElementById("setMandatory").value);
            const parsedNeutral = parseRoleList(document.getElementById("setNeutral").value);

            currentSettings.regular = parsedRegular.length ? parsedRegular : [...defaultSettings.regular];
            currentSettings.mandatory = parsedMandatory.length ? parsedMandatory : [...defaultSettings.mandatory];
            currentSettings.neutral = parsedNeutral;

            saveToStorage();
            prepareNewGame();
            closeSettings();
        }

        function resetToFactoryDefaults() {
            if (confirm("Ar tikrai norite atstatyti gamyklines žaidimo roles ir nustatymus?")) {
                localStorage.removeItem("game_settings");
                currentSettings = {
                    mandatory: [...defaultSettings.mandatory],
                    neutral: [...defaultSettings.neutral],
                    regular: [...defaultSettings.regular],
                    playerCount: 0,
                    badCount: 0,
                    neutralCount: 0
                };
                prepareNewGame();
                closeSettings();
            }
        }

        /* --- Pagalbos modalinis langas --- */

        function openHelpModal() {
            document.getElementById("helpModal").classList.add("active");
        }

        function closeHelpModal() {
            document.getElementById("helpModal").classList.remove("active");
        }

        function closeHelpOnOutside(e) {
            if (e.target.id === "helpModal") {
                closeHelpModal();
            }
        }

        /* --- Indikatorių viengubo ir dvigubo paspaudimo logika --- */

        function setupIndicatorInteractions() {
            bindClickAndDoubleClicks("pillPlayers", 
                () => increaseIndicator('players'), 
                () => resetIndicator('players')
            );
            bindClickAndDoubleClicks("pillBad", 
                () => increaseIndicator('bad'), 
                () => resetIndicator('bad')
            );
            bindClickAndDoubleClicks("pillNeutral", 
                () => increaseIndicator('neutral'), 
                () => resetIndicator('neutral')
            );
        }

        function bindClickAndDoubleClicks(elementId, onClick, onDoubleClick) {
            const el = document.getElementById(elementId);
            let clickTimer = null;

            el.addEventListener("click", (e) => {
                if (gameInProgress) return;

                if (clickTimer === null) {
                    clickTimer = setTimeout(() => {
                        clickTimer = null;
                        onClick(); // Viengubas paspaudimas
                    }, 250); 
                } else {
                    clearTimeout(clickTimer);
                    clickTimer = null;
                    onDoubleClick(); // Dvigubas paspaudimas
                }
            });
        }

        function increaseIndicator(type) {
            if (type === 'players') {
                const oldPlayers = currentSettings.playerCount;
                currentSettings.playerCount++;
                
                if (oldPlayers === 0 && currentSettings.playerCount === 1) {
                    currentSettings.badCount = 1;
                }
            } else if (type === 'bad') {
                const combined = currentSettings.badCount + currentSettings.neutralCount;
                if (combined < currentSettings.playerCount) {
                    currentSettings.badCount++;
                }
            } else if (type === 'neutral') {
                const combined = currentSettings.badCount + currentSettings.neutralCount;
                if (combined < currentSettings.playerCount) {
                    currentSettings.neutralCount++;
                }
            }
            saveToStorage();
            updateUIStats();
            prepareNewGame();
        }

        function resetIndicator(type) {
            if (type === 'players') {
                currentSettings.playerCount = 0;
                currentSettings.badCount = 0;
                currentSettings.neutralCount = 0;
            } else if (type === 'bad') {
                currentSettings.badCount = 0;
            } else if (type === 'neutral') {
                currentSettings.neutralCount = 0;
            }
            saveToStorage();
            updateUIStats();
            prepareNewGame();
        }

        function updateUIStats() {
            document.getElementById("statPlayers").textContent = currentSettings.playerCount;
            document.getElementById("statBad").textContent = currentSettings.badCount;
            document.getElementById("statNeutral").textContent = currentSettings.neutralCount;
        }

        /* --- Žaidimo logika --- */

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function setSetupControlsDisabled(disabled) {
            document.getElementById("pillPlayers").style.opacity = disabled ? "0.5" : "1";
            document.getElementById("pillBad").style.opacity = disabled ? "0.5" : "1";
            document.getElementById("pillNeutral").style.opacity = disabled ? "0.5" : "1";
        }

        function prepareNewGame() {
            clearTimeout(cooldownTimer);
            gameInProgress = false;
            setSetupControlsDisabled(false);

            document.getElementById("resetBtn").classList.add("hidden");
            document.getElementById("actionBtn").classList.remove("hidden");

            updateUIStats();

            const playerCount = currentSettings.playerCount;
            const badCount = currentSettings.badCount;
            const neutralCount = currentSettings.neutralCount;

            // 1. Piktadariai
            const shuffledMandatory = shuffleArray([...currentSettings.mandatory]);
            const chosenBad = shuffledMandatory.slice(0, badCount);
            const fallbackBad = currentSettings.mandatory[0] || "imposteris";
            while (chosenBad.length < badCount) {
                chosenBad.push(fallbackBad);
            }

            // 2. Specialios rolės
            const shuffledNeutralPool = shuffleArray([...currentSettings.neutral]);
            const chosenNeutral = shuffledNeutralPool.slice(0, neutralCount);
            const fallbackNeutral = currentSettings.neutral[0] || "džakalas";
            while (chosenNeutral.length < neutralCount) {
                chosenNeutral.push(fallbackNeutral);
            }

            // 3. Komanda (Likutis iki playerCount)
            const regularNeeded = Math.max(0, playerCount - chosenBad.length - chosenNeutral.length);
            const shuffledRegular = shuffleArray([...currentSettings.regular]);
            let chosenRegular = shuffledRegular.slice(0, regularNeeded);
            const fallbackRegular = currentSettings.regular[0] || "žmogus";
            while (chosenRegular.length < regularNeeded) {
                chosenRegular.push(fallbackRegular);
            }

            let gameRoles = [...chosenBad, ...chosenNeutral, ...chosenRegular];
            if (gameRoles.length > playerCount) {
                gameRoles = gameRoles.slice(0, playerCount);
            }

            availableRoles = shuffleArray(gameRoles);

            resetToHiddenState(true);
        }

        function resetToHiddenState(isFirstPlayer = false) {
            clearTimeout(cooldownTimer);
            currentState = "READY_TO_GET";
            
            const total = currentSettings.playerCount;
            const nextPlayerNumber = total - availableRoles.length + 1;

            const initialText = document.getElementById("initialText");
            initialText.style.display = "block";
            
            if (total === 0) {
                initialText.textContent = "Paspausk ant žaidėjų indikatoriaus viršuje, kad nustatytum žaidėjų skaičių (dvigubas paspaudimas apnulins).";
            } else {
                initialText.textContent = isFirstPlayer
                    ? "Žaidimas paruoštas! Pirmasis žaidėjas gali atversti."
                    : "Kito žaidėjo eilė.";
            }
            
            const roleText = document.getElementById("roleText");
            roleText.style.display = "none";
            roleText.textContent = "";
            roleText.className = "role-title";
            
            const actionBtn = document.getElementById("actionBtn");
            actionBtn.disabled = (total === 0);
            actionBtn.textContent = total === 0 ? "Nurodykite žaidėjus" : `Gauti rolę (${nextPlayerNumber} iš ${total})`;
        }

        function handleAction() {
            if (currentSettings.playerCount <= 0) {
                alert("Pirmiausia paspauskite ant žaidėjų skaičiaus indikatoriaus viršuje ir nustatykite žaidėjų kiekį!");
                return;
            }

            const roleText = document.getElementById("roleText");
            const initialText = document.getElementById("initialText");
            const actionBtn = document.getElementById("actionBtn");

            if (currentState === "READY_TO_GET") {
                if (!gameInProgress) {
                    gameInProgress = true;
                    setSetupControlsDisabled(true);
                    document.getElementById("resetBtn").classList.remove("hidden");
                }

                const selectedRole = availableRoles.shift();

                initialText.style.display = "none";
                roleText.textContent = selectedRole;
                
                if (currentSettings.mandatory.includes(selectedRole)) {
                    roleText.className = "role-title alert";
                } else if (currentSettings.neutral.includes(selectedRole)) {
                    roleText.className = "role-title neutral";
                } else {
                    roleText.className = "role-title normal";
                }

                roleText.style.display = "block";
                currentState = "ROLE_SHOWN";

                actionBtn.disabled = true;
                actionBtn.textContent = "Įsiminkite rolę...";

                cooldownTimer = setTimeout(() => {
                    actionBtn.disabled = false;
                    actionBtn.innerHTML = 'Įsiminiau <i class="fa-solid fa-check"></i>';
                }, COOLDOWN_SECONDS * 1000);

            } else {
                if (availableRoles.length === 0) {
                    initialText.style.display = "block";
                    initialText.textContent = "Rolės išdalintos! Gero žaidimo!";
                    roleText.style.display = "none";
                    
                    actionBtn.classList.add("hidden");
                    gameInProgress = false;
                    setSetupControlsDisabled(false);
                    return;
                }
                resetToHiddenState(false);
            }
        }

        function resetGame() {
            if (gameInProgress) {
                if (!confirm("Ar tikrai norite nutraukti rolių dalinimą ir pradėti iš naujo?")) {
                    return;
                }
            }
            prepareNewGame();
        }

        initApp();
    </script>

</body>
</html>
