            <div class="toggle-group">
              <button class="icon-btn ${p.loop ? 'active-toggle' : ''}"
                      onclick="Haptics.tap(); state.editorDraft.phases[${i}].loop = !state.editorDraft.phases[${i}].loop; updateDraftHashBadge(); render();">
                <i class="fa-solid fa-repeat"></i>
              </button>
              <button class="icon-btn ${p.fxAlarm ? 'active-toggle' : ''}"
                      onclick="Haptics.tap(); state.editorDraft.phases[${i}].fxAlarm = !state.editorDraft.phases[${i}].fxAlarm; updateDraftHashBadge(); render();">
                <i class="fa-solid fa-bullhorn"></i>
              </button>
              <button class="icon-btn" onclick="moveItem(state.editorDraft.phases, ${i}, -1)"><i class="fa-solid fa-chevron-up"></i></button>
              <button class="icon-btn" onclick="moveItem(state.editorDraft.phases, ${i}, 1)"><i class="fa-solid fa-chevron-down"></i></button>
              <button class="icon-btn del" onclick="Haptics.tap(); state.editorDraft.phases.splice(${i}, 1); updateDraftHashBadge(); render();"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        </div>
      `;
    }).join('');

    const finalsHtml = d.finals.map((f, i) => {
      const isNone = !f.color || f.color === 'none';
      const itemColorCss = getColorCss(f.color, 'var(--border)');
      return `
        <div class="editor-item" style="--item-color: ${itemColorCss}">
          <div class="editor-item-main">
            <div class="color-cycle-btn ${isNone ? 'is-none' : ''}"
                 style="background: ${isNone ? 'transparent' : PALETTE[f.color]}"
                 onclick="Haptics.tap(); state.editorDraft.finals[${i}].color = cycleItemColor('${f.color}'); updateDraftHashBadge(); render();">
              ${isNone ? '<i class="fa-solid fa-ban"></i>' : ''}
            </div>
            <input class="text-input"
                   value="${escapeHtml(f.title)}"
                   placeholder="Finalo pavadinimas"
                   oninput="state.editorDraft.finals[${i}].title = this.value; updateDraftHashBadge();" />
            <button class="icon-btn del" onclick="Haptics.tap(); state.editorDraft.finals.splice(${i}, 1); updateDraftHashBadge(); render();"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      `;
    }).join('');

    app.innerHTML = `
      <div class="top-bar">
        <button class="sm" onclick="exitEditorWithoutSaving()"><i class="fa-solid fa-arrow-left"></i></button>
        <div class="top-actions">
          <button class="sm btn-confirm" onclick="saveEditorChanges()"><i class="fa-solid fa-check"></i></button>
        </div>
      </div>

      <div class="editor-wrap">
        <!-- I. Bendrieji nustatymai (Pavadinimas ir spalva) -->
        <div class="editor-section">
          <div class="section-head">
            <span>I. Bendrieji nustatymai</span>
            <span class="hash-badge" id="draft-hash-badge">#${d.hash}</span>
          </div>

          <div class="field-row">
            <label class="field-label">Žaidimo pavadinimas</label>
            <input class="text-input" value="${escapeHtml(d.title)}"
                   oninput="state.editorDraft.title = this.value; updateDraftHashBadge();" />
          </div>

          <div class="field-row">
            <label class="field-label">Akcentinė spalva</label>
            <div class="palette-row">${paletteHtml}</div>
          </div>
        </div>

        <!-- II. Kortų dalijimo režimas (Atskiras 1-asis nustatymų blokas po pavadinimo ir spalvos) -->
        <div class="editor-section">
          <div class="section-head">
            <span>II. Kortų dalijimo režimas</span>
          </div>

          <div class="field-row">
            <select class="select-input"
                    onchange="Haptics.tap(); state.editorDraft.dealMode = parseInt(this.value); updateDraftHashBadge(); render();">
              <option value="1" ${d.dealMode === 1 ? 'selected' : ''}>1. Pritaikomas kiekis</option>
              <option value="2" ${d.dealMode === 2 ? 'selected' : ''}>2. Visa kaladė</option>
              <option value="3" ${d.dealMode === 3 ? 'selected' : ''}>3. Atsitiktinis N kortų traukimas</option>
              <option value="4" ${d.dealMode === 4 ? 'selected' : ''}>4. Traukimas su grąžinimu</option>
            </select>
          </div>

          ${d.dealMode === 2 ? `
            <div class="inline-switch">
              <span>Maišyti kaladę prieš dalijimą</span>
              <button class="icon-btn ${d.shuffle ? 'active-toggle' : ''}"
                      onclick="Haptics.tap(); state.editorDraft.shuffle = !state.editorDraft.shuffle; updateDraftHashBadge(); render();">
                <i class="fa-solid fa-shuffle"></i>
              </button>
            </div>
          ` : ''}

          ${d.dealMode === 3 ? `
            <div class="inline-switch">
              <span>N</span>
              <input type="number" min="1" class="num-input"
                     value="${d.drawCount > 0 ? d.drawCount : 1}"
                     oninput="state.editorDraft.drawCount = Math.max(1, parseInt(this.value, 10) || 1); updateDraftHashBadge();" />
            </div>
          ` : ''}

          ${d.dealMode === 4 ? `
            <div class="field-row">
              <label class="field-label">Grąžinimo būdas</label>
              <select class="select-input"
                      onchange="Haptics.tap(); state.editorDraft.returnMethod = this.value; updateDraftHashBadge();">
                <option value="bottom" ${d.returnMethod === 'bottom' ? 'selected' : ''}>Į kaladės apačią</option>
                <option value="shuffle" ${d.returnMethod === 'shuffle' ? 'selected' : ''}>Su visos kaladės permaišymu</option>
                <option value="middle" ${d.returnMethod === 'middle' ? 'selected' : ''}>Atsitiktinai į antrąją pusę</option>
              </select>
            </div>
            <div class="field-row">
              <label class="field-label">Grąžinimo sąlyga</label>
              <select class="select-input"
                      onchange="Haptics.tap(); state.editorDraft.returnCondition = this.value; updateDraftHashBadge();">
                <option value="auto" ${d.returnCondition === 'auto' ? 'selected' : ''}>Automatinis (užvertus kortą)</option>
                <option value="dynamic" ${d.returnCondition === 'dynamic' ? 'selected' : ''}>Pasirenkamas (mygtukas atvertus)</option>
              </select>
            </div>
          ` : ''}
        </div>

        <!-- III. Kortų grupės -->
        <div class="editor-section">
          <div class="section-head">
            <span>III. Kortų grupės (${d.groups.length})</span>
            <button class="xs" onclick="addGroupInEditor(event)">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
          ${d.groups.length > 0 ? `<div class="editor-item-list">${groupsHtml}</div>` : ''}
        </div>

        <!-- IV. Kortos -->
        <div class="editor-section">
          <div class="section-head">
            <span>IV. Kortos (${d.cards.length})</span>
            <button class="xs" onclick="addCardInEditor(event)">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
          ${d.cards.length > 0 ? `<div class="editor-item-list">${cardsHtml}</div>` : ''}
        </div>

        <!-- V. Fazių variklis -->
        <div class="editor-section">
          <div class="section-head">
            <span>V. Fazių variklis (${d.phases.length})</span>
            <button class="xs" onclick="addPhaseInEditor(event)">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
          ${d.phases.length > 0 ? `<div class="editor-item-list">${phasesHtml}</div>` : ''}
        </div>

        <!-- VI. Finalinės kortos -->
        <div class="editor-section">
          <div class="section-head">
            <span>VI. Finalinės kortos (${d.finals.length})</span>
            <button class="xs" onclick="addFinalInEditor(event)">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
          ${d.finals.length > 0 ? `<div class="editor-item-list">${finalsHtml}</div>` : ''}
        </div>
      </div>
    `;
    return;
  }

  // --------------------------------------------------------------------------
  // 3. KORTŲ DALIJIMO LANGAS (3.B)
  // --------------------------------------------------------------------------
  if (state.screen === 'DEAL') {
    const progressText = (mode === 4)
      ? `#${state.drawCounter}`
      : `${state.dealIndex + 1} / ${state.deck.length}`;

    const topRightActions = (mode === 4 && !state.cardFaceUp) ? `
      <div class="top-actions">
        <button id="reshuffle-hold-btn"
                class="sm hold-btn"
                style="--hold-color: ${getColorCss(BASE_GAME.color, 'var(--c-blue)')}"
                oncontextmenu="return false;"
                onpointerdown="startReshuffleHold(event)"
                onpointerup="HoldEngine.release()"
                onpointerleave="HoldEngine.release()"
                onpointercancel="HoldEngine.release()">
          <i class="fa-solid fa-arrows-rotate"></i>
        </button>
        ${hasPhasesOrFinals ? `<button class="sm" onclick="startPhases()"><i class="fa-solid fa-play"></i></button>` : ''}
      </div>
    ` : `<div></div>`;

    const resolvedCardColorKey = (state.cardFaceUp && state.currentCard)
      ? resolveCardColorKey(BASE_GAME, state.currentCard)
      : BASE_GAME.color;

    const cardColorCss = getColorCss(resolvedCardColorKey, 'var(--c-none)');
    const cardTextColorCss = (resolvedCardColorKey === 'none') ? 'var(--text)' : PALETTE[resolvedCardColorKey];
    const cardGroup = (state.cardFaceUp && state.currentCard)
      ? getGroupById(BASE_GAME, state.currentCard.groupId)
      : null;

    app.innerHTML = `
      <div class="top-bar">
        <button id="cancel-hold-btn"
                class="sm hold-btn"
                style="--hold-color: var(--c-red)"
                oncontextmenu="return false;"
                onpointerdown="startCancelHold(event)"
                onpointerup="HoldEngine.release()"
                onpointerleave="HoldEngine.release()"
                onpointercancel="HoldEngine.release()">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="counter-pill" style="font-size:1.05rem; padding:6px 16px;">${progressText}</div>
        ${topRightActions}
      </div>

      <div class="card-stage">
        <div class="playing-card ${state.cardFaceUp ? '' : 'face-down'}"
             style="--card-color: ${cardColorCss}; --card-text-color: ${cardTextColorCss}"
             onclick="handleCardTap()">
          ${state.cardFaceUp ? `
            ${cardGroup ? `<div class="card-face-group">${escapeHtml(cardGroup.title)}</div>` : ''}
            <div class="card-face-title">${escapeHtml(state.currentCard.title)}</div>
            ${mode === 4 && BASE_GAME.returnCondition === 'dynamic' ? `
              <div class="return-btn-wrap">
                <button onclick="handleDynamicReturn(event)">
                  <i class="fa-solid fa-file-import"></i>
                </button>
              </div>
            ` : ''}
          ` : `
            <div class="card-back-emblem"><i class="fa-solid fa-user-astronaut"></i></div>
          `}
        </div>
      </div>

      <div class="bottom-bar"></div>
    `;
    return;
  }

  // --------------------------------------------------------------------------
  // 4. IŠDALINUS VISAS KORTAS (3.B.5)
  // --------------------------------------------------------------------------
  if (state.screen === 'DEAL_DONE') {
    app.innerHTML = `
      <div class="top-bar"></div>
      <div class="card-stage">
        <div class="action-row">
          <button class="lg" onclick="startDealing()"><i class="fa-solid fa-arrows-rotate"></i></button>
          ${hasPhasesOrFinals ? `<button class="lg" onclick="startPhases()"><i class="fa-solid fa-play"></i></button>` : ''}
          <button class="lg" onclick="Haptics.tap(); goToPregame()"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>
      <div class="bottom-bar"></div>
    `;
    return;
  }

  // --------------------------------------------------------------------------
  // 5. FAZIŲ MODERATORIUS (3.C)
  // --------------------------------------------------------------------------
  if (state.screen === 'PHASE') {
    const phases = BASE_GAME.phases || [];
    const hasPhases = phases.length > 0;
    const currentPhase = hasPhases ? phases[state.phaseIndex] : null;
    const title = currentPhase ? currentPhase.title : BASE_GAME.title;
    const isZero = currentPhase && currentPhase.duration > 0 && state.timeLeft === 0;
    const canAdvance = hasPhases && getNextPhaseIndex() !== -1;

    const finalsHtml = (BASE_GAME.finals && BASE_GAME.finals.length > 0) ? `
      <div class="finals-tray">
        ${BASE_GAME.finals.map((f, idx) => `
          <button id="final-token-${idx}"
                  class="final-token ${HoldEngine.activeKey === 'final:' + idx && HoldEngine.isHolding ? 'holding' : ''}"
                  style="--token-color: ${getColorCss(f.color, 'var(--text)')}"
                  oncontextmenu="return false;"
                  onpointerdown="startFinalHold(${idx}, event)"
                  onpointerup="HoldEngine.release()"
                  onpointerleave="HoldEngine.release()"
                  onpointercancel="HoldEngine.release()">
            <i class="fa-solid fa-trophy"></i>
          </button>
        `).join('')}
      </div>
    ` : '';

    app.innerHTML = `
      <div class="top-bar">
        <button id="cancel-hold-btn"
                class="sm hold-btn"
                style="--hold-color: var(--c-red)"
                oncontextmenu="return false;"
                onpointerdown="startCancelHold(event)"
                onpointerup="HoldEngine.release()"
                onpointerleave="HoldEngine.release()"
                onpointercancel="HoldEngine.release()">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <button class="sm" onclick="SoundEngine.toggleMute()">
          <i class="fa-solid ${SoundEngine.muted ? 'fa-volume-xmark' : 'fa-volume-high'}"></i>
        </button>
      </div>

      <div class="phase-stage">
        <div class="phase-title">${escapeHtml(title)}</div>
        <div id="timer-val" class="timer-display ${isZero ? 'timer-blink' : ''}">
          ${formatTime(state.timeLeft)}
        </div>
      </div>

      <div class="bottom-bar">
        <div class="action-row">
          <button onclick="togglePausePhase()">
            <i class="fa-solid ${state.timerRunning ? 'fa-pause' : 'fa-play'}"></i>
          </button>
          ${currentPhase && currentPhase.fxAlarm ? `
            <button class="danger ${state.alarmActive ? 'active-alarm' : ''}" onclick="triggerAlarm()">
              <i class="fa-solid fa-bullhorn"></i>
            </button>
          ` : ''}
          ${canAdvance ? `
            <button id="next-phase-btn" class="${isZero ? 'pulse-btn' : ''}" onclick="nextPhase()">
              <i class="fa-solid fa-forward-step"></i>
            </button>
          ` : ''}
        </div>
        ${finalsHtml}
      </div>
    `;
    return;
  }

  // --------------------------------------------------------------------------
  // 6. FINALINĖ KORTA (3.D)
  // --------------------------------------------------------------------------
  if (state.screen === 'FINAL' && state.activeFinal) {
    const f = state.activeFinal;
    const colorCss = getColorCss(f.color, 'var(--c-none)');
    const textColorCss = (!f.color || f.color === 'none') ? 'var(--text)' : PALETTE[f.color];
    app.innerHTML = `
      <div class="top-bar"></div>
      <div class="card-stage">
        <div class="playing-card"
             style="--card-color: ${colorCss}; --card-text-color: ${textColorCss}"
             onclick="closeFinalCard()">
          <div style="font-size: 3rem; color: ${textColorCss}; margin-bottom: 14px;">
            <i class="fa-solid fa-trophy"></i>
          </div>
          <div class="card-face-title">${escapeHtml(f.title)}</div>
          <div class="return-btn-wrap">
            <button style="border-color: ${colorCss}; color: ${textColorCss}; pointer-events: none;">
              <i class="fa-solid fa-check"></i>
            </button>
          </div>
        </div>
      </div>
      <div class="bottom-bar"></div>
    `;
  }
}

handleStartupRouting();
</script>
</body>
</html>
