<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neišsiduok, kas tu 🎭</title>
    <!-- Font Awesome 6 ikonos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .game-screen, .settings-screen {
            display: none;
            width: 100%;
        }

        .active {
            display: block;
        }

        .hidden {
            display: none !important;
        }

        /* Viršutinės juostos (Žaidimo ir Nustatymų) */
        .game-header-bar, .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .game-header-bar h1 {
            font-size: 1.6rem;
            color: #e0e0e0;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-header-bar h1 i {
            font-size: 1.45rem;
            color: #e0e0e0;
        }

        .settings-header h2 {
            font-size: 1.5rem;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-header h2 i {
            color: #aaa;
        }

        /* Baziniai mygtukai */
        button {
            background: #4cd137;
            color: #1e1e2f;
            border: none;
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 1.15rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s ease, background 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 5px 15px rgba(76, 209, 55, 0.4);
            margin-bottom: 12px;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:hover:not(:disabled) {
            background: #44bd32;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        button.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            box-shadow: none;
            margin-bottom: 0;
        }

        button.secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Viršutiniai ikonų mygtukai */
        .top-settings-btn, .close-icon-btn {
            background: transparent;
            color: #aaa;
            font-size: 1.4rem;
            width: auto;
            padding: 5px;
            margin: 0;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease, transform 0.2s ease, opacity 0.2s ease;
        }

        .top-settings-btn:hover:not(:disabled) {
            background: transparent;
            color: #fff;
            transform: rotate(30deg);
        }

        .top-settings-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .close-icon-btn {
            font-size: 1.5rem;
        }

        .close-icon-btn:hover:not(:disabled) {
            background: transparent;
            color: #ff4757;
        }

        /* Statistikos / indikatorių juosta */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 22px;
        }

        .stat-pill {
            flex: 1;
            background: rgba(0, 0, 0, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 8px;
            font-size: 1.15rem;
            color: #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .stat-pill i {
            font-size: 1.25rem;
            color: #fff;
            opacity: 0.95;
        }

        .stat-pill span {
            color: #fff;
            font-weight: bold;
        }

        .stat-pill.danger {
            border-color: rgba(255, 71, 87, 0.25);
            background: rgba(255, 71, 87, 0.05);
        }

        .stat-pill.danger i {
            color: #ff4757;
            text-shadow: 0 0 8px rgba(255, 71, 87, 0.4);
        }

        .stat-pill.danger span {
            color: #ff4757;
        }

        /* Kortelė */
        .card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 30px 20px;
            margin-bottom: 22px;
            min-height: 175px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .role-title {
            font-size: 2rem;
            font-weight: bold;
            text-transform: capitalize;
            letter-spacing: 1px;
            display: none;
        }

        .role-title.normal {
            color: #4cd137;
        }

        .role-title.neutral {
            color: #ffa502;
            text-shadow: 0 0 10px rgba(255, 165, 2, 0.4);
        }

        .role-title.alert {
            color: #ff4757;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.4);
        }

        .placeholder-text {
            color: #aaa;
            font-size: 1.08rem;
            line-height: 1.45;
        }

        /* Nustatymų įvesties laukai */
        .input-group {
            margin-bottom: 14px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 6px;
            font-weight: 500;
        }

        /* Kompaktiška skaičiaus pasirinkimo eilutė nustatymuose */
        .stepper-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 12px;
        }

        .stepper-row label {
            margin-bottom: 0;
            font-size: 0.95rem;
            color: #e0e0e0;
        }

        .stepper-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .step-btn {
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border-radius: 8px;
            font-size: 1.35rem;
            font-weight: bold;
            padding: 0;
            margin: 0;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .step-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.22);
        }

        .step-btn:active:not(:disabled) {
            transform: scale(0.92);
        }

        .step-value {
            min-width: 34px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            color: #fff;
        }

        textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            padding: 10px 12px;
            resize: none;
            height: 55px;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        textarea:focus {
            outline: none;
            border-color: #4cd137;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        .btn-group button {
            flex: 1;
            margin-bottom: 0;
            padding: 14px 10px;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 1. Nustatymų ekranas -->
        <div id="settingsScreen" class="settings-screen">
            <div class="settings-header">
                <h2><i class="fa-solid fa-gear"></i> Nustatymai</h2>
                <button type="button" class="close-icon-btn" onclick="closeSettings()" title="Uždaryti">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="stepper-row">
                <label>Žaidėjų skaičius:</label>
                <div class="stepper-controls">
                    <button type="button" class="step-btn" onclick="adjustSettingCount('players', -1)">−</button>
                    <span id="setPlayerCount" class="step-value">3</span>
                    <button type="button" class="step-btn" onclick="adjustSettingCount('players', 1)">+</button>
                </div>
            </div>

            <div class="stepper-row">
                <label>Blogiečių skaičius:</label>
                <div class="stepper-controls">
                    <button type="button" class="step-btn" onclick="adjustSettingCount('bad', -1)">−</button>
                    <span id="setBadCount" class="step-value">1</span>
                    <button type="button" class="step-btn" onclick="adjustSettingCount('bad', 1)">+</button>
                </div>
            </div>

            <div class="input-group">
                <label for="setMandatory">🔴 Blogiečiai (atskirkite kableliais):</label>
                <textarea id="setMandatory"></textarea>
            </div>

            <div class="input-group">
                <label for="setNeutral">🟠 Neutralūs (atskirkite kableliais):</label>
                <textarea id="setNeutral"></textarea>
            </div>

            <div class="input-group">
                <label for="setRegular">🟢 Geriečiai (atskirkite kableliais):</label>
                <textarea id="setRegular"></textarea>
            </div>

            <div class="btn-group">
                <button type="button" class="secondary" onclick="resetToFactoryDefaults()">Atstatyti</button>
                <button type="button" onclick="saveSettings()">Išsaugoti</button>
            </div>
        </div>

        <!-- 2. Pagrindinis žaidimo ekranas -->
        <div id="gameScreen" class="game-screen active">
            <div class="game-header-bar">
                <h1>Neišsiduok, kas tu <i class="fa-solid fa-masks-theater"></i></h1>
                <button type="button" class="top-settings-btn" id="settingsBtn" onclick="openSettings()" title="Nustatymai">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>

            <div class="stats-bar">
                <div class="stat-pill" title="Žaidėjų skaičius">
                    <i class="fa-solid fa-users"></i>
                    <span id="statPlayers">3</span>
                </div>
                <div class="stat-pill danger" title="Blogiečių skaičius">
                    <i class="fa-solid fa-skull"></i>
                    <span id="statBad">1</span>
                </div>
            </div>
            
            <div class="card">
                <span class="placeholder-text" id="initialText"></span>
                <div class="role-title" id="roleText"></div>
            </div>

            <button type="button" id="actionBtn" onclick="handleAction()">Gauti rolę (1 iš 3)</button>
            <button type="button" id="resetBtn" class="secondary hidden" onclick="resetGame()">Pradėti iš naujo</button>
        </div>

    </div>

    <script>
        const COOLDOWN_SECONDS = 1.0;

        const defaultSettings = {
            mandatory: ["imposteris", "trintukas", "ligonis"],
            neutral: ["džakalas"],
            regular: ["žmogus", "gydytojas", "teisėjas", "policininkas"],
            playerCount: 3,
            badCount: 1
        };

        let currentSettings = { ...defaultSettings };
        let tempPlayerCount = 3;
        let tempBadCount = 1;
        let availableRoles = [];
        let totalPlayerCount = 3;
        let currentState = "READY_TO_GET"; // "READY_TO_GET" | "ROLE_SHOWN"
        let gameInProgress = false;
        let cooldownTimer = null;

        function initApp() {
            const savedRaw = localStorage.getItem("game_settings");

            if (savedRaw) {
                try {
                    const parsed = JSON.parse(savedRaw);
                    currentSettings = {
                        mandatory: Array.isArray(parsed.mandatory) && parsed.mandatory.length ? parsed.mandatory : [...defaultSettings.mandatory],
                        neutral: Array.isArray(parsed.neutral) ? parsed.neutral : [...defaultSettings.neutral],
                        regular: Array.isArray(parsed.regular) && parsed.regular.length ? parsed.regular : [...defaultSettings.regular],
                        playerCount: typeof parsed.playerCount === "number" ? parsed.playerCount : defaultSettings.playerCount,
                        badCount: typeof parsed.badCount === "number" ? parsed.badCount : defaultSettings.badCount
                    };
                } catch (e) {
                    currentSettings = { ...defaultSettings };
                }
            }

            validateCounts();
            prepareNewGame();
        }

        function saveToStorage() {
            localStorage.setItem("game_settings", JSON.stringify(currentSettings));
        }

        function validateCounts() {
            currentSettings.playerCount = Math.max(3, Math.min(20, currentSettings.playerCount));
            const maxBad = Math.max(1, currentSettings.playerCount - 1);
            currentSettings.badCount = Math.max(1, Math.min(maxBad, currentSettings.badCount));
        }

        function parseRoleList(text) {
            return [...new Set(text.split(",").map(r => r.trim().toLowerCase()).filter(Boolean))];
        }

        /* --- Nustatymų lango valdymas --- */

        function openSettings() {
            if (gameInProgress) return;

            tempPlayerCount = currentSettings.playerCount;
            tempBadCount = currentSettings.badCount;
            renderSettingCounts();

            document.getElementById("setMandatory").value = currentSettings.mandatory.join(", ");
            document.getElementById("setNeutral").value = currentSettings.neutral.join(", ");
            document.getElementById("setRegular").value = currentSettings.regular.join(", ");

            document.getElementById("gameScreen").classList.remove("active");
            document.getElementById("settingsScreen").classList.add("active");
        }

        function adjustSettingCount(type, delta) {
            if (type === "players") {
                tempPlayerCount = Math.max(3, Math.min(20, tempPlayerCount + delta));
                const maxBad = Math.max(1, tempPlayerCount - 1);
                if (tempBadCount > maxBad) {
                    tempBadCount = maxBad;
                }
            } else if (type === "bad") {
                const maxBad = Math.max(1, tempPlayerCount - 1);
                tempBadCount = Math.max(1, Math.min(maxBad, tempBadCount + delta));
            }
            renderSettingCounts();
        }

        function renderSettingCounts() {
            document.getElementById("setPlayerCount").textContent = tempPlayerCount;
            document.getElementById("setBadCount").textContent = tempBadCount;
        }

        function closeSettings() {
            document.getElementById("settingsScreen").classList.remove("active");
            document.getElementById("gameScreen").classList.add("active");
        }

        function saveSettings() {
            const parsedMandatory = parseRoleList(document.getElementById("setMandatory").value);
            const parsedNeutral = parseRoleList(document.getElementById("setNeutral").value);
            const parsedRegular = parseRoleList(document.getElementById("setRegular").value);

            currentSettings.playerCount = tempPlayerCount;
            currentSettings.badCount = tempBadCount;
            currentSettings.mandatory = parsedMandatory.length ? parsedMandatory : [...defaultSettings.mandatory];
            currentSettings.neutral = parsedNeutral;
            currentSettings.regular = parsedRegular.length ? parsedRegular : [...defaultSettings.regular];

            validateCounts();
            saveToStorage();
            prepareNewGame();
            closeSettings();
        }

        function resetToFactoryDefaults() {
            if (confirm("Ar tikrai norite atstatyti gamyklines žaidimo roles ir nustatymus?")) {
                localStorage.removeItem("game_settings");
                currentSettings = {
                    mandatory: [...defaultSettings.mandatory],
                    neutral: [...defaultSettings.neutral],
                    regular: [...defaultSettings.regular],
                    playerCount: defaultSettings.playerCount,
                    badCount: defaultSettings.badCount
                };
                prepareNewGame();
                closeSettings();
            }
        }

        /* --- Žaidimo logika --- */

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function setSetupControlsDisabled(disabled) {
            document.getElementById("settingsBtn").disabled = disabled;
        }

        function prepareNewGame() {
            clearTimeout(cooldownTimer);
            gameInProgress = false;
            setSetupControlsDisabled(false);

            document.getElementById("resetBtn").classList.add("hidden");
            document.getElementById("actionBtn").classList.remove("hidden");

            const playerCount = currentSettings.playerCount;
            const badCount = currentSettings.badCount;
            totalPlayerCount = playerCount;

            // 1. Paruošiame blogiečių roles
            const shuffledMandatory = shuffleArray([...currentSettings.mandatory]);
            const chosenImposters = shuffledMandatory.slice(0, badCount);
            const fallbackBadRole = currentSettings.mandatory[0] || "imposteris";
            while (chosenImposters.length < badCount) {
                chosenImposters.push(fallbackBadRole);
            }

            // 2. Paruošiame likusias roles (neutralūs + geriečiai)
            const otherAvailable = [...currentSettings.neutral, ...currentSettings.regular];
            const shuffledOthers = shuffleArray(otherAvailable);

            let gameRoles = [...chosenImposters, ...shuffledOthers];

            const fillerGoodRole = currentSettings.regular[0] || "žmogus";
            while (gameRoles.length < playerCount) {
                gameRoles.push(fillerGoodRole);
            }

            if (gameRoles.length > playerCount) {
                gameRoles = gameRoles.slice(0, playerCount);
            }

            availableRoles = shuffleArray(gameRoles);

            document.getElementById("statPlayers").textContent = totalPlayerCount;
            document.getElementById("statBad").textContent = badCount;

            resetToHiddenState(true);
        }

        function resetToHiddenState(isFirstPlayer = false) {
            clearTimeout(cooldownTimer);
            currentState = "READY_TO_GET";
            
            const nextPlayerNumber = totalPlayerCount - availableRoles.length + 1;

            const initialText = document.getElementById("initialText");
            initialText.style.display = "block";
            initialText.textContent = isFirstPlayer
                ? "Žaidimas paruoštas! Pirmasis žaidėjas atverčia savo rolę."
                : "Kito žaidėjo eilė.";
            
            const roleText = document.getElementById("roleText");
            roleText.style.display = "none";
            roleText.textContent = "";
            roleText.className = "role-title";
            
            const actionBtn = document.getElementById("actionBtn");
            actionBtn.disabled = false;
            actionBtn.textContent = `Gauti rolę (${nextPlayerNumber} iš ${totalPlayerCount})`;
        }

        function handleAction() {
            const roleText = document.getElementById("roleText");
            const initialText = document.getElementById("initialText");
            const actionBtn = document.getElementById("actionBtn");

            if (currentState === "READY_TO_GET") {
                if (!gameInProgress) {
                    gameInProgress = true;
                    setSetupControlsDisabled(true);
                    document.getElementById("resetBtn").classList.remove("hidden");
                }

                const selectedRole = availableRoles.shift();

                initialText.style.display = "none";
                roleText.textContent = selectedRole;
                
                if (currentSettings.mandatory.includes(selectedRole)) {
                    roleText.className = "role-title alert";
                } else if (currentSettings.neutral.includes(selectedRole)) {
                    roleText.className = "role-title neutral";
                } else {
                    roleText.className = "role-title normal";
                }

                roleText.style.display = "block";
                currentState = "ROLE_SHOWN";

                actionBtn.disabled = true;
                actionBtn.textContent = "Įsiminkite rolę...";

                cooldownTimer = setTimeout(() => {
                    actionBtn.disabled = false;
                    actionBtn.innerHTML = 'Įsiminiau <i class="fa-solid fa-check"></i>';
                }, COOLDOWN_SECONDS * 1000);

            } else {
                if (availableRoles.length === 0) {
                    initialText.style.display = "block";
                    initialText.textContent = "Rolės išdalintos! Gero žaidimo!";
                    roleText.style.display = "none";
                    
                    // Paslepiame pagrindinį mygtuką ir atrakiname nustatymus
                    actionBtn.classList.add("hidden");
                    gameInProgress = false;
                    setSetupControlsDisabled(false);
                    return;
                }
                resetToHiddenState(false);
            }
        }

        function resetGame() {
            if (gameInProgress) {
                if (!confirm("Ar tikrai norite nutraukti rolių dalinimą ir pradėti iš naujo?")) {
                    return;
                }
            }
            prepareNewGame();
        }

        initApp();
    </script>

</body>
</html>
