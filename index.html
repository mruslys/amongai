<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>C4RDx5 — Universalus žaidimų moderatorius</title>
<link rel="icon" type="image/png" href="https://mruslys.github.io/amongai/f/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="https://mruslys.github.io/amongai/f/favicon.svg" />
<link rel="shortcut icon" href="https://mruslys.github.io/amongai/f/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="https://mruslys.github.io/amongai/f/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="C4RDx5" />
<link rel="manifest" href="https://mruslys.github.io/amongai/f/site.webmanifest" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg: #090a0f;
    --surface: #12151f;
    --surface-2: #1a1f2e;
    --border: #262c40;
    --text: #f3f4f6;
    --muted: #8b95a5;
    --c-none: #4b5563;
    --c-red: #ef4444;
    --c-amber: #f59e0b;
    --c-emerald: #10b981;
    --c-cyan: #06b6d4;
    --c-blue: #3b82f6;
    --c-purple: #a855f7;
    --c-pink: #ec4899;
    --c-gray: #9ca3af;
    --c-white: #ffffff;
    --accent: var(--c-blue);
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  input, textarea, select {
    user-select: text;
    -webkit-user-select: text;
  }

  body, html {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  #app {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 18px;
    transition: box-shadow 0.25s ease;
  }

  /* Šviesos efektai (FX) */
  .fx-start { animation: flashEdge 0.9s ease-out; }
  .fx-end { animation: pulseEdge 0.8s infinite alternate; }
  .fx-alarm { animation: alarmFlash 0.35s infinite alternate !important; }
  .fx-final { box-shadow: inset 0 0 90px var(--accent), inset 0 0 30px var(--accent); }

  @keyframes flashEdge {
    0% { box-shadow: inset 0 0 110px var(--accent), inset 0 0 40px var(--accent); }
    100% { box-shadow: inset 0 0 0px transparent; }
  }
  @keyframes pulseEdge {
    0% { box-shadow: inset 0 0 25px var(--accent); }
    100% { box-shadow: inset 0 0 95px var(--accent), inset 0 0 35px var(--accent); }
  }
  @keyframes alarmFlash {
    0% { box-shadow: inset 0 0 30px var(--c-red); background: #1f0909; }
    100% { box-shadow: inset 0 0 120px var(--c-red); background: #3b0a0a; }
  }

  /* 0.6s apsaugos barjeras */
  .locked { pointer-events: none !important; }
  .lock-bar {
    position: fixed;
    top: 0; left: 0; height: 4px;
    background: var(--accent);
    width: 0%;
    z-index: 250;
  }
  .lock-bar.active { animation: lockProgress 0.6s linear forwards; }
  @keyframes lockProgress {
    0% { width: 100%; opacity: 1; }
    100% { width: 0%; opacity: 0; }
  }

  /* Viršutinė ir apatinė juostos */
  .top-bar {
    width: 100%;
    max-width: 540px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 48px;
    flex-shrink: 0;
    position: relative;
    z-index: 130;
  }
  .top-bar.catalog-brand-bar {
    justify-content: center;
    min-height: 48px;
    margin-bottom: 2px;
  }
  .catalog-brand-logo {
    width: 96px;
    height: 96px;
    display: block;
    border-radius: 50%;
    object-fit: contain;
  }
  .top-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .bottom-bar {
    width: 100%;
    max-width: 540px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
    padding-bottom: 6px;
    flex-shrink: 0;
  }
  .action-row {
    display: flex;
    gap: 20px;
    justify-content: center;
    align-items: center;
    width: 100%;
  }

  /* Mygtukai */
  button {
    background: var(--surface);
    border: 2px solid var(--border);
    color: var(--text);
    border-radius: 50%;
    width: 62px; height: 62px;
    font-size: 1.4rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.1s, border-color 0.2s, background 0.2s, color 0.2s, box-shadow 0.2s;
    padding: 0;
  }
  button:active { transform: scale(0.92); }
  button.sm { width: 42px; height: 42px; font-size: 1.05rem; }
  button.xs { width: 36px; height: 36px; font-size: 0.95rem; border-width: 1px; }
  button.lg {
    width: 78px; height: 78px;
    font-size: 1.85rem;
    border-color: var(--accent);
    box-shadow: 0 0 24px -6px var(--accent);
  }
  button.danger { border-color: var(--c-red); color: var(--c-red); }
  button.danger.active-alarm {
    background: var(--c-red);
    color: #fff;
    box-shadow: 0 0 25px var(--c-red);
  }
  button.pulse-btn {
    border-color: var(--accent);
    animation: btnPulse 0.7s infinite alternate;
  }
  @keyframes btnPulse {
    from { transform: scale(1); box-shadow: 0 0 5px var(--accent); }
    to { transform: scale(1.12); box-shadow: 0 0 25px var(--accent); }
  }

  .hold-btn {
    touch-action: none;
  }
  .hold-btn.holding {
    transform: scale(1.14);
    border-color: var(--hold-color, var(--c-red));
    color: var(--hold-color, var(--c-red));
    box-shadow: 0 0 22px var(--hold-color, var(--c-red));
  }

  /* =========================================================================
     1. HOME KATALOGAS (PLIed + SEARCH + TAB'Ų ARCHITEKTŪRA)
     ========================================================================= */
  .catalog-wrap {
    width: 100%;
    max-width: 540px;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 2px 2px 12px 2px;
  }
  .catalog-add-btn {
    width: 100%;
    height: 46px;
    border-radius: 14px;
    border: 1px dashed var(--border);
    background: rgba(26, 31, 46, 0.55);
    color: var(--text);
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.14s ease, border-color 0.2s, color 0.2s, background 0.2s, box-shadow 0.2s;
  }
  .catalog-add-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(59, 130, 246, 0.08);
  }
  .catalog-add-btn:active {
    transform: scale(0.985);
  }
  .catalog-search-wrap {
    width: 100%;
    height: 44px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
    flex-shrink: 0;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .catalog-search-wrap:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 14px -5px var(--accent);
  }
  .catalog-search-icon {
    color: var(--muted);
    font-size: 0.95rem;
    flex-shrink: 0;
  }
  .catalog-search-input {
    flex: 1;
    min-width: 0;
    height: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 0.96rem;
    outline: none;
  }
  .catalog-search-input::placeholder {
    color: var(--muted);
    opacity: 0.75;
  }
  .catalog-search-clear {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: var(--surface-2);
    color: var(--muted);
    font-size: 0.8rem;
    display: none;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
  }
  .catalog-search-clear.visible {
    display: inline-flex;
  }
  .catalog-search-clear:hover {
    color: var(--text);
  }
  .catalog-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    background: var(--surface);
    padding: 6px;
    border-radius: 16px;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .catalog-tab {
    width: 100%;
    height: 44px;
    border-radius: 11px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    font-size: 0.95rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    cursor: pointer;
    transition: background 0.18s, color 0.18s, border-color 0.18s;
  }
  .catalog-tab:active {
    transform: scale(0.96);
  }
  .catalog-tab.active {
    background: var(--surface-2);
    color: var(--text);
    border-color: var(--accent);
    box-shadow: 0 0 14px -5px var(--accent);
  }
  .catalog-tab-count {
    font-size: 0.8rem;
    opacity: 0.85;
  }
  .catalog-panel {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-bottom: 16px;
  }
  .catalog-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .catalog-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 5px solid var(--card-accent, var(--c-blue));
    border-radius: 12px;
    padding: 11px 13px;
    cursor: pointer;
    transition: transform 0.16s ease, opacity 0.22s ease, max-height 0.22s ease, padding 0.22s ease, margin 0.22s ease, border-color 0.2s;
    gap: 10px;
    max-height: 90px;
    overflow: hidden;
  }
  .catalog-card:active {
    transform: scale(0.985);
  }
  .catalog-card.deleting-card {
    opacity: 0 !important;
    transform: scale(0.93) !important;
    max-height: 0 !important;
    padding-top: 0 !important;
    padding-bottom: 0 !important;
    margin-top: -8px !important;
    border-width: 0 !important;
    pointer-events: none !important;
  }
  .catalog-card-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
    word-break: break-word;
    flex: 1;
  }
  .catalog-card-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
  }
  .star-active {
    color: var(--c-amber) !important;
    border-color: rgba(245, 158, 11, 0.45) !important;
  }
  .copied-check {
    color: var(--c-emerald) !important;
    border-color: rgba(16, 185, 129, 0.55) !important;
    background: rgba(16, 185, 129, 0.12) !important;
  }

  /* 3.A Priešžaidiminis langas */
  .game-header { text-align: center; margin: 4px 0 8px; }
  .game-title {
    font-size: 2.1rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    border-bottom: 3px solid var(--accent);
    padding-bottom: 6px;
    display: inline-block;
  }
  .counter-pill {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    padding: 8px 20px;
    border-radius: 999px;
    border: 1px solid var(--border);
  }
  .card-list {
    width: 100%;
    max-width: 460px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 4px 2px;
    margin: 8px 0;
  }
  .card-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface);
    padding: 9px 14px;
    border-radius: 12px;
    border-left: 5px solid var(--row-color, var(--border));
    gap: 10px;
  }
  .card-row-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .card-row-title {
    font-size: 1.08rem;
    font-weight: 600;
    word-break: break-word;
  }
  .card-row-group {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .stepper { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .stepper button { width: 34px; height: 34px; font-size: 0.95rem; }
  .stepper span { font-size: 1.2rem; font-weight: 700; min-width: 26px; text-align: center; }

  /* 3.B Kortos komponentas */
  .card-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }
  .playing-card {
    width: min(84vw, 330px);
    height: min(58vh, 450px);
    border-radius: 26px;
    background: var(--surface);
    border: 4px solid var(--card-color, var(--accent));
    box-shadow: 0 12px 40px -10px rgba(0,0,0,0.75), 0 0 30px -10px var(--card-color, var(--accent));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    position: relative;
    transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.2s;
  }
  .playing-card:active { transform: scale(0.97); }
  .playing-card.face-down {
    background: repeating-linear-gradient(
      135deg,
      #10131c,
      #10131c 14px,
      #161a28 14px,
      #161a28 28px
    );
  }
  .card-back-emblem {
    width: 82px; height: 82px;
    border-radius: 50%;
    border: 3px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.1rem;
    color: var(--accent);
    box-shadow: 0 0 22px -4px var(--accent);
    background: rgba(9, 10, 15, 0.75);
  }
  .card-face-group {
    font-size: 1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 10px;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    max-width: 100%;
    word-break: break-word;
  }
  .card-face-title {
    font-size: 2.2rem;
    font-weight: 800;
    line-height: 1.25;
    word-break: break-word;
    color: var(--card-text-color, var(--text));
  }
  .return-btn-wrap { position: absolute; bottom: 20px; }

  /* 3.C Fazių moderatorius */
  .phase-stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    width: 100%;
  }
  .phase-title {
    font-size: 1.9rem;
    font-weight: 700;
    color: var(--accent);
    max-width: 90%;
  }
  .timer-display {
    font-size: clamp(4rem, 17vw, 6.2rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.03em;
  }
  .timer-blink {
    color: var(--c-red);
    animation: blinkTxt 0.5s infinite alternate;
  }
  @keyframes blinkTxt { from { opacity: 1; } to { opacity: 0.2; } }

  /* 3.D Finaliniai žetonai ir Universalus Užlaikymo (Hold) peržiūros sluoksnis */
  .finals-tray {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    width: 100%;
    position: relative;
    z-index: 130;
  }
  .final-token {
    width: 50px; height: 50px;
    border-radius: 50%;
    border: 2px solid var(--token-color);
    color: var(--token-color);
    font-size: 1.2rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 14px -3px var(--token-color);
    background: #141824;
    touch-action: none;
    position: relative;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .final-token.holding {
    transform: scale(1.16);
    box-shadow: 0 0 28px var(--token-color);
  }

  #hold-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 120;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(9, 10, 15, 0.92);
    opacity: 0;
    visibility: hidden;
  }
  #hold-overlay.active {
    visibility: visible;
  }
  #hold-overlay .hold-target {
    transform: scale(var(--hold-scale, 0.88));
    transition: none;
  }
  .hold-symbol-badge {
    width: 132px;
    height: 132px;
    border-radius: 50%;
    background: var(--surface);
    border: 4px solid var(--badge-color, var(--c-red));
    color: var(--badge-color, var(--c-red));
    box-shadow: 0 12px 40px -10px rgba(0,0,0,0.8), 0 0 36px -6px var(--badge-color, var(--c-red));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
  }

  .btn-confirm { border-color: var(--c-emerald); color: var(--c-emerald); }

  /* =========================================================================
     2. REDAKTORIUS (EDITOR FORMA)
     ========================================================================= */
  .editor-wrap {
    width: 100%;
    max-width: 540px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 4px 4px 24px 4px;
  }
  .editor-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    min-height: 36px;
  }
  .hash-badge {
    font-family: monospace;
    font-size: 0.8rem;
    background: var(--surface-2);
    padding: 3px 8px;
    border-radius: 6px;
    color: var(--c-cyan);
    border: 1px solid var(--border);
  }
  .field-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field-label {
    font-size: 0.82rem;
    color: var(--muted);
    font-weight: 600;
  }
  .field-icon {
    color: var(--muted);
    font-size: 1rem;
  }
  .text-input, .select-input {
    width: 100%;
    min-width: 0;
    flex: 1;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
  }
  .text-input:focus, .select-input:focus {
    border-color: var(--accent);
  }
  .palette-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .color-swatch {
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s;
  }
  .color-swatch.selected {
    border-color: #fff;
    transform: scale(1.18);
    box-shadow: 0 0 10px currentColor;
  }
  .editor-item-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .editor-item {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: 4px solid var(--item-color, var(--border));
    border-radius: 12px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .editor-item-main {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
  }
  .editor-item-subrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
  }
  .color-cycle-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.55);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.85);
  }
  .color-cycle-btn.is-none {
    border: 2px dashed var(--muted);
    background: var(--bg) !important;
    color: var(--muted);
  }
  .num-input {
    width: 68px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 8px;
    border-radius: 8px;
    font-size: 0.95rem;
    text-align: center;
    outline: none;
  }
  .num-input:focus {
    border-color: var(--accent);
  }
  .group-select {
    flex: 1;
    min-width: 120px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);

<!-- Universalus užlaikymo (Hold-to-Action) peržiūros sluoksnis -->
<div id="hold-overlay"></div>

<script>
// ============================================================================
// SISTEMOS KONSTANTOS, VIBRACIJA (HAPTICS) IR UŽLAIKYMO (HOLD) KONFIGŪRACIJA
// ============================================================================
const MAX_RECENT_GAMES = 10;                 // Maksimalus paskutinių žaistų žaidimų skaičius
const SESSION_TTL_MS = 6 * 60 * 60 * 1000;   // Sesijos kortų kiekių galiojimo laikas (6 val. nuo paskutinio Play/keitimo)

const Haptics = {
  vibrate(pattern) {
    try {
      if (navigator.vibrate) navigator.vibrate(pattern);
    } catch (_) {}
  },
  tap() { this.vibrate(12); },
  cardFlip() { this.vibrate(18); },
  holdPulse() { this.vibrate(22); },
  holdComplete() { this.vibrate([40, 30, 65]); },
  phaseStart() { this.vibrate(35); },
  tick() { this.vibrate(15); },
  phaseEnd() { this.vibrate([120, 60, 120, 60, 180]); },
  alarm() { this.vibrate([160, 80, 160]); },
  finalWin() { this.vibrate([60, 40, 60, 40, 160]); }
};

const HOLD_CONFIG = {
  FILL_MS: 1300,        // Laikas iki pilno veiksmo įvykdymo laikant paspaudus (ms)
  DECAY_MS: 650,        // Išblėsimo (fade-out) laikas atleidus mygtuką (ms)
  INITIAL_JUMP: 0.32,   // Pradinis blyksnis trumpai bakstelėjus (0..1)
  REPRESS_BOOST: 0.08,  // Papildomas šuolis paspaudus dar kartą, kol blyksnis neišblėso
  MAX_BOOST_CAP: 0.88   // Viršutinė šuolio riba, kad visada reikėtų bent trumpai palaikyti
};

const HoldEngine = {
  activeKey: null,
  isHolding: false,
  progress: 0,
  lastTime: 0,
  rafId: null,
  handler: null,

  start(key, handler, e) {
    if (e) {
      e.stopPropagation();
      e.preventDefault();
    }
    if (state.locked) return;
    if (isPlayAudioAllowed()) SoundEngine.unlock();

    if (this.activeKey !== key) {
      this.reset();
      this.activeKey = key;
      this.progress = 0;
      this.handler = handler;
      if (handler.onSetup) handler.onSetup();
    } else {
      this.handler = handler;
      if (handler.onSetup) handler.onSetup();
    }

    this.isHolding = true;
    this.lastTime = performance.now();

    if (this.progress < HOLD_CONFIG.INITIAL_JUMP) {
      this.progress = HOLD_CONFIG.INITIAL_JUMP;
    } else {
      this.progress = Math.min(HOLD_CONFIG.MAX_BOOST_CAP, this.progress + HOLD_CONFIG.REPRESS_BOOST);
    }

    Haptics.holdPulse();
    if (isPlayAudioAllowed()) {
      SoundEngine.playHoldPulse(this.progress, Boolean(handler.isDanger));
    }

    if (this.handler.onUpdate) {
      this.handler.onUpdate(this.progress, true);
    }

    if (!this.rafId) {
      this.rafId = requestAnimationFrame(t => this.step(t));
    }
  },

  release() {
    if (!this.activeKey) return;
    this.isHolding = false;
    if (this.handler && this.handler.onRelease) {
      this.handler.onRelease(this.progress);
    }
  },

  reset() {
    if (this.rafId) {
      cancelAnimationFrame(this.rafId);
      this.rafId = null;
    }
    if (this.handler && this.handler.onCleanup) {
      this.handler.onCleanup();
    }
    this.activeKey = null;
    this.isHolding = false;
    this.progress = 0;
    this.handler = null;
  },

  step(now) {
    if (!this.activeKey || !this.handler) {
      this.reset();
      return;
    }

    const dt = Math.min(80, Math.max(0, now - this.lastTime));
    this.lastTime = now;

    if (this.isHolding) {
      this.progress = Math.min(1, this.progress + dt / HOLD_CONFIG.FILL_MS);
      if (this.handler.onUpdate) this.handler.onUpdate(this.progress, true);

      if (this.progress >= 1) {
        const doneFn = this.handler.onComplete;
        this.reset();
        Haptics.holdComplete();
        if (doneFn) doneFn();
        return;
      }
    } else {
      this.progress = Math.max(0, this.progress - dt / HOLD_CONFIG.DECAY_MS);
      if (this.handler.onUpdate) this.handler.onUpdate(this.progress, false);

      if (this.progress <= 0) {
        this.reset();
        return;
      }
    }

    this.rafId = requestAnimationFrame(t => this.step(t));
  },

  startOverlayHold({ key, btnId, colorCss, innerHtml, isDanger = false, onComplete }) {
    this.start(key, {
      isDanger,
      onSetup() {
        const overlay = document.getElementById('hold-overlay');
        if (overlay) {
          overlay.innerHTML = innerHtml;
          overlay.style.boxShadow = `inset 0 0 90px ${colorCss}, inset 0 0 30px ${colorCss}`;
          overlay.classList.add('active');
        }
        const btn = btnId ? document.getElementById(btnId) : null;
        if (btn) btn.classList.add('holding');
      },
      onUpdate(p) {
        const overlay = document.getElementById('hold-overlay');
        if (overlay) {
          overlay.style.opacity = p.toFixed(3);
          overlay.style.setProperty('--hold-scale', (0.86 + 0.14 * p).toFixed(3));
        }
      },
      onRelease() {
        const btn = btnId ? document.getElementById(btnId) : null;
        if (btn) btn.classList.remove('holding');
      },
      onCleanup() {
        const btn = btnId ? document.getElementById(btnId) : null;
        if (btn) btn.classList.remove('holding');
        const overlay = document.getElementById('hold-overlay');
        if (overlay) {
          overlay.classList.remove('active');
          overlay.style.opacity = '0';
          overlay.innerHTML = '';
        }
      },
      onComplete
    });
  }
};

window.addEventListener('pointerup', () => HoldEngine.release());
window.addEventListener('pointercancel', () => HoldEngine.release());

function getColorCss(colorKey, fallback = 'var(--c-none)') {
  if (!colorKey || colorKey === 'none') return fallback;
  return PALETTE[colorKey] || fallback;

function getGroupById(gameObj, groupId) {
  if (!gameObj || !groupId || !Array.isArray(gameObj.groups)) return null;

function resolveCardColorKey(gameObj, card) {
  if (card && card.color && card.color !== 'none') return card.color;
  if (card && card.groupId) {
    const grp = getGroupById(gameObj, card.groupId);
    if (grp && grp.color && grp.color !== 'none') return grp.color;
  }
  return 'none';
}

function normalizeGameObject(g) {
  const copy = JSON.parse(JSON.stringify(g || {}));
  copy.title = copy.title || "Žaidimas";
  copy.color = COLOR_KEYS.includes(copy.color) ? copy.color : "blue";
  copy.dealMode = [1, 2, 3, 4].includes(Number(copy.dealMode)) ? Number(copy.dealMode) : 1;
  copy.drawCount = Math.max(1, parseInt(copy.drawCount, 10) || 1);
  copy.shuffle = Boolean(copy.shuffle);
  copy.returnMethod = RETURN_METHODS.includes(copy.returnMethod) ? copy.returnMethod : "bottom";
  copy.returnCondition = RETURN_CONDS.includes(copy.returnCondition) ? copy.returnCondition : "auto";
  copy.groups = Array.isArray(copy.groups) ? copy.groups.map((grp, i) => ({
    id: grp.id || `g_${i + 1}`,
    title: grp.title ?? "Grupė",
    color: ITEM_COLOR_KEYS.includes(grp.color) ? grp.color : "none"
  })) : [];
  const validGroupIds = new Set(copy.groups.map(grp => grp.id));
  copy.cards = Array.isArray(copy.cards) ? copy.cards.map((c, i) => ({
    id: c.id || `c_${i + 1}`,
    title: c.title ?? "Korta",
    groupId: validGroupIds.has(c.groupId) ? c.groupId : "",
    color: ITEM_COLOR_KEYS.includes(c.color) ? c.color : "none",
    count: Math.max(0, Number(c.count) || 0)
  })) : [];
  copy.phases = Array.isArray(copy.phases) ? copy.phases.map((p, i) => ({
    id: p.id || `p_${i + 1}`,
    title: p.title ?? "Fazė",
    color: ITEM_COLOR_KEYS.includes(p.color) ? p.color : "blue",
    loop: Boolean(p.loop),
    duration: Math.max(0, Number(p.duration) || 0),
    fxAlarm: Boolean(p.fxAlarm)
  })) : [];
  copy.finals = Array.isArray(copy.finals) ? copy.finals.map((f, i) => ({
    id: f.id || `f_${i + 1}`,
    title: f.title ?? "Finalas",
    color: ITEM_COLOR_KEYS.includes(f.color) ? f.color : "emerald"
  })) : [];
  if (g && g._recentTs) {
    copy._recentTs = Number(g._recentTs) || Date.now();
  }
  copy.hash = computeCanonicalHash(copy);
  return copy;
}

// ============================================================================
// DETERMINISTINIS HASH IR POZICINIO MASYVO SERIALIZACIJA (DEFLATE)
// ============================================================================
function computeCanonicalHash(gameObj) {
  const groups = Array.isArray(gameObj.groups) ? gameObj.groups : [];
  const groupIndexMap = new Map(groups.map((g, idx) => [g.id, idx]));
  const mode = Number(gameObj.dealMode) || 1;
  const drawN = Math.max(1, parseInt(gameObj.drawCount, 10) || 1);

  const canonical = {
    title: (gameObj.title || "").trim(),
    color: gameObj.color || "blue",
    dealMode: mode,
    ...(mode === 3 ? { drawCount: drawN } : {}),
    shuffle: Boolean(gameObj.shuffle),
    returnMethod: gameObj.returnMethod || "bottom",
    returnCondition: gameObj.returnCondition || "auto",
    groups: groups.map(g => ({
      title: (g.title || "").trim(),
      color: g.color || "none"
    })),
    cards: (gameObj.cards || []).map(c => ({
      title: (c.title || "").trim(),
      groupIdx: groupIndexMap.has(c.groupId) ? groupIndexMap.get(c.groupId) : -1,
      color: c.color || "none",
      count: Math.max(0, Number(c.count) || 0)
    })),
    phases: (gameObj.phases || []).map(p => ({
      title: (p.title || "").trim(),
      color: p.color || "blue",
      loop: Boolean(p.loop),
      duration: Math.max(0, Number(p.duration) || 0),
      fxAlarm: Boolean(p.fxAlarm)
    })),
    finals: (gameObj.finals || []).map(f => ({
      title: (f.title || "").trim(),
      color: f.color || "blue"
    }))
  };
  const str = JSON.stringify(canonical);
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0).toString(16).padStart(8, '0');
}

function gameToPositionalArray(g) {
  const groups = Array.isArray(g.groups) ? g.groups : [];
  const groupIndexMap = new Map(groups.map((grp, idx) => [grp.id, idx]));

  return [
    (g.title || "Žaidimas").trim(),
    Math.max(0, COLOR_KEYS.indexOf(g.color || "blue")),
    Number(g.dealMode) || 1,
    g.shuffle ? 1 : 0,
    Math.max(0, RETURN_METHODS.indexOf(g.returnMethod || "bottom")),
    Math.max(0, RETURN_CONDS.indexOf(g.returnCondition || "auto")),
    (g.cards || []).map(c => [
      (c.title || "").trim(),
      Math.max(0, ITEM_COLOR_KEYS.indexOf(c.color || "none")),
      Math.max(0, Number(c.count) || 0),
      groupIndexMap.has(c.groupId) ? groupIndexMap.get(c.groupId) : -1
    ]),
    (g.phases || []).map(p => [
      (p.title || "").trim(),
      Math.max(0, ITEM_COLOR_KEYS.indexOf(p.color || "blue")),
      Math.max(0, Number(p.duration) || 0),
      (p.loop ? 1 : 0) | (p.fxAlarm ? 8 : 0)
    ]),
    (g.finals || []).map(f => [
      (f.title || "").trim(),
      Math.max(0, ITEM_COLOR_KEYS.indexOf(f.color || "blue"))
    ]),
    groups.map(grp => [
      (grp.title || "").trim(),
      Math.max(0, ITEM_COLOR_KEYS.indexOf(grp.color || "none"))
    ]),
    Math.max(1, parseInt(g.drawCount, 10) || 1)
  ];
}

function positionalArrayToGame(arr) {
  if (!Array.isArray(arr) || arr.length < 9) throw new Error("Netinkamas masyvas");
  const hasGroupsArr = Array.isArray(arr[9]);
  const colorLookup = hasGroupsArr ? ITEM_COLOR_KEYS : COLOR_KEYS;

  const groups = hasGroupsArr ? arr[9].map((grp, i) => ({
    id: `g_${i + 1}`,
    title: String(grp[0] || "Grupė"),
    color: colorLookup[grp[1]] || "none"
  })) : [];

  const game = {
    title: String(arr[0] || "Žaidimas"),
    color: COLOR_KEYS[arr[1]] || "blue",
    dealMode: [1, 2, 3, 4].includes(Number(arr[2])) ? Number(arr[2]) : 1,
    drawCount: Math.max(1, parseInt(arr[10], 10) || 1),
    shuffle: Boolean(arr[3]),
    returnMethod: RETURN_METHODS[arr[4]] || "bottom",
    returnCondition: RETURN_CONDS[arr[5]] || "auto",
    groups,
    cards: Array.isArray(arr[6]) ? arr[6].map((c, i) => {
      const grpIdx = (c.length > 3 && Number.isInteger(c[3]) && c[3] >= 0 && groups[c[3]]) ? c[3] : -1;
      return {
        id: `c_${i + 1}`,
        title: String(c[0] || "Korta"),
        color: colorLookup[c[1]] || "none",
        count: Math.max(0, Number(c[2]) || 0),
        groupId: grpIdx !== -1 ? groups[grpIdx].id : ""
      };
    }) : [],
    phases: Array.isArray(arr[7]) ? arr[7].map((p, i) => {
      const mask = Number(p[3]) || 0;
      return {
        id: `p_${i + 1}`,
        title: String(p[0] || "Fazė"),
        color: colorLookup[p[1]] || "blue",
        duration: Math.max(0, Number(p[2]) || 0),
        loop: Boolean(mask & 1),
        fxAlarm: Boolean(mask & 8)
      };
    }) : [],
    finals: Array.isArray(arr[8]) ? arr[8].map((f, i) => ({
      id: `f_${i + 1}`,
      title: String(f[0] || "Finalas"),
      color: colorLookup[f[1]] || "blue"
    })) : []
  };
  return normalizeGameObject(game);
}

async function runCompressionPipeline(inputBytes, transformStream) {
  const writer = transformStream.writable.getWriter();
  writer.write(inputBytes);
  writer.close();

  const reader = transformStream.readable.getReader();
  const chunks = [];
  let totalLen = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    totalLen += value.byteLength;
  }
  const out = new Uint8Array(totalLen);
  let offset = 0;
  for (const ch of chunks) {
    out.set(ch, offset);
    offset += ch.byteLength;
  }
  return out;
}

async function encodeGameToDeflateParam(gameObj) {
  const posArr = gameToPositionalArray(gameObj);
  const jsonBytes = new TextEncoder().encode(JSON.stringify(posArr));
  let bytes = jsonBytes;
  if ('CompressionStream' in window) {
    try {
      bytes = await runCompressionPipeline(jsonBytes, new CompressionStream('deflate-raw'));
    } catch (_) {}
  }
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function decodeGameFromDeflateParam(encodedStr) {
  const b64 = encodedStr.replace(/-/g, '+').replace(/_/g, '/');
  const pad = b64.length % 4 ? '='.repeat(4 - (b64.length % 4)) : '';
  const binary = atob(b64 + pad);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  let outBytes = bytes;
  if ('DecompressionStream' in window) {
    try {
      outBytes = await runCompressionPipeline(bytes, new DecompressionStream('deflate-raw'));
    } catch (_) {}
  }
  const text = new TextDecoder().decode(outBytes);
  return positionalArrayToGame(JSON.parse(text));
}

// ============================================================================
// CACHE API SAUGYKLA PAGAL HASH (SAVE, FAVORITES IR MOST RECENT BLOKAI)
// ============================================================================
const CacheStore = {
  MY_CACHE: 'amongai-my-games-v2',
  FAV_CACHE: 'amongai-fav-games-v2',
  RECENT_CACHE: 'amongai-recent-games-v2',
  memMy: new Map(),
  memFav: new Map(),
  memRecent: new Map(),

  async getAll(cacheName, memFallback) {
    if ('caches' in window) {
      try {
        const cache = await caches.open(cacheName);
        const keys = await cache.keys();
        const rawList = await Promise.all(keys.map(req => cache.match(req).then(r => r ? r.json() : null)));
        const byHash = new Map();
        rawList.filter(Boolean).forEach(item => {
          const norm = normalizeGameObject(item);
          byHash.set(norm.hash, norm);
        });
        return Array.from(byHash.values());
      } catch (_) {}
    }
    return Array.from(memFallback.values()).map(normalizeGameObject);
  },

  async put(cacheName, memFallback, gameObj) {
    const clean = normalizeGameObject(gameObj);
    memFallback.set(clean.hash, clean);
    if ('caches' in window) {
      try {
        const cache = await caches.open(cacheName);
        const url = `https://amongai.local/${cacheName}/${clean.hash}`;
        const res = new Response(JSON.stringify(clean), {
          headers: { 'Content-Type': 'application/json' }
        });
        await cache.put(url, res);
      } catch (_) {}
    }
    return clean;
  },

  async remove(cacheName, memFallback, hash) {
    memFallback.delete(hash);
    if ('caches' in window) {
      try {
        const cache = await caches.open(cacheName);
        await cache.delete(`https://amongai.local/${cacheName}/${hash}`);
        await cache.delete(`https://amongai.local/${cacheName}/${hash}.json`);
      } catch (_) {}
    }
  }
};

// ============================================================================
// SESIJOS ATMINTIES (CUSTOM COUNTS) SAUGYKLA SU SLENKANČIU TTL (LOCALSTORAGE)
// ============================================================================
const SessionStore = {
  STORAGE_KEY: 'amongai-session-counts-v1',

  _readAll() {
    try {
      const raw = localStorage.getItem(this.STORAGE_KEY);
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      const now = Date.now();
      let changed = false;
      for (const h of Object.keys(parsed)) {
        if (!parsed[h] || (now - (parsed[h].updatedAt || 0) > SESSION_TTL_MS)) {
          delete parsed[h];
          changed = true;
        }
      }
      if (changed) {
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(parsed));
      }
      return parsed;
    } catch (_) {
      return {};
    }
  },

  loadForGame(gameObj) {
    const all = this._readAll();
    const entry = all[gameObj.hash];
    const counts = {};
    const totalBase = (gameObj.cards || []).reduce((sum, c) => sum + (Number(c.count) || 0), 0);
    const configuredN = (Number(gameObj.dealMode) === 3 && Number(gameObj.drawCount) > 0)
      ? Number(gameObj.drawCount)
      : 1;
    const defaultDrawX = totalBase > 0
      ? Math.min(configuredN, Math.max(1, totalBase))
      : Math.max(1, configuredN);

    if (entry && entry.customCounts) {
      (gameObj.cards || []).forEach(c => {
        const val = entry.customCounts[c.id];
        counts[c.id] = (typeof val === 'number' && val >= 0) ? val : c.count;
      });
      const drawX = (typeof entry.randomDrawX === 'number')
        ? (totalBase > 0 ? Math.min(totalBase, Math.max(1, entry.randomDrawX)) : Math.max(1, entry.randomDrawX))
        : defaultDrawX;
      return { customCounts: counts, randomDrawX: drawX };
    }

    (gameObj.cards || []).forEach(c => {
      counts[c.id] = c.count;
    });
    return { customCounts: counts, randomDrawX: defaultDrawX };
  },

  saveForGame(hash, customCounts, randomDrawX) {
    if (!hash) return;
    try {
      const all = this._readAll();
      all[hash] = {
        customCounts: { ...customCounts },
        randomDrawX: Number(randomDrawX) || 1,
        updatedAt: Date.now()
      };
      localStorage.setItem(this.STORAGE_KEY, JSON.stringify(all));
    } catch (_) {}
  },

  removeForGame(hash) {
    if (!hash) return;
    try {
      const all = this._readAll();
      if (all[hash]) {
        delete all[hash];
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(all));
      }
    } catch (_) {}
  }
};

// ============================================================================
// WEB AUDIO API GARSO VARIKLIS (Aktyvus Tik Play Režimuose)
// ============================================================================
const PLAY_AUDIO_SCREENS = new Set(['PREGAME', 'DEAL', 'DEAL_DONE', 'PHASE', 'FINAL']);

function isPlayAudioAllowed() {
  return PLAY_AUDIO_SCREENS.has(state.screen);
}

const SoundEngine = {
  ctx: null,
  muted: false,
  keepAliveOsc: null,
  keepAliveGain: null,
  sirenInterval: null,
  sirenOsc: null,
  sirenGain: null,

  ensureContext() {
    if (!isPlayAudioAllowed()) return null;
    if ('audioSession' in navigator) {
      try { navigator.audioSession.type = 'playback'; } catch (_) {}
    }
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return null;

    if (!this.ctx || this.ctx.state === 'closed') {
      try { this.ctx = new AudioCtx(); } catch (_) { return null; }
    }
    if (this.ctx.state !== 'running') {
      try { this.ctx.resume().catch(() => {}); } catch (_) {}
    }
    return this.ctx;
  },

  unlock() {
    if (!isPlayAudioAllowed()) return;
    const ctx = this.ensureContext();
    if (!ctx) return;
    try {
      const buf = ctx.createBuffer(1, 1, 22050);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.onended = () => { try { src.disconnect(); } catch (_) {} };
      src.start(0);
    } catch (_) {}
  },

  startKeepAlive() {
    if (!isPlayAudioAllowed() || this.muted || this.keepAliveOsc) return;
    const ctx = this.ensureContext();
    if (!ctx) return;
    try {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1, ctx.currentTime);
      gain.gain.setValueAtTime(0.00001, ctx.currentTime);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      this.keepAliveOsc = osc;
      this.keepAliveGain = gain;
    } catch (_) {}
  },

  stopKeepAlive() {
    if (this.keepAliveOsc) {
      try { this.keepAliveOsc.stop(); this.keepAliveOsc.disconnect(); } catch (_) {}
      this.keepAliveOsc = null;
    }
    if (this.keepAliveGain) {
      try { this.keepAliveGain.disconnect(); } catch (_) {}
      this.keepAliveGain = null;
    }
  },

  _playTone(freqStart, freqEnd, duration, type = 'triangle', peakGain = 0.28, delay = 0) {
    if (!isPlayAudioAllowed() || this.muted) return;
    const ctx = this.ensureContext();
    if (!ctx) return;
    try {
      const startAt = ctx.currentTime + delay;
      const stopAt = startAt + duration;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freqStart, startAt);
      if (freqEnd && freqEnd !== freqStart) {
        osc.frequency.exponentialRampToValueAtTime(freqEnd, stopAt);
      }

      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.setValueAtTime(peakGain, startAt);
      gain.gain.exponentialRampToValueAtTime(0.0001, stopAt);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.onended = () => {
        try { osc.disconnect(); } catch (_) {}
        try { gain.disconnect(); } catch (_) {}
      };

      osc.start(startAt);
      osc.stop(stopAt + 0.01);
    } catch (_) {}
  },

  toggleMute() {
    this.muted = !this.muted;
    Haptics.tap();
    if (this.muted) {
      this.stopSiren();
      this.stopKeepAlive();
    } else {
      this.unlock();
      if (['DEAL', 'PHASE'].includes(state.screen)) {
        this.startKeepAlive();
      }
      this.playCardFlip(true);
    }
    render();
  },

  playCardFlip(faceUp) {
    this._playTone(faceUp ? 300 : 440, faceUp ? 580 : 200, 0.09, 'triangle', 0.28, 0);
  },

  playHoldPulse(progress = 0.3, isDanger = false) {
    const base = isDanger ? 210 : 320;
    const target = base + Math.round(progress * 220);
    this._playTone(base, target, 0.075, 'sine', 0.2, 0);
  },

  playPhaseStart() {
    this._playTone(440, 440, 0.32, 'triangle', 0.28, 0);
    this._playTone(659.25, 659.25, 0.38, 'triangle', 0.28, 0.11);
  },

  playTick() {
    this._playTone(920, 880, 0.055, 'sine', 0.22, 0);
  },

  playPhaseEnd() {
    [261.63, 392.00, 523.25].forEach(freq => {
      this._playTone(freq, freq, 0.9, 'sawtooth', 0.18, 0);
    });
  },

  startSiren() {
    this.stopSiren();
    if (!isPlayAudioAllowed() || this.muted || !state.alarmActive) return;
    const ctx = this.ensureContext();
    if (!ctx) return;

    try {
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(480, now);
      gain.gain.setValueAtTime(0.26, now);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);

      this.sirenOsc = osc;
      this.sirenGain = gain;

      let high = true;
      const sweep = () => {
        if (!this.sirenOsc || !this.ctx || !state.alarmActive || !isPlayAudioAllowed()) return;
        const c = this.ensureContext();
        if (!c) return;
        try {
          const t = c.currentTime;
          const startFreq = high ? 460 : 900;
          const endFreq = high ? 900 : 460;
          this.sirenOsc.frequency.cancelScheduledValues(t);
          this.sirenOsc.frequency.setValueAtTime(startFreq, t);
          this.sirenOsc.frequency.linearRampToValueAtTime(endFreq, t + 0.35);
          high = !high;
        } catch (_) {}
      };
      sweep();
      this.sirenInterval = setInterval(sweep, 370);
    } catch (_) {}
  },

  stopSiren() {
    if (this.sirenInterval) {
      clearInterval(this.sirenInterval);
      this.sirenInterval = null;
    }
    if (this.sirenOsc) {
      try { this.sirenOsc.stop(); this.sirenOsc.disconnect(); } catch (_) {}
      this.sirenOsc = null;
    }
    if (this.sirenGain) {
      try { this.sirenGain.disconnect(); } catch (_) {}
      this.sirenGain = null;
    }
  },

  playFinalFanfare() {
    const notes = [261.63, 329.63, 392.00, 523.25];
    notes.forEach((freq, idx) => {
      this._playTone(freq, freq, 1.05, 'triangle', 0.28, idx * 0.09);
    });
  }
};

['touchstart', 'touchend', 'pointerdown', 'click'].forEach(evt => {
  window.addEventListener(evt, () => {
    if (isPlayAudioAllowed()) SoundEngine.ensureContext();
  }, { passive: true });
});

function isPublicCatalogGame(hash) {
  return PUBLIC_GAMES.some(g => g.hash === hash);
}

// Pašalina ne viešo katalogo žaidimą iš Favorites, Recent ir Session talpyklų
async function purgeNonPublicGameFromOtherCaches(hash) {
  if (!hash || isPublicCatalogGame(hash)) return;
  await CacheStore.remove(CacheStore.FAV_CACHE, CacheStore.memFav, hash);
  await CacheStore.remove(CacheStore.RECENT_CACHE, CacheStore.memRecent, hash);
  SessionStore.removeForGame(hash);
}

async function refreshCatalogState() {
  state.myGames = await CacheStore.getAll(CacheStore.MY_CACHE, CacheStore.memMy);
  state.favGames = await CacheStore.getAll(CacheStore.FAV_CACHE, CacheStore.memFav);
  const recentRaw = await CacheStore.getAll(CacheStore.RECENT_CACHE, CacheStore.memRecent);
  recentRaw.sort((a, b) => (b._recentTs || 0) - (a._recentTs || 0));
  state.recentGames = recentRaw.slice(0, MAX_RECENT_GAMES);
}

// Įrašo žaidimą į Most Recent (RECENT_CACHE) viršų ir, viršijus MAX_RECENT_GAMES,
// pašalina seniausiai naudotus žaidimus (įskaitant ir viešus) iš RECENT_CACHE bei sąrašo
async function recordRecentGame(gameObj) {
  const copy = normalizeGameObject(gameObj);
  copy._recentTs = Date.now();
  await CacheStore.put(CacheStore.RECENT_CACHE, CacheStore.memRecent, copy);

  const allRecent = await CacheStore.getAll(CacheStore.RECENT_CACHE, CacheStore.memRecent);
  allRecent.sort((a, b) => (b._recentTs || 0) - (a._recentTs || 0));

  if (allRecent.length > MAX_RECENT_GAMES) {
    const overflow = allRecent.slice(MAX_RECENT_GAMES);
    for (const oldGame of overflow) {
      await CacheStore.remove(CacheStore.RECENT_CACHE, CacheStore.memRecent, oldGame.hash);
    }
  }
  await refreshCatalogState();
}

// Deep-link apdorojimas: /#/kodas pirmiausia išsaugo žaidimą į Most Recent ir atveria PREGAME
async function handleStartupRouting() {
  await refreshCatalogState();

  const rawHash = window.location.hash.slice(1);
  if (rawHash) {
    let encodedPayload = null;
    let pubHashParam = null;

    if (rawHash.startsWith('/')) {
      encodedPayload = rawHash.slice(1).trim();
    } else {
      const params = new URLSearchParams(rawHash);
      encodedPayload = params.get('g');
      pubHashParam = params.get('h');
    }

    if (encodedPayload) {
      try {
        const decodedGame = await decodeGameFromDeflateParam(encodedPayload);
        history.replaceState(null, '', window.location.pathname + window.location.search);
        const matchesPublic = isPublicCatalogGame(decodedGame.hash);
        await openGameSession(decodedGame, { isPublic: matchesPublic });
        return;
      } catch (e) {
        console.warn("Nepavyko iškoduoti žaidimo iš URL:", e);
      }
    } else if (pubHashParam) {
      const found = findGameAnySourceByHash(pubHashParam);
      if (found) {
        history.replaceState(null, '', window.location.pathname + window.location.search);
        await openGameSession(found, { isPublic: isPublicCatalogGame(found.hash) });
        return;
      }
    }
  }

  goToHome();
}

window.addEventListener('hashchange', () => {
  if (window.location.hash.length > 1) {
    handleStartupRouting();
  }
});

// Normalizuoja tekstą paieškai (be diakritikų ir mažosiomis raidėmis)
function normalizeSearchStr(str) {
  return String(str || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase();
}

function matchesSearchQuery(gameObj, query) {
  const q = normalizeSearchStr(query).trim();
  if (!q) return true;
  return normalizeSearchStr(gameObj.title).includes(q);
}

function getFilteredCatalogLists() {
  const q = state.searchQuery;
  return {
    my: state.myGames.filter(g => matchesSearchQuery(g, q)),
    fav: state.favGames.filter(g => matchesSearchQuery(g, q)),
    pub: PUBLIC_GAMES.filter(g => matchesSearchQuery(g, q)),
    recent: state.recentGames.filter(g => matchesSearchQuery(g, q))
  };
}

function onSearchInput(val) {
  state.searchQuery = val;
  updateCatalogDynamicUI();
}

function clearCatalogSearch() {
  Haptics.tap();
  state.searchQuery = '';
  const input = document.getElementById('catalog-search-input');
  if (input) {
    input.value = '';
    input.focus();
  }
  updateCatalogDynamicUI();
}

function selectCatalogTab(tabKey) {
  Haptics.tap();
  state.catalogTab = tabKey;
  if (state.screen === 'HOME') {
    updateCatalogDynamicUI();
  } else {
    render();
  }
}

function goToHome() {
  HoldEngine.reset();
  stopPhaseTimer();
  SoundEngine.stopSiren();
  SoundEngine.stopKeepAlive();
  state.alarmActive = false;
  state.screen = 'HOME';
  clearAppEffects();
  setAccent('blue');
  render();
}

async function openGameSession(gameObj, options = {}) {
  BASE_GAME = normalizeGameObject(gameObj);
  state.currentGameIsPublic = (typeof options.isPublic === 'boolean')
    ? options.isPublic
    : isPublicCatalogGame(BASE_GAME.hash);

  await recordRecentGame(BASE_GAME);

  const restored = SessionStore.loadForGame(BASE_GAME);
  state.customCounts = restored.customCounts;
  state.randomDrawX = restored.randomDrawX;

  goToPregame();
}

// 1. Išsaugoto žaidimo trynimas kataloge (raudonas kortelės blyksnis + fade-in)
function startDeleteHold(hash, e) {
  if (state.screen !== 'HOME') return;
  HoldEngine.start(`del:${hash}`, {
    isDanger: true,
    onUpdate(p) {
      const card = document.getElementById(`my-card-${hash}`);
      const btn = document.getElementById(`del-btn-${hash}`);
      if (!card) return;
      const pct = Math.round(p * 100);
      card.style.borderColor = `rgba(239, 68, 68, ${(0.35 + 0.65 * p).toFixed(2)})`;
      card.style.borderLeftColor = 'var(--c-red)';
      card.style.boxShadow = `inset 0 0 ${Math.round(55 * p)}px rgba(239, 68, 68, ${(0.65 * p).toFixed(2)}), 0 0 ${Math.round(20 * p)}px rgba(239, 68, 68, ${(0.4 * p).toFixed(2)})`;
      card.style.background = `linear-gradient(90deg, rgba(239, 68, 68, ${(0.48 * p).toFixed(2)}) ${pct}%, rgba(239, 68, 68, ${(0.16 * p).toFixed(2)}) ${pct}%), var(--surface-2)`;
      if (btn) {
        btn.style.borderColor = 'var(--c-red)';
        btn.style.color = p > 0.45 ? '#fff' : 'var(--c-red)';
        btn.style.background = `rgba(239, 68, 68, ${(0.9 * p).toFixed(2)})`;
      }
    },
    onCleanup() {
      const card = document.getElementById(`my-card-${hash}`);
      const btn = document.getElementById(`del-btn-${hash}`);
      if (card) {
        card.style.borderColor = '';
        card.style.borderLeftColor = '';
        card.style.boxShadow = '';
        card.style.background = '';
      }
      if (btn) {
        btn.style.borderColor = '';
        btn.style.color = '';
        btn.style.background = '';
      }
    },
    async onComplete() {
      const card = document.getElementById(`my-card-${hash}`);
      if (card) card.classList.add('deleting-card');
      await CacheStore.remove(CacheStore.MY_CACHE, CacheStore.memMy, hash);
      // Jei žaidimas nėra viešajame kataloge, išmetame jį ir iš Favorites bei Recent sąrašų ir Cache
      await purgeNonPublicGameFromOtherCaches(hash);
      await refreshCatalogState();
      setTimeout(() => {
        if (state.screen === 'HOME') updateCatalogDynamicUI();
      }, 220);
    }
  }, e);
}

// 2. Kortelių dalinimo arba žaidimo/fazių nutraukimas (X mygtukas -> X fade-in -> goToPregame)
function startCancelHold(e) {
  if (e) {
    e.stopPropagation();

}

// ============================================================================
// KATALOGO VEIKSMAI (FAVORITE, SAVE, SHARE SU PATVIRTINIMU IR IŠKARPINE)
// ============================================================================
function findGameAnySourceByHash(hash) {
  return state.myGames.find(g => g.hash === hash) ||
         state.favGames.find(g => g.hash === hash) ||
         state.recentGames.find(g => g.hash === hash) ||
         PUBLIC_GAMES.find(g => g.hash === hash) ||
         null;
}

function isFavorited(hash) {
  return state.favGames.some(g => g.hash === hash);
}

function isInMyGames(hash) {
  return state.myGames.some(g => g.hash === hash);
}

async function toggleFavoriteGame(hash, e) {
  if (e) e.stopPropagation();
  Haptics.tap();
  const exists = isFavorited(hash);
  if (exists) {
    await CacheStore.remove(CacheStore.FAV_CACHE, CacheStore.memFav, hash);
  } else {

      await CacheStore.put(CacheStore.FAV_CACHE, CacheStore.memFav, game);
    }
  }
  await refreshCatalogState();
  if (state.screen === 'HOME') {
    updateCatalogDynamicUI();
  } else {
    render();
  }
}

function getBaseShareUrl() {
  return window.location.href.split('#')[0];
}

async function copyTextToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (_) {}
  }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (_) {
    return false;
  }
}

function triggerShareConfirmation(hash) {
  Haptics.tap();
  state.copiedShareHash = hash;
  if (state.copiedShareTimer) clearTimeout(state.copiedShareTimer);
  if (state.screen === 'HOME') {
    updateCatalogDynamicUI();
  } else {
    render();
  }
  state.copiedShareTimer = setTimeout(() => {
    state.copiedShareHash = null;
    if (state.screen === 'HOME') updateCatalogDynamicUI();
  }, 1300);
}

async function shareGameByHash(hash, e) {
  if (e) e.stopPropagation();
  const game = findGameAnySourceByHash(hash);
  if (!game) return;
  const deflated = await encodeGameToDeflateParam(game);
  const url = `${getBaseShareUrl()}#/${deflated}`;

  const isWebProtocol = window.location.protocol === 'http:' || window.location.protocol === 'https:';
  const canUseNativeShare = typeof navigator.share === 'function';

  if (canUseNativeShare) {
    try {
      const shareData = isWebProtocol ? { url } : { text: url };
      if (!navigator.canShare || navigator.canShare(shareData)) {
        await navigator.share(shareData);
        triggerShareConfirmation(hash);
        return;
      }
    } catch (err) {
      if (err && err.name === 'AbortError') return;
    }
  }

  await copyTextToClipboard(url);
  triggerShareConfirmation(hash);
}

function getBaseDeckSize() {
  return (BASE_GAME.cards || []).reduce((sum, c) => sum + (Number(c.count) || 0), 0);
}

function getCustomDeckSize() {
  return (BASE_GAME.cards || []).reduce((sum, c) => sum + (state.customCounts[c.id] ?? c.count), 0);

function setAccent(colorKey) {
  const c = (!colorKey || colorKey === 'none') ? PALETTE.none : (PALETTE[colorKey] || PALETTE.blue);
  document.documentElement.style.setProperty('--accent', c);
}

function triggerBarrier() {
  state.locked = true;
  const app = document.getElementById('app');
  const bar = document.getElementById('lock-bar');
  app.classList.add('locked');
  bar.classList.remove('active');
  void bar.offsetWidth;
  bar.classList.add('active');

  setTimeout(() => {
    state.locked = false;
    app.classList.remove('locked');

}

async function requestWakeLock() {
  if ('wakeLock' in navigator && !state.wakeLock) {
    try {
      state.wakeLock = await navigator.wakeLock.request('screen');
      state.wakeLock.addEventListener('release', () => { state.wakeLock = null; });
    } catch (_) {}
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (isPlayAudioAllowed()) SoundEngine.ensureContext();
    if (!['HOME', 'PREGAME', 'EDITOR'].includes(state.screen)) {
      requestWakeLock();
    }
  }
});

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============================================================================
// 3.B KORTŲ DALIJIMO PROCESAS
// ============================================================================
function buildSessionDeck() {
  let raw = [];
  const mode = BASE_GAME.dealMode;

  (BASE_GAME.cards || []).forEach(c => {
    const qty = (mode === 1) ? (state.customCounts[c.id] ?? c.count) : c.count;
    for (let i = 0; i < qty; i++) {
      raw.push({ ...c });
    }
  });

  if (mode === 1) return shuffleArray(raw);
  if (mode === 2) return BASE_GAME.shuffle ? shuffleArray(raw) : raw;
  if (mode === 3) return shuffleArray(raw).slice(0, state.randomDrawX);
  if (mode === 4) return shuffleArray(raw);
  return raw;
}

function startDealing() {
  HoldEngine.reset();
  Haptics.tap();
  state.screen = 'DEAL';
  SoundEngine.unlock();
  SoundEngine.startKeepAlive();
  requestWakeLock();
  clearAppEffects();
  setAccent(BASE_GAME.color);

  SessionStore.saveForGame(BASE_GAME.hash, state.customCounts, state.randomDrawX);

  state.deck = buildSessionDeck();
  state.dealIndex = 0;
  state.drawCounter = 1;
  state.cardFaceUp = false;
  state.currentCard = null;

  if (state.deck.length === 0) state.screen = 'DEAL_DONE';
  render();
}

function handleCardTap() {
  if (state.locked) return;

  if (!state.cardFaceUp) {
    state.cardFaceUp = true;
    state.currentCard = (BASE_GAME.dealMode === 4) ? state.deck[0] : state.deck[state.dealIndex];
    const resolvedColor = resolveCardColorKey(BASE_GAME, state.currentCard);
    setAccent(resolvedColor);
    Haptics.cardFlip();
    SoundEngine.playCardFlip(true);
    render();
  } else {
    Haptics.cardFlip();
    SoundEngine.playCardFlip(false);
    if (BASE_GAME.dealMode === 4) {
      const drawn = state.deck.shift();
      if (BASE_GAME.returnCondition === 'auto') {
        returnCardToDeck(drawn);
      }
      state.drawCounter++;
      state.cardFaceUp = false;
      state.currentCard = null;
      setAccent(BASE_GAME.color);

      if (state.deck.length === 0) state.screen = 'DEAL_DONE';
      render();
      triggerBarrier();
    } else {
      state.dealIndex++;
      state.cardFaceUp = false;
      state.currentCard = null;
      setAccent(BASE_GAME.color);

      if (state.dealIndex >= state.deck.length) state.screen = 'DEAL_DONE';
      render();
      triggerBarrier();
    }
  }
}

function handleDynamicReturn(e) {
  e.stopPropagation();
  if (state.locked || !state.cardFaceUp) return;

  Haptics.cardFlip();
  SoundEngine.playCardFlip(false);
  const drawn = state.deck.shift();
  returnCardToDeck(drawn);
  state.drawCounter++;
  state.cardFaceUp = false;
  state.currentCard = null;
  setAccent(BASE_GAME.color);
  render();
  triggerBarrier();
}

function returnCardToDeck(card) {
  const method = BASE_GAME.returnMethod;
  if (method === 'bottom') {
    state.deck.push(card);
  } else if (method === 'shuffle') {
    state.deck.push(card);
    state.deck = shuffleArray(state.deck);
  } else if (method === 'middle') {
    const halfStart = Math.floor(state.deck.length / 2);
    const randPos = halfStart + Math.floor(Math.random() * (state.deck.length - halfStart + 1));
    state.deck.splice(randPos, 0, card);
  }
}

// ============================================================================
// 3.C FAZIŲ VALDYMAS IR TIKSLUS LAIKMATIS BE VĖLAVIMO (DRIFT-FREE TIMER)
// ============================================================================
function startPhases() {
  HoldEngine.reset();
  state.screen = 'PHASE';
  SoundEngine.unlock();
  SoundEngine.startKeepAlive();
  requestWakeLock();

  SessionStore.saveForGame(BASE_GAME.hash, state.customCounts, state.randomDrawX);

  state.phaseIndex = 0;
  state.firstLap = true;
  state.alarmActive = false;
  loadCurrentPhase();
}

function triggerPhaseStartEffect() {
  const app = document.getElementById('app');
  if (state.fxStartTimer) {
    clearTimeout(state.fxStartTimer);
    state.fxStartTimer = null;
  }
  app.classList.remove('fx-start');
  void app.offsetWidth;
  app.classList.add('fx-start');
  state.fxStartTimer = setTimeout(() => {
    app.classList.remove('fx-start');
    state.fxStartTimer = null;
  }, 920);
}

function loadCurrentPhase() {
  HoldEngine.reset();
  stopPhaseTimer();
  SoundEngine.stopSiren();
  SoundEngine.startKeepAlive();
  clearAppEffects();
  state.alarmActive = false;

  const hasPhases = BASE_GAME.phases && BASE_GAME.phases.length > 0;
  if (!hasPhases) {
    setAccent(BASE_GAME.color);
    state.timeLeft = 0;
    state.timerAccumulatedMs = 0;
    state.timerLastResumeTs = performance.now();
    state.phaseEndTriggered = false;
    state.timerRunning = true;
    startPhaseTimer(0);
    render();
    return;
  }

  const phase = BASE_GAME.phases[state.phaseIndex];
  setAccent(phase.color);

  triggerPhaseStartEffect();
  Haptics.phaseStart();
  SoundEngine.playPhaseStart();

  const durationSec = (phase.duration && phase.duration > 0) ? Number(phase.duration) : 0;
  state.timeLeft = durationSec;
  state.timerAccumulatedMs = 0;
  state.timerLastResumeTs = performance.now();
  state.phaseEndTriggered = false;
  state.timerRunning = true;
  startPhaseTimer(durationSec);
  render();
}

function startPhaseTimer(durationSec) {
  stopPhaseTimer();
  const isCountdown = durationSec > 0;

  state.timerInterval = setInterval(() => {
    if (!state.timerRunning) return;

    const now = performance.now();
    const totalElapsedMs = state.timerAccumulatedMs + Math.max(0, now - state.timerLastResumeTs);
    const elapsedSec = Math.floor(totalElapsedMs / 1000);

    if (isCountdown) {
      const nextLeft = Math.max(0, durationSec - elapsedSec);
      if (nextLeft !== state.timeLeft) {
        state.timeLeft = nextLeft;
        if (state.timeLeft > 0 && state.timeLeft <= 5) {
          Haptics.tick();
          SoundEngine.playTick();
        }
        if (state.timeLeft === 0 && !state.phaseEndTriggered) {
          state.phaseEndTriggered = true;
          document.getElementById('app').classList.add('fx-end');
          Haptics.phaseEnd();
          SoundEngine.playPhaseEnd();
        }
        renderTimerOnly();
      }
    } else {
      if (elapsedSec !== state.timeLeft) {
        state.timeLeft = elapsedSec;
        renderTimerOnly();
      }
    }
  }, 200);
}

function stopPhaseTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

function togglePausePhase() {
  Haptics.tap();
  SoundEngine.ensureContext();
  if (state.timerRunning) {
    state.timerAccumulatedMs += Math.max(0, performance.now() - state.timerLastResumeTs);
    state.timerRunning = false;
  } else {
    state.timerLastResumeTs = performance.now();
    state.timerRunning = true;
  }
  render();
}

function triggerAlarm() {
  SoundEngine.unlock();
  state.alarmActive = !state.alarmActive;
  const app = document.getElementById('app');
  app.classList.toggle('fx-alarm', state.alarmActive);
  if (state.alarmActive) {
    Haptics.alarm();
    SoundEngine.startSiren();
  } else {
    Haptics.tap();
    SoundEngine.stopSiren();
  }
  render();
}

function getNextPhaseIndex() {
  const phases = BASE_GAME.phases || [];
  if (phases.length === 0) return -1;

  if (state.firstLap) {
    if (state.phaseIndex + 1 < phases.length) return state.phaseIndex + 1;
    return phases.findIndex(p => p.loop);
  } else {
    for (let i = state.phaseIndex + 1; i < phases.length; i++) {
      if (phases[i].loop) return i;
    }
    for (let i = 0; i <= state.phaseIndex; i++) {
      if (phases[i].loop) return i;
    }
    return -1;
  }
}

function nextPhase() {
  SoundEngine.unlock();
  const phases = BASE_GAME.phases || [];
  if (state.firstLap && state.phaseIndex + 1 >= phases.length) {
    state.firstLap = false;
  }
  const nextIdx = getNextPhaseIndex();
  if (nextIdx !== -1) {
    state.phaseIndex = nextIdx;
    loadCurrentPhase();
  }
}

function closeFinalCard() {
  if (state.locked) return;
  Haptics.tap();
  SoundEngine.playCardFlip(false);
  goToPregame();
}

function clearAppEffects() {
  if (state.fxStartTimer) {
    clearTimeout(state.fxStartTimer);
    state.fxStartTimer = null;
  }
  const app = document.getElementById('app');
  app.classList.remove('fx-start', 'fx-end', 'fx-alarm', 'fx-final');
}

function formatTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${m}:${s}`;
}

function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderTimerOnly() {
  const el = document.getElementById('timer-val');
  const nextBtn = document.getElementById('next-phase-btn');

  const phase = (BASE_GAME.phases || [])[state.phaseIndex];

  el.textContent = formatTime(state.timeLeft);
  el.classList.toggle('timer-blink', Boolean(isZero));

    nextBtn.classList.toggle('pulse-btn', Boolean(isZero));

            </button>
            <button class="xs ${isCopied ? 'copied-check' : ''}" onclick="shareGameByHash('${g.hash}', event)">
              <i class="fa-solid ${isCopied ? 'fa-check' : 'fa-share-nodes'}"></i>
            </button>
          </div>
        </div>
      `;
    }).join('');
  }
  if (tab === 'fav') {
    return filtered.fav.map(g => renderCatalogRowFavAndShare(g, true)).join('');
  }
  if (tab === 'pub') {
    return filtered.pub.map(g => renderCatalogRowFavAndShare(g, false, '{ isPublic: true }')).join('');
  }
  if (tab === 'recent') {
    return filtered.recent.map(g => renderCatalogRowFavAndShare(g, false)).join('');
  }
  return '';
}

// Dinamiškai atnaujina katalogo sąrašą ir tab'ų skaitiklius neprarandant paieškos laukelio fokuso
function updateCatalogDynamicUI() {
  if (state.screen !== 'HOME') return;
  const tab = state.catalogTab || 'my';
  const filtered = getFilteredCatalogLists();

  const listEl = document.getElementById('catalog-list');
  if (listEl) {
    listEl.innerHTML = buildCatalogListHtml(tab, filtered);
  }

  const clearBtn = document.getElementById('catalog-search-clear');
  if (clearBtn) {
    clearBtn.classList.toggle('visible', Boolean(state.searchQuery && state.searchQuery.length > 0));
  }

  const tabIds = ['my', 'fav', 'pub', 'recent'];
  tabIds.forEach(k => {
    const btn = document.getElementById(`catalog-tab-${k}`);
    if (btn) btn.classList.toggle('active', tab === k);
    const cnt = document.getElementById(`tab-count-${k}`);
    if (cnt) cnt.textContent = filtered[k].length;
  });
}

function render() {
  const app = document.getElementById('app');
  const mode = BASE_GAME.dealMode;
  const hasCards = BASE_GAME.cards && BASE_GAME.cards.length > 0;
  const hasPhasesOrFinals = (BASE_GAME.phases && BASE_GAME.phases.length > 0) ||
                            (BASE_GAME.finals && BASE_GAME.finals.length > 0);

  // --------------------------------------------------------------------------
  // 0. HOME KATALOGAS: LOGO -> ADD GAME (+) -> SEARCH BAR -> TAB'AI -> SĄRAŠAS
  // --------------------------------------------------------------------------
  if (state.screen === 'HOME') {
    const tab = state.catalogTab || 'my';
    const filtered = getFilteredCatalogLists();

    app.innerHTML = `
      <div class="top-bar catalog-brand-bar">

            <span id="tab-count-fav" class="catalog-tab-count">${filtered.fav.length}</span>
          </button>
          <button id="catalog-tab-pub" class="catalog-tab ${tab === 'pub' ? 'active' : ''}" onclick="selectCatalogTab('pub')">

  }

  // --------------------------------------------------------------------------
  // 1. PRIEŠŽAIDIMINIS LANGAS (3.A)
  // --------------------------------------------------------------------------
  if (state.screen === 'PREGAME') {
    let deckCount = 0;
    let modeControlsHtml = '';
    const isSavedInMyGames = isInMyGames(BASE_GAME.hash);
    const showEditButton = isSavedInMyGames || state.currentGameIsPublic;

    if (hasCards) {
      if (mode === 1) {
        deckCount = getCustomDeckSize();
        const rows = BASE_GAME.cards.map(c => {
          const resolvedColor = resolveCardColorKey(BASE_GAME, c);
          const grp = getGroupById(BASE_GAME, c.groupId);
          return `
            <div class="card-row" style="--row-color: ${getColorCss(resolvedColor, 'var(--border)')}">
              <div class="card-row-info">
                <span class="card-row-title">${escapeHtml(c.title)}</span>
                ${grp ? `<span class="card-row-group">${escapeHtml(grp.title)}</span>` : ''}

                <button class="sm" onclick="adjustCustomCount('${c.id}', 1)"><i class="fa-solid fa-plus"></i></button>

            </div>

        }).join('');
        modeControlsHtml = `
          <div class="counter-pill"><i class="fa-solid fa-users"></i> ${deckCount}</div>
          <div class="card-list">${rows}</div>
        `;
      } else if (mode === 2) {
        deckCount = getBaseDeckSize();
        modeControlsHtml = `
          <div class="counter-pill">
            <i class="fa-solid fa-users"></i> ${deckCount}
            ${BASE_GAME.shuffle ? '<i class="fa-solid fa-shuffle"></i>' : '<i class="fa-solid fa-arrow-down-1-9"></i>'}
          </div>
        `;
      } else if (mode === 3) {
        deckCount = Math.min(state.randomDrawX, getBaseDeckSize());

          <div class="counter-pill">
            <button class="sm" onclick="adjustRandomDrawX(-1)"><i class="fa-solid fa-minus"></i></button>
            <span><i class="fa-solid fa-users"></i> ${deckCount} / ${getBaseDeckSize()}</span>
            <button class="sm" onclick="adjustRandomDrawX(1)"><i class="fa-solid fa-plus"></i></button>

            <i class="fa-solid fa-users"></i> ${deckCount}

    app.innerHTML = `
      <div class="top-bar">
        <button class="sm" onclick="Haptics.tap(); goToHome()">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div class="top-actions">
          ${showEditButton ? `
            <button class="sm" onclick="openEditorFromPregame()">
              <i class="fa-solid fa-pen-to-square"></i>

            <button class="sm" onclick="saveCurrentGameInPregame()">

    return;
  }

  // --------------------------------------------------------------------------
  // 2. REDAKTORIAUS FORMA (EDITOR BE SUSKLEIDIMO, DALINIMO REŽIMAS ATSKIRAME BLOKELYJE)
  // --------------------------------------------------------------------------
  if (state.screen === 'EDITOR' && state.editorDraft) {
    const d = state.editorDraft;

    const paletteHtml = COLOR_KEYS.map(ck => `
      <div class="color-swatch ${d.color === ck ? 'selected' : ''}"
           style="background: ${PALETTE[ck]}; color: ${PALETTE[ck]}"
           onclick="Haptics.tap(); state.editorDraft.color='${ck}'; setAccent('${ck}'); updateDraftHashBadge(); render();"></div>
    `).join('');

    const groupsHtml = d.groups.map((grp, i) => {
      const isNone = !grp.color || grp.color === 'none';
      const itemColorCss = getColorCss(grp.color, 'var(--border)');
      return `
        <div class="editor-item" style="--item-color: ${itemColorCss}">
          <div class="editor-item-main">
            <div class="color-cycle-btn ${isNone ? 'is-none' : ''}"
                 style="background: ${isNone ? 'transparent' : PALETTE[grp.color]}"
                 onclick="Haptics.tap(); state.editorDraft.groups[${i}].color = cycleItemColor('${grp.color}'); updateDraftHashBadge(); render();">
              ${isNone ? '<i class="fa-solid fa-ban"></i>' : ''}
            </div>
            <input class="text-input"
                   value="${escapeHtml(grp.title)}"
                   placeholder="Grupės pavadinimas"

            <button class="icon-btn del" onclick="deleteGroupInEditor(${i})"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      `;
    }).join('');

    const cardsHtml = d.cards.map((c, i) => {
      const resolvedColorKey = resolveCardColorKey(d, c);
      const isNoneResolved = resolvedColorKey === 'none';
      const itemColorCss = getColorCss(resolvedColorKey, 'var(--border)');

      const groupOptions = [
        `<option value="" ${!c.groupId ? 'selected' : ''}>Be grupės</option>`,
        ...d.groups.map(grp => `<option value="${grp.id}" ${c.groupId === grp.id ? 'selected' : ''}>${escapeHtml(grp.title)}</option>`)
      ].join('');

      return `
        <div class="editor-item" style="--item-color: ${itemColorCss}">
          <div class="editor-item-main">
            <div class="color-cycle-btn ${isNoneResolved ? 'is-none' : ''}"
                 style="background: ${isNoneResolved ? 'transparent' : PALETTE[resolvedColorKey]}"
                 onclick="cycleCardColorInEditor(${i})">
              ${isNoneResolved ? '<i class="fa-solid fa-ban"></i>' : ''}
            </div>
            <input class="text-input"
                   value="${escapeHtml(c.title)}"
                   placeholder="Kortos pavadinimas"
                   oninput="state.editorDraft.cards[${i}].title = this.value; updateDraftHashBadge();" />
          </div>
          <div class="editor-item-subrow">
            <select class="group-select"
                    onchange="Haptics.tap(); state.editorDraft.cards[${i}].groupId = this.value; state.editorDraft.cards[${i}].color = 'none'; updateDraftHashBadge(); render();">
              ${groupOptions}
            </select>
            <input type="number" min="0" class="num-input"
                   value="${c.count}"
                   oninput="state.editorDraft.cards[${i}].count = Math.max(0, parseInt(this.value)||0); updateDraftHashBadge();" />
            <div class="toggle-group">

              <button class="icon-btn" onclick="moveItem(state.editorDraft.cards, ${i}, 1)"><i class="fa-solid fa-chevron-down"></i></button>

    const phasesHtml = d.phases.map((p, i) => {
      const isNone = !p.color || p.color === 'none';
      const itemColorCss = getColorCss(p.color, 'var(--border)');
      return `
        <div class="editor-item" style="--item-color: ${itemColorCss}">
          <div class="editor-item-main">
            <div class="color-cycle-btn ${isNone ? 'is-none' : ''}"
                 style="background: ${isNone ? 'transparent' : PALETTE[p.color]}"
                 onclick="Haptics.tap(); state.editorDraft.phases[${i}].color = cycleItemColor('${p.color}'); updateDraftHashBadge(); render();">
              ${isNone ? '<i class="fa-solid fa-ban"></i>' : ''}
            </div>
            <input class="text-input"
                   value="${escapeHtml(p.title)}"
                   placeholder="Fazės pavadinimas"
                   oninput="state.editorDraft.phases[${i}].title = this.value; updateDraftHashBadge();" />
          </div>
          <div class="editor-item-subrow">
            <div class="toggle-group">
              <i class="fa-solid fa-stopwatch field-icon"></i>

                     oninput="state.editorDraft.phases[${i}].duration = Math.max(0, parseInt(this.value)||0); updateDraftHashBadge();" />
