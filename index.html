<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolės generatorius 🎭</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 10px;
            color: #e0e0e0;
        }

        .counter {
            font-size: 0.95rem;
            color: #aaa;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .setup-screen, .game-screen {
            display: none;
        }

        .setup-screen.active, .game-screen.active {
            display: block;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 1rem;
            color: #ccc;
            margin-bottom: 10px;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 1.2rem;
            text-align: center;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #4cd137;
        }

        .card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .card img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
        }

        .role-title {
            font-size: 2rem;
            font-weight: bold;
            color: #4cd137;
            text-transform: capitalize;
            letter-spacing: 1px;
            display: none;
        }

        .placeholder-text {
            color: #aaa;
            font-size: 1.1rem;
        }

        button {
            background: #4cd137;
            color: #1e1e2f;
            border: none;
            border-radius: 12px;
            padding: 16px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s ease, background 0.2s ease;
            box-shadow: 0 5px 15px rgba(76, 209, 55, 0.4);
            margin-bottom: 15px;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            background: #44bd32;
        }

        button.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            box-shadow: none;
        }

        button.secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Slapta Rolė</h1>

        <!-- Nustatymų ekranas -->
        <div id="setupScreen" class="setup-screen active">
            <div class="input-group">
                <label for="playerCount">Žaidėjų skaičius:</label>
                <input type="number" id="playerCount" min="1" max="20" value="5">
            </div>
            <button onclick="startGame()">Pradėti žaidimą</button>
        </div>

        <!-- Žaidimo ekranas -->
        <div id="gameScreen" class="game-screen">
            <div class="counter" id="counterText">Liko neatverstų rolių: 0</div>
            
            <div class="card" id="roleCard">
                <span class="placeholder-text" id="initialText">Duokite telefoną kitam žaidėjui ir paspauskite mygtuką</span>
                <img id="roleImage" src="" alt="Rolės vaizdas">
                <div class="role-title" id="roleText"></div>
            </div>

            <button id="actionBtn" onclick="handleAction()">Gauti rolę</button>
            <button class="secondary" onclick="resetGame()">Naujas žaidimas</button>
        </div>
    </div>

    <script>
        const mandatoryGroup = ["imposteris", "trintukas", "ligonis"];
        const regularRoles = ["žmogus", "gydytojas", "teisėjas", "policininkas", "džakalas"];
        
        const roleImages = {
            "imposteris": "role_imposteris.png",
            "žmogus": "role_zmogus.png",
            "gydytojas": "role_gydytojas.png",
            "teisėjas": "role_teisejas.png",
            "policininkas": "role_policininkas.png",
            "džakalas": "role_dzakalas.png",
            "trintukas": "role_trintukas.png",
            "ligonis": "role_ligonis.png"
        };

        let availableRoles = [];
        let currentState = "READY_TO_GET"; // Bsenos: "READY_TO_GET" arba "ROLE_SHOWN"

        function startGame() {
            const countInput = document.getElementById("playerCount");
            let playerCount = parseInt(countInput.value);

            if (isNaN(playerCount) || playerCount < 1) {
                alert("Įveskite teisingą žaidėjų skaičių!");
                return;
            }

            const randomIndex = Math.floor(Math.random() * mandatoryGroup.length);
            const chosenMandatory = mandatoryGroup[randomIndex];

            let gameRoles = [chosenMandatory, ...regularRoles];

            while (gameRoles.length < playerCount) {
                gameRoles.push("žmogus");
            }

            if (gameRoles.length > playerCount) {
                let others = gameRoles.filter(r => r !== chosenMandatory);
                others.sort(() => Math.random() - 0.5);
                gameRoles = [chosenMandatory, ...others.slice(0, playerCount - 1)];
            }

            availableRoles = gameRoles.sort(() => Math.random() - 0.5);

            document.getElementById("setupScreen").classList.remove("active");
            document.getElementById("gameScreen").classList.add("active");
            
            resetToHiddenState();
            updateCounter();
        }

        function updateCounter() {
            const counterText = document.getElementById("counterText");
            counterText.textContent = `Liko neatverstų rolių: ${availableRoles.length}`;
        }

        function resetToHiddenState() {
            currentState = "READY_TO_GET";
            
            document.getElementById("initialText").style.display = "block";
            document.getElementById("initialText").textContent = "Duokite telefoną žaidėjui irspauskite mygtuką";
            document.getElementById("roleImage").style.display = "none";
            document.getElementById("roleText").style.display = "none";
            document.getElementById("roleImage").src = "";
            document.getElementById("roleText").textContent = "";
            
            const actionBtn = document.getElementById("actionBtn");
            actionBtn.disabled = false;
            actionBtn.style.opacity = "1";
            actionBtn.textContent = "Gauti rolę";
        }

        function handleAction() {
            const roleImage = document.getElementById("roleImage");
            const roleText = document.getElementById("roleText");
            const initialText = document.getElementById("initialText");
            const actionBtn = document.getElementById("actionBtn");

            if (availableRoles.length === 0) {
                initialText.style.display = "block";
                initialText.textContent = "Visos rolės išdalintos!";
                roleImage.style.display = "none";
                roleText.style.display = "none";
                actionBtn.disabled = true;
                actionBtn.style.opacity = "0.5";
                return;
            }

            if (currentState === "READY_TO_GET") {
                // Parodome rolę
                const selectedRole = availableRoles.shift(); // Paimam ir pašalinam iš sąrašo

                initialText.style.display = "none";

                roleImage.src = roleImages[selectedRole];
                roleImage.alt = selectedRole;
                roleImage.style.display = "block";

                roleText.textContent = selectedRole;
                roleText.style.display = "block";

                updateCounter();

                currentState = "ROLE_SHOWN";
                
                if (availableRoles.length === 0) {
                    actionBtn.textContent = "Baigti žaidimą";
                } else {
                    actionBtn.textContent = "Rolę gavau (Perduoti kitam)";
                }
            } else {
                // Užmaskuojam atgal ir paruošiam kitam žaidėjui
                if (availableRoles.length === 0) {
                    initialText.style.display = "block";
                    initialText.textContent = "Žaidimas baigtas! Visos rolės išdalintos.";
                    roleImage.style.display = "none";
                    roleText.style.display = "none";
                    actionBtn.disabled = true;
                    actionBtn.style.opacity = "0.5";
                    return;
                }
                resetToHiddenState();
            }
        }

        function resetGame() {
            document.getElementById("gameScreen").classList.remove("active");
            document.getElementById("setupScreen").classList.add("active");
        }
    </script>

</body>
</html>
