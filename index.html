<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neišsiduok, kas tu 🎭</title>
    <!-- Font Awesome 6 ikonos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Pridėtas .help-screen */
        .setup-screen, .game-screen, .settings-screen, .help-screen {
            display: none;
            width: 100%;
        }

        .active {
            display: block;
        }

        .hidden {
            display: none !important;
        }

        /* Viršutinė juosta (tik centruota ikona) */
        .game-header-bar {
            margin-bottom: 22px;
            text-align: center;
        }

        .game-header-bar .hero-icon {
            font-size: 3.2rem;
            color: #e0e0e0;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
            display: inline-block;
        }

        /* Apatinės funkcinės ikonos (be fono, minimalistinės) */
        .footer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            padding: 0 8px;
        }

        .subtle-icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            padding: 6px;
            transition: transform 0.15s ease, opacity 0.2s ease;
            box-shadow: none;
            width: auto;
            margin: 0;
        }

        .subtle-icon-btn:hover {
            opacity: 0.8;
            transform: scale(1.1);
        }

        .subtle-icon-btn:active {
            transform: scale(0.95);
        }

        /* Atskiros ikonų spalvos */
        .help-icon-btn {
            color: #888899; 
        }

        .settings-icon-btn {
            color: #888899;
        }

        /* Langų antraštės */
        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .settings-header h2 {
            font-size: 1.5rem;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .settings-header h2 i {
            color: #aaa;
            font-size: 1.3rem;
        }

        /* Baziniai mygtukai */
        button {
            background: #4cd137;
            color: #1e1e2f;
            border: none;
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s ease, background 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 5px 15px rgba(76, 209, 55, 0.4);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:active:not(:disabled):not(.disabled-look) {
            transform: scale(0.98);
        }

        button:hover:not(:disabled):not(.disabled-look) {
            background: #44bd32;
        }

        button:disabled, button.disabled-look {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        button.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            box-shadow: none;
            margin-bottom: 0;
        }

        button.secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Pradinio ekrano PLAY mygtukas */
        .play-btn {
            font-size: 1.4rem;
            padding: 16px;
            margin-bottom: 0;
        }

        .close-icon-btn {
            background: transparent;
            color: #aaa;
            font-size: 1.5rem;
            width: auto;
            padding: 5px;
            margin: 0;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }

        .close-icon-btn:hover {
            background: transparent;
            color: #ff4757;
        }

        /* Statistikos / indikatorių juosta */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 18px;
        }

        .stat-pill {
            flex: 1;
            background: rgba(0, 0, 0, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 6px;
            font-size: 1.1rem;
            color: #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
        }

        .stat-pill:active {
            transform: scale(0.96);
        }

        .stat-pill i {
            font-size: 1.15rem;
            color: #fff;
            opacity: 0.95;
        }

        .stat-pill span {
            color: #fff;
            font-weight: bold;
        }

        /* Žaidėjų indikatorius */
        .stat-pill.players {
            border-color: rgba(76, 209, 55, 0.25);
            background: rgba(76, 209, 55, 0.05);
        }
        .stat-pill.players i, .stat-pill.players span {
            color: #4cd137;
        }

        /* Signalizuojantis sumirksėjimas žaidėjų indikatoriui */
        @keyframes blinkSignal {
            0%, 100% {
                transform: scale(1);
                border-color: rgba(76, 209, 55, 0.25);
                background: rgba(76, 209, 55, 0.05);
                box-shadow: none;
            }
            25%, 75% {
                transform: scale(1.06);
                border-color: #4cd137;
                background: rgba(76, 209, 55, 0.35);
                box-shadow: 0 0 18px rgba(76, 209, 55, 0.7);
            }
            50% {
                transform: scale(0.98);
                border-color: rgba(76, 209, 55, 0.4);
                background: rgba(76, 209, 55, 0.1);
                box-shadow: none;
            }
        }

        .stat-pill.players.blink-alert {
            animation: blinkSignal 0.6s ease-in-out;
        }

        /* Piktadarių indikatorius */
        .stat-pill.danger {
            border-color: rgba(255, 71, 87, 0.25);
            background: rgba(255, 71, 87, 0.05);
        }
        .stat-pill.danger i, .stat-pill.danger span {
            color: #ff4757;
            text-shadow: 0 0 8px rgba(255, 71, 87, 0.4);
        }

        /* Specialių rolių indikatorius */
        .stat-pill.neutral-stat {
            border-color: rgba(255, 165, 2, 0.25);
            background: rgba(255, 165, 2, 0.05);
        }
        .stat-pill.neutral-stat i, .stat-pill.neutral-stat span {
            color: #ffa502;
            text-shadow: 0 0 8px rgba(255, 165, 2, 0.4);
        }

        /* Kortelė */
        .card {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 18px;
            padding: 35px 20px;
            margin-bottom: 22px;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .card-back-icon {
            font-size: 4.5rem;
            color: rgba(255, 255, 255, 0.2);
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            animation: pulseQuestion 2.5s infinite ease-in-out;
        }

        @keyframes pulseQuestion {
            0%, 100% { transform: scale(1); opacity: 0.2; }
            50% { transform: scale(1.06); opacity: 0.35; }
        }

        .role-title {
            font-size: 2.1rem;
            font-weight: bold;
            text-transform: capitalize;
            letter-spacing: 1px;
            display: none;
        }

        .role-title.normal {
            color: #4cd137;
        }

        .role-title.neutral {
            color: #ffa502;
            text-shadow: 0 0 10px rgba(255, 165, 2, 0.4);
        }

        .role-title.alert {
            color: #ff4757;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.4);
        }

        .placeholder-text {
            color: #aaa;
            font-size: 1.15rem;
            line-height: 1.45;
            display: none;
        }

        /* Nustatymų / Pagalbos elementai */
        .input-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .input-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            color: #ccc;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-group label i {
            width: 20px;
            text-align: center;
        }

        .input-group label i.fa-users { color: #4cd137; }
        .input-group label i.fa-skull { color: #ff4757; }
        .input-group label i.fa-star { color: #ffa502; }
        .input-group label i.fa-user { color: #3498db; }
        .input-group label i.fa-gamepad { color: #a29bfe; }

        select, textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            padding: 10px 12px;
            font-size: 0.9rem;
            transition: border-color 0.2s ease;
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23aaaaaa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 36px;
        }

        select option {
            background: #2a2a40;
            color: #fff;
        }

        textarea {
            resize: none;
            height: 60px;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        select:focus, textarea:focus {
            outline: none;
            border-color: #4cd137;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        .btn-group button {
            flex: 1;
            margin-bottom: 0;
            padding: 14px 10px;
        }

        .help-footer-text {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            color: #aaa;
            line-height: 1.4;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 1. Nustatymų ekranas -->
        <div id="settingsScreen" class="settings-screen">
            <div class="settings-header">
                <h2><i class="fa-solid fa-gear" style="margin-left: 4px;"></i> Nustatymai</h2>
                <button type="button" class="close-icon-btn" onclick="closeSettings()" title="Uždaryti">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="input-group">
                <label for="setPreset"><i class="fa-solid fa-gamepad"></i> Žaidimo tipas</label>
                <select id="setPreset" onchange="handlePresetChange()">
                    <option value="among_us">Among Us</option>
                    <option value="mafia">Mafia</option>
                    <option value="custom">Pasirinktinis</option>
                </select>
            </div>
            
            <div class="input-group">
                <label for="setRegular"><i class="fa-solid fa-user"></i> Komanda</label>
                <textarea id="setRegular"></textarea>
            </div>

            <div class="input-group">
                <label for="setMandatory"><i class="fa-solid fa-skull"></i> Piktadariai</label>
                <textarea id="setMandatory"></textarea>
            </div>

            <div class="input-group">
                <label for="setNeutral"><i class="fa-solid fa-star"></i> Specialios rolės</label>
                <textarea id="setNeutral"></textarea>
            </div>

            <div class="btn-group">
                <button type="button" class="secondary" onclick="resetToFactoryDefaults()">Atstatyti</button>
                <button type="button" onclick="saveSettings()">Išsaugoti</button>
            </div>
        </div>

        <!-- 2. Pagalbos ekranas -->
        <div id="helpScreen" class="help-screen">
            <div class="settings-header">
                <h2><i class="fa-solid fa-circle-question" style="margin-left: 4px;"></i> Pagalba</h2>
                <button type="button" class="close-icon-btn" onclick="closeHelp()" title="Uždaryti">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="input-group" style="margin-bottom: 20px;">
                <label><i class="fa-solid fa-users"></i> Bendras žaidėjų skaičius</label>
            </div>
            <div class="input-group" style="margin-bottom: 20px;">
                <label><i class="fa-solid fa-skull"></i> Piktadarių kiekis</label>
            </div>
            <div class="input-group" style="margin-bottom: 10px;">
                <label><i class="fa-solid fa-star"></i> Specialių / neutralių žaidėjų skaičius</label>
            </div>

            <div class="help-footer-text">
                Spauskite vieną kartą ant indikatorių, kad padidintumėte skaičių vienetu. Bakstelėkite du kartus greitai, kad atitinkamą indikatorių apnulintumėte.
            </div>
        </div>

        <!-- 3. Pradinis pasiruošimo ekranas -->
        <div id="setupScreen" class="setup-screen active">
            <div class="game-header-bar">
                <i class="fa-solid fa-masks-theater hero-icon"></i>
            </div>

            <div class="stats-bar">
                <div class="stat-pill players" id="pillPlayers" title="Viengubas paspaudimas: +1 | Dvigubas: nulinti">
                    <i class="fa-solid fa-users"></i>
                    <span id="statPlayers">0</span>
                </div>
                <div class="stat-pill danger" id="pillBad" title="Viengubas paspaudimas: +1 | Dvigubas: nulinti">
                    <i class="fa-solid fa-skull"></i>
                    <span id="statBad">0</span>
                </div>
                <div class="stat-pill neutral-stat" id="pillNeutral" title="Viengubas paspaudimas: +1 | Dvigubas: nulinti">
                    <i class="fa-solid fa-star"></i>
                    <span id="statNeutral">0</span>
                </div>
            </div>

            <button type="button" id="playBtn" class="play-btn disabled-look" onclick="startGame()" title="Pradėti žaidimą">
                <i class="fa-solid fa-play"></i>
            </button>

            <!-- Apatinės minimalistinės ikonos -->
            <div class="footer-actions">
                <button type="button" class="subtle-icon-btn help-icon-btn" onclick="openHelp()" title="Pagalba">
                    <i class="fa-solid fa-circle-question"></i>
                </button>
                <button type="button" class="subtle-icon-btn settings-icon-btn" onclick="openSettings()" title="Nustatymai">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </div>

        <!-- 4. Žaidimo (rolių dalinimo) ekranas -->
        <div id="gameScreen" class="game-screen">
            <div class="card">
                <i class="fa-solid fa-question card-back-icon" id="cardBackIcon"></i>
                <span class="placeholder-text" id="initialText"></span>
                <div class="role-title" id="roleText"></div>
            </div>

            <button type="button" id="actionBtn" onclick="handleAction()">Gauti rolę</button>
            <button type="button" id="resetBtn" class="secondary" onclick="resetGame()">Pradėti iš naujo</button>
        </div>

    </div>

    <script>
        const COOLDOWN_SECONDS = 1.0;

        // Išankstiniai žaidimų šablonai
        const PRESETS = {
            among_us: {
                regular: ["žmogus", "gydytojas", "teisėjas", "policininkas"],
                mandatory: ["imposteris", "trintukas", "ligonis"],
                neutral: ["džakalas"]
            },
            mafia: {
                regular: ["miestietis", "komisaras", "daktaras"],
                mandatory: ["mafijozas", "donas"],
                neutral: ["maniakas", "meilužė"]
            }
        };

        const defaultSettings = {
            preset: "among_us",
            mandatory: [...PRESETS.among_us.mandatory],
            neutral: [...PRESETS.among_us.neutral],
            regular: [...PRESETS.among_us.regular],
            customRoles: {
                mandatory: [...PRESETS.among_us.mandatory],
                neutral: [...PRESETS.among_us.neutral],
                regular: [...PRESETS.among_us.regular]
            },
            playerCount: 0,
            badCount: 0,
            neutralCount: 0
        };

        let currentSettings = JSON.parse(JSON.stringify(defaultSettings));
        let availableRoles = [];
        let currentState = "READY_TO_GET"; 
        let gameInProgress = false;
        let cooldownTimer = null;

        function initApp() {
            const savedRaw = localStorage.getItem("game_settings");

            if (savedRaw) {
                try {
                    const parsed = JSON.parse(savedRaw);
                    currentSettings = {
                        preset: parsed.preset || defaultSettings.preset,
                        mandatory: Array.isArray(parsed.mandatory) && parsed.mandatory.length ? parsed.mandatory : [...defaultSettings.mandatory],
                        neutral: Array.isArray(parsed.neutral) ? parsed.neutral : [...defaultSettings.neutral],
                        regular: Array.isArray(parsed.regular) && parsed.regular.length ? parsed.regular : [...defaultSettings.regular],
                        customRoles: parsed.customRoles && typeof parsed.customRoles === "object" ? {
                            mandatory: Array.isArray(parsed.customRoles.mandatory) && parsed.customRoles.mandatory.length ? parsed.customRoles.mandatory : [...defaultSettings.customRoles.mandatory],
                            neutral: Array.isArray(parsed.customRoles.neutral) ? parsed.customRoles.neutral : [...defaultSettings.customRoles.neutral],
                            regular: Array.isArray(parsed.customRoles.regular) && parsed.customRoles.regular.length ? parsed.customRoles.regular : [...defaultSettings.customRoles.regular]
                        } : JSON.parse(JSON.stringify(defaultSettings.customRoles)),
                        playerCount: typeof parsed.playerCount === "number" ? parsed.playerCount : defaultSettings.playerCount,
                        badCount: typeof parsed.badCount === "number" ? parsed.badCount : defaultSettings.badCount,
                        neutralCount: typeof parsed.neutralCount === "number" ? parsed.neutralCount : defaultSettings.neutralCount
                    };
                } catch (e) {
                    currentSettings = JSON.parse(JSON.stringify(defaultSettings));
                }
            }

            setupIndicatorInteractions();
            setupSettingsListeners();
            updateUIStats();
        }

        function saveToStorage() {
            localStorage.setItem("game_settings", JSON.stringify(currentSettings));
        }

        function parseRoleList(text) {
            return [...new Set(text.split(",").map(r => r.trim().toLowerCase()).filter(Boolean))];
        }

        function fillRoleInputs(rolesObj) {
            document.getElementById("setRegular").value = rolesObj.regular.join(", ");
            document.getElementById("setMandatory").value = rolesObj.mandatory.join(", ");
            document.getElementById("setNeutral").value = rolesObj.neutral.join(", ");
        }

        /* --- Nustatymų lango ir šablonų valdymas --- */
        function setupSettingsListeners() {
            const inputs = ["setRegular", "setMandatory", "setNeutral"];
            inputs.forEach(id => {
                document.getElementById(id).addEventListener("input", () => {
                    const presetSelect = document.getElementById("setPreset");
                    if (presetSelect.value !== "custom") {
                        presetSelect.value = "custom";
                    }
                });
            });
        }

        function handlePresetChange() {
            const chosen = document.getElementById("setPreset").value;
            if (chosen === "custom") {
                fillRoleInputs(currentSettings.customRoles);
            } else if (PRESETS[chosen]) {
                fillRoleInputs(PRESETS[chosen]);
            }
        }

        function openSettings() {
            document.getElementById("setPreset").value = currentSettings.preset || "among_us";
            fillRoleInputs(currentSettings);

            document.getElementById("setupScreen").classList.remove("active");
            document.getElementById("settingsScreen").classList.add("active");
        }

        function closeSettings() {
            document.getElementById("settingsScreen").classList.remove("active");
            document.getElementById("setupScreen").classList.add("active");
        }

        function saveSettings() {
            const chosenPreset = document.getElementById("setPreset").value;
            const parsedRegular = parseRoleList(document.getElementById("setRegular").value);
            const parsedMandatory = parseRoleList(document.getElementById("setMandatory").value);
            const parsedNeutral = parseRoleList(document.getElementById("setNeutral").value);

            currentSettings.preset = chosenPreset;
            currentSettings.regular = parsedRegular.length ? parsedRegular : [...defaultSettings.regular];
            currentSettings.mandatory = parsedMandatory.length ? parsedMandatory : [...defaultSettings.mandatory];
            currentSettings.neutral = parsedNeutral;

            // Jei išsaugoma esant "Pasirinktinis", atnaujiname ir customRoles atmintį
            if (chosenPreset === "custom") {
                currentSettings.customRoles = {
                    regular: [...currentSettings.regular],
                    mandatory: [...currentSettings.mandatory],
                    neutral: [...currentSettings.neutral]
                };
            }

            saveToStorage();
            closeSettings();
        }

        function resetToFactoryDefaults() {
            if (confirm("Ar tikrai norite atstatyti gamyklines žaidimo roles ir nustatymus?")) {
                localStorage.removeItem("game_settings");
                currentSettings = JSON.parse(JSON.stringify(defaultSettings));
                updateUIStats();
                closeSettings();
            }
        }

        /* --- Pagalbos lango valdymas --- */
        function openHelp() {
            document.getElementById("setupScreen").classList.remove("active");
            document.getElementById("helpScreen").classList.add("active");
        }

        function closeHelp() {
            document.getElementById("helpScreen").classList.remove("active");
            document.getElementById("setupScreen").classList.add("active");
        }

        /* --- Indikatorių valdymas --- */
        function triggerPlayersBlink() {
            const pill = document.getElementById("pillPlayers");
            pill.classList.remove("blink-alert");
            void pill.offsetWidth;
            pill.classList.add("blink-alert");
        }

        function setupIndicatorInteractions() {
            bindClickAndDoubleClicks("pillPlayers", 
                () => increaseIndicator('players'), 
                () => resetIndicator('players')
            );
            bindClickAndDoubleClicks("pillBad", 
                () => increaseIndicator('bad'), 
                () => resetIndicator('bad')
            );
            bindClickAndDoubleClicks("pillNeutral", 
                () => increaseIndicator('neutral'), 
                () => resetIndicator('neutral')
            );
        }

        function bindClickAndDoubleClicks(elementId, onClick, onDoubleClick) {
            const el = document.getElementById(elementId);
            let clickTimer = null;

            el.addEventListener("click", () => {
                if (clickTimer === null) {
                    clickTimer = setTimeout(() => {
                        clickTimer = null;
                        onClick();
                    }, 250); 
                } else {
                    clearTimeout(clickTimer);
                    clickTimer = null;
                    onDoubleClick();
                }
            });
        }

        function increaseIndicator(type) {
            if (type === 'players') {
                const oldPlayers = currentSettings.playerCount;
                currentSettings.playerCount++;
                
                if (oldPlayers === 0 && currentSettings.playerCount === 1) {
                    currentSettings.badCount = 1;
                }
            } else if (type === 'bad') {
                const combined = currentSettings.badCount + currentSettings.neutralCount;
                if (combined < currentSettings.playerCount) {
                    currentSettings.badCount++;
                } else {
                    triggerPlayersBlink();
                    return;
                }
            } else if (type === 'neutral') {
                const combined = currentSettings.badCount + currentSettings.neutralCount;
                if (combined < currentSettings.playerCount) {
                    currentSettings.neutralCount++;
                } else {
                    triggerPlayersBlink();
                    return;
                }
            }
            saveToStorage();
            updateUIStats();
        }

        function resetIndicator(type) {
            if (type === 'players') {
                currentSettings.playerCount = 0;
                currentSettings.badCount = 0;
                currentSettings.neutralCount = 0;
            } else if (type === 'bad') {
                currentSettings.badCount = 0;
            } else if (type === 'neutral') {
                currentSettings.neutralCount = 0;
            }
            saveToStorage();
            updateUIStats();
        }

        function updateUIStats() {
            document.getElementById("statPlayers").textContent = currentSettings.playerCount;
            document.getElementById("statBad").textContent = currentSettings.badCount;
            document.getElementById("statNeutral").textContent = currentSettings.neutralCount;

            const playBtn = document.getElementById("playBtn");
            if (currentSettings.playerCount === 0) {
                playBtn.classList.add("disabled-look");
            } else {
                playBtn.classList.remove("disabled-look");
            }
        }

        /* --- Žaidimo langas ir logika --- */
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startGame() {
            if (currentSettings.playerCount <= 0) {
                triggerPlayersBlink();
                return;
            }

            prepareNewGame();
            document.getElementById("setupScreen").classList.remove("active");
            document.getElementById("gameScreen").classList.add("active");
        }

        function prepareNewGame() {
            clearTimeout(cooldownTimer);
            gameInProgress = true;

            document.getElementById("actionBtn").classList.remove("hidden");

            const playerCount = currentSettings.playerCount;
            const badCount = currentSettings.badCount;
            const neutralCount = currentSettings.neutralCount;

            const shuffledMandatory = shuffleArray([...currentSettings.mandatory]);
            const chosenBad = shuffledMandatory.slice(0, badCount);
            const fallbackBad = currentSettings.mandatory[0] || "imposteris";
            while (chosenBad.length < badCount) {
                chosenBad.push(fallbackBad);
            }

            const shuffledNeutralPool = shuffleArray([...currentSettings.neutral]);
            const chosenNeutral = shuffledNeutralPool.slice(0, neutralCount);
            const fallbackNeutral = currentSettings.neutral[0] || "džakalas";
            while (chosenNeutral.length < neutralCount) {
                chosenNeutral.push(fallbackNeutral);
            }

            const regularNeeded = Math.max(0, playerCount - chosenBad.length - chosenNeutral.length);
            const shuffledRegular = shuffleArray([...currentSettings.regular]);
            let chosenRegular = shuffledRegular.slice(0, regularNeeded);
            const fallbackRegular = currentSettings.regular[0] || "žmogus";
            while (chosenRegular.length < regularNeeded) {
                chosenRegular.push(fallbackRegular);
            }

            let gameRoles = [...chosenBad, ...chosenNeutral, ...chosenRegular];
            if (gameRoles.length > playerCount) {
                gameRoles = gameRoles.slice(0, playerCount);
            }

            availableRoles = shuffleArray(gameRoles);
            resetToHiddenState();
        }

        function resetToHiddenState() {
            clearTimeout(cooldownTimer);
            currentState = "READY_TO_GET";
            
            const total = currentSettings.playerCount;
            const nextPlayerNumber = total - availableRoles.length + 1;

            document.getElementById("cardBackIcon").style.display = "block";
            
            const initialText = document.getElementById("initialText");
            initialText.style.display = "none";
            initialText.textContent = "";
            
            const roleText = document.getElementById("roleText");
            roleText.style.display = "none";
            roleText.textContent = "";
            roleText.className = "role-title";
            
            const actionBtn = document.getElementById("actionBtn");
            actionBtn.disabled = false;
            actionBtn.textContent = `Gauti rolę (${nextPlayerNumber} iš ${total})`;
        }

        function handleAction() {
            const cardBackIcon = document.getElementById("cardBackIcon");
            const roleText = document.getElementById("roleText");
            const initialText = document.getElementById("initialText");
            const actionBtn = document.getElementById("actionBtn");

            if (currentState === "READY_TO_GET") {
                const selectedRole = availableRoles.shift();

                cardBackIcon.style.display = "none";
                initialText.style.display = "none";
                roleText.textContent = selectedRole;
                
                if (currentSettings.mandatory.includes(selectedRole)) {
                    roleText.className = "role-title alert";
                } else if (currentSettings.neutral.includes(selectedRole)) {
                    roleText.className = "role-title neutral";
                } else {
                    roleText.className = "role-title normal";
                }

                roleText.style.display = "block";
                currentState = "ROLE_SHOWN";

                actionBtn.disabled = true;
                actionBtn.textContent = "Įsiminkite rolę...";

                cooldownTimer = setTimeout(() => {
                    actionBtn.disabled = false;
                    if (availableRoles.length > 0) {
                        actionBtn.innerHTML = 'Įsiminiau <i class="fa-solid fa-check"></i> Kitas žaidėjas <i class="fa-solid fa-arrow-right"></i>';
                    } else {
                        actionBtn.innerHTML = 'Įsiminiau <i class="fa-solid fa-check"></i>';
                    }
                }, COOLDOWN_SECONDS * 1000);

            } else {
                if (availableRoles.length === 0) {
                    cardBackIcon.style.display = "none";
                    roleText.style.display = "none";
                    initialText.style.display = "block";
                    initialText.textContent = "Rolės išdalintos! Gero žaidimo!";
                    
                    actionBtn.classList.add("hidden");
                    gameInProgress = false;
                    return;
                }
                resetToHiddenState();
            }
        }

        function resetGame() {
            if (gameInProgress) {
                if (!confirm("Ar tikrai norite nutraukti rolių dalinimą ir pradėti iš naujo?")) {
                    return;
                }
            }
            clearTimeout(cooldownTimer);
            gameInProgress = false;
            document.getElementById("gameScreen").classList.remove("active");
            document.getElementById("setupScreen").classList.add("active");
        }

        initApp();
    </script>
</body>
</html>
